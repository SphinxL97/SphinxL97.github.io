<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 760" role="img" aria-labelledby="title desc">
  <title id="title">双击向前翻页</title>
  <desc id="desc">碑帖浏览左侧竖排翻页提示，前字加粗，背景为淡雅山水与舟影。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf7ed" stop-opacity=".82"/>
      <stop offset=".52" stop-color="#fffdf8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#f7f0e2" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7c4a1" stop-opacity=".30"/>
      <stop offset="1" stop-color="#d7c4a1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="54" height="758" rx="14" fill="url(#paper)" stroke="#d8c4a1" stroke-opacity=".55"/>

  <!-- 上部远山：极淡，不干扰文字 -->
  <g opacity=".20" fill="none" stroke="#cbb58e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 115 C13 102 18 96 22 103 C27 90 33 82 38 94 C42 88 47 88 51 99" stroke-width="1.4"/>
    <path d="M8 127 C15 117 21 114 26 121 C31 110 38 106 44 115 C47 112 50 113 52 118" stroke-width="1.0"/>
    <path d="M32 86 C37 82 42 82 47 86" stroke-width=".9"/>
  </g>

  <g font-family="SimSun, Songti SC, serif" text-anchor="middle">
    <text x="28" y="190" font-size="20" fill="#c2b7ad">双</text>
    <text x="28" y="238" font-size="20" fill="#c2b7ad">击</text>
    <text x="28" y="286" font-size="20" fill="#c2b7ad">向</text>
    <text x="28" y="348" font-size="34" font-weight="700" fill="#78513d">前</text>
    <text x="28" y="406" font-size="20" fill="#c2b7ad">翻</text>
    <text x="28" y="454" font-size="20" fill="#c2b7ad">页</text>
  </g>

  <!-- 中下部山岚 -->
  <g opacity=".18" fill="url(#mist)" stroke="#c8b28b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 585 C10 570 16 559 21 568 C25 553 31 545 36 557 C41 548 47 551 53 568 L53 630 L4 630 Z" stroke-width="1.0"/>
    <path d="M10 605 C17 594 23 591 28 600 C34 586 41 584 48 598" fill="none" stroke-width=".9"/>
  </g>

  <!-- 水岸、松树与小舟 -->
  <g fill="none" stroke="#bca27a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 675 H48" stroke-width=".9" opacity=".20"/>
    <path d="M12 686 C20 682 28 682 36 686 C42 689 47 689 51 687" stroke-width=".8" opacity=".18"/>
    <path d="M39 648 C39 633 40 621 42 611" stroke-width="1.0" opacity=".24"/>
    <path d="M41 619 C36 616 34 611 35 606 C40 607 43 610 44 615" stroke-width=".9" opacity=".22"/>
    <path d="M42 625 C47 621 50 621 53 623" stroke-width=".9" opacity=".20"/>
    <path d="M16 704 C23 708 31 708 38 704" stroke-width="1.1" opacity=".28"/>
    <path d="M18 704 H36" stroke-width="1.0" opacity=".26"/>
    <path d="M27 704 L28 696" stroke-width=".9" opacity=".24"/>
    <path d="M28 696 C31 697 33 699 34 702" stroke-width=".8" opacity=".20"/>
  </g>
  <circle cx="45" cy="92" r="1.1" fill="#bca27a" opacity=".17"/>
  <circle cx="49" cy="88" r=".8" fill="#bca27a" opacity=".13"/>
</svg>
