<h1>项目说明</h1>
<p>本项目以上海图书馆碑帖开放数据为基础，先选取《道因法师碑》制作网页展示样例。页面整合碑帖元数据、背景说明、版本题跋、完整释文和 IIIF 逐页释文，并加入 AI 辅助导读模块。</p>
<p>当前版本不做在线 OCR、不做实时 AI 调用，也不修改原始释文中的 □ 与 ?。AI 内容仅作为阅读辅助，后续可由人工复核后逐步完善。</p>
<h2>后续扩展</h2>
<ul><li>补充其余 44 件碑帖的图像、释文、背景说明。</li><li>为每件碑帖生成 AI 分段导读与插画提示。</li><li>扩展全文检索到 45 件碑帖。</li></ul>
