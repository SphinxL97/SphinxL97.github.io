name: Finalize work027 case locations

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: fix-work027-locations
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/work027-wei-five'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/work027-wei-five
          fetch-depth: 0

      - name: Rebuild case first-square locations
        run: python3 scripts/fix_work027_locations.py

      - name: Validate all cases
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cases=json.loads(Path('data/work027_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work027_coordinate_report.json').read_text(encoding='utf-8'))
          assert len(cases)==report['case_count']==100
          assert report['located_case_count']==100
          assert report['unlocated_case_count']==0
          assert report['case_first_square_locations_verified'] is True
          assert all(len(x.get('locations') or [])==1 for x in cases)
          assert all((x['locations'][0].get('bbox') or {}).get('w',0)>0 for x in cases)
          assert sum(x['square_count'] for x in cases)==161
          assert sum(x['remaining_square_count'] for x in cases)==161
          pages=[x['page'] for x in cases]
          assert pages==sorted(pages), pages
          print({'cases':len(cases),'located':report['located_case_count'],'first_page':pages[0],'last_page':pages[-1]})
          PY
          node --check js/work-027.js
          node --check js/work-027-coordinate-adapter.js

      - name: Remove temporary finalizer files
        run: |
          rm -f scripts/fix_work027_locations.py
          rm -f .github/workflows/fix-work027-locations.yml

      - name: Commit finalized locations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize work027 case locations"
          git push origin HEAD:agent/work027-wei-five
