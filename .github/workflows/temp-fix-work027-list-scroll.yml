name: Temporary fix work027 list scroll
on:
  push:
    branches: [fix/work027-list-scroll]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/work027-list-scroll
          fetch-depth: 0
      - name: Apply fix
        run: python scripts/fix_work027_list_scroll.py
      - name: Validate
        run: |
          node --check js/work-027.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          python - <<'PY'
          from pathlib import Path
          work=Path('js/work-027.js').read_text(encoding='utf-8')
          router=Path('js/damage_ai_reading.js').read_text(encoding='utf-8')
          entry=Path('js/detail_info_patch.js').read_text(encoding='utf-8')
          detail=Path('detail.html').read_text(encoding='utf-8')
          tag='20260725_wei_five_scroll_v1'
          assert work.count('function syncDamageListToCurrent') == 1
          assert work.count('syncDamageListToCurrent(section);') == 1
          assert 'active.offsetTop-(list.clientHeight-active.offsetHeight)/2' in work
          assert tag in work and tag in router and tag in entry and tag in detail
          print({'scroll_fix': True, 'cache': tag})
          PY
      - name: Remove temporary files
        run: |
          rm -f scripts/fix_work027_list_scroll.py
          rm -f .github/workflows/temp-fix-work027-list-scroll.yml
          rm -f .work027-list-scroll-trigger
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/work-027.js js/damage_ai_reading.js js/detail_info_patch.js detail.html
          git add -u scripts/fix_work027_list_scroll.py .github/workflows/temp-fix-work027-list-scroll.yml .work027-list-scroll-trigger
          git commit -m '修复027栏目三案例列表跳回顶部'
          git push origin HEAD:fix/work027-list-scroll
