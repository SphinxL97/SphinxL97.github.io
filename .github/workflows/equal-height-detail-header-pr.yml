name: Apply equal-height detail header

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/equal-height-detail-header'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/equal-height-detail-header
          fetch-depth: 1

      - name: Apply equal-height shared header migration
        run: python scripts/equal_height_detail_header.py

      - name: Validate equal height and scope
        run: |
          node --check js/detail_info_patch.js
          node --check js/detail_info_patch_core.js
          python - <<'PY'
          from pathlib import Path
          import subprocess

          core=Path('js/detail_info_patch_core.js').read_text(encoding='utf-8')
          entry=Path('js/detail_info_patch.js').read_text(encoding='utf-8')
          html=Path('detail.html').read_text(encoding='utf-8')

          assert 'height:430px!important' in core
          assert 'align-items:stretch!important' in core
          assert 'grid-template-rows:auto minmax(0,1fr)!important' in core
          assert 'align-content:space-between!important' in core
          assert 'overflow-y:auto!important' in core
          assert '@media(max-width:1180px)' in core
          assert 'height:auto!important;align-items:start!important' in core
          assert '__DETAIL_INFO_STABLE_ENTRY_V16__' in entry
          assert '20260724_equal_height_header_v1' in entry
          assert '20260724_equal_height_header_v1' in html

          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={'detail.html','js/detail_info_patch.js','js/detail_info_patch_core.js'}
          assert changed == expected, changed
          print('equal-height detail header validation ok')
          PY

      - name: Commit final shared files and remove temporary files
        run: |
          rm -f .github/workflows/equal-height-detail-header-pr.yml scripts/equal_height_detail_header.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match detail information card to cover height"
          git push origin HEAD:agent/equal-height-detail-header
