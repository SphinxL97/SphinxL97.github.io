name: Diagnose Work044 implementation

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/work044-cui-jingyong-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture rendered Work044 state
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/work044-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json

          report = {'cases': [], 'errors': []}
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={'width': 1600, 'height': 1100})
              page.on('pageerror', lambda exc: report['errors'].append(str(exc)))
              page.goto('http://127.0.0.1:8000/detail.html?id=044', wait_until='networkidle')
              page.wait_for_function('() => Boolean(window.__WORK_044_STABLE_READY__ && window.__WORK_044_CROWDSOURCE_READY__)')

              transcript = page.locator('#calligraphy').inner_text()
              report['transcript'] = {
                  'square_count': transcript.count('□'),
                  'has_ascii_question': '?' in transcript,
                  'has_cn_question': '？' in transcript,
                  'has_candidates': any(x in transcript for x in ['〔揃〕','〔礼〕','〔隧〕']),
                  'text': transcript,
              }
              report['case_tab_count'] = page.locator('#people .damage-tab').count()
              report['image_heading'] = page.locator('#people .damage-card.damage-image-card h3').inner_text()

              for index in range(3):
                  page.locator(f'#people [data-case-index="{index}"]').click()
                  page.wait_for_timeout(200)
                  report['cases'].append({
                      'index': index,
                      'panel_text': page.locator('#people').inner_text(),
                      'svg_count': page.locator('#people .damage-crop-svg').count(),
                      'box_count': page.locator('#people .damage-box').count(),
                      'caption': page.locator('#people .damage-caption').inner_text() if page.locator('#people .damage-caption').count() else '',
                      'image_href': page.locator('#people .damage-crop-svg image').get_attribute('href') if page.locator('#people .damage-crop-svg image').count() else '',
                  })

              report['crowd_tab_count'] = page.locator('#places .crowd-tab').count()
              if report['crowd_tab_count'] >= 3:
                  page.locator('#places .crowd-tab').nth(2).click()
                  page.wait_for_timeout(500)
                  report['crowd_text'] = page.locator('#places').inner_text()
                  report['crowd_values'] = page.evaluate("""
                    () => {
                      const result = {};
                      document.querySelectorAll('#places .crowd-field').forEach(field => {
                        const label = (field.querySelector('label')?.textContent || '').replace('*','').trim();
                        const control = field.querySelector('input,textarea,select');
                        if (label && control) result[label] = control.value;
                      });
                      return result;
                    }
                  """)

              report['page_option_count'] = page.locator('#pageSelect option').count()
              page.select_option('#pageSelect', index=10)
              page.wait_for_timeout(1000)
              report['page11_box_count'] = page.locator('#imageWrap .glyph-box').count()
              page.select_option('#pageSelect', index=0)
              page.wait_for_timeout(600)
              report['page1_box_count'] = page.locator('#imageWrap .glyph-box').count()

              page.locator('#people').scroll_into_view_if_needed()
              page.screenshot(path='/tmp/work044-diagnostic.png', full_page=True)
              browser.close()

          Path('/tmp/work044-diagnostic.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: work044-diagnostic
          path: |
            /tmp/work044-diagnostic.json
            /tmp/work044-diagnostic.png
          retention-days: 2
