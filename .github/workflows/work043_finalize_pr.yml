name: Finalize Work043 fix from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/fix-work043-page-crowdsource'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-work043-page-crowdsource
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply fixes
        run: python tools/work043_finalize_temp.py
      - name: Commit clean final diff
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "修复043页码与众智释读格式 [skip ci]"
          git push origin HEAD:agent/fix-work043-page-crowdsource
