name: Diagnose work034 recovery basis

on:
  push:
    branches:
      - agent/diagnose-work034-recovery-basis
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24
      - name: Start local website
        run: |
          python3 -m http.server 8000 > /tmp/work034-http.log 2>&1 &
          echo $! > /tmp/work034-http.pid
          sleep 2
      - name: Inspect rendered DOM
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser || true)"
          echo "CHROME_PATH=$CHROME_PATH"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node <<'NODE'
          const puppeteer = require('puppeteer-core');
          (async()=>{
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME_PATH,
              headless: true,
              args: ['--no-sandbox','--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            page.on('console', msg => console.log('[BROWSER CONSOLE]', msg.type(), msg.text()));
            page.on('pageerror', error => console.log('[PAGE ERROR]', error.stack || error.message));
            page.on('requestfailed', req => console.log('[REQUEST FAILED]', req.url(), req.failure()?.errorText));
            await page.goto('http://127.0.0.1:8000/detail.html?id=034', {waitUntil:'networkidle0', timeout:120000});
            await new Promise(resolve=>setTimeout(resolve,5000));
            const result = await page.evaluate(()=>{
              const people=document.getElementById('people');
              const exact=[];
              const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
              let node;
              while((node=walker.nextNode())){
                if(String(node.nodeValue||'').includes('恢复依据')){
                  let el=node.parentElement;
                  exact.push({
                    text:node.nodeValue,
                    tag:el?.tagName,
                    className:el?.className,
                    parentTag:el?.parentElement?.tagName,
                    parentClass:el?.parentElement?.className,
                    closestDamageBlock:el?.closest('.damage-block')?.outerHTML||null,
                    closestSection:el?.closest('section')?.outerHTML?.slice(0,3000)||null,
                    ancestors:(()=>{const a=[];let p=el;for(let i=0;p&&i<8;i++,p=p.parentElement)a.push({tag:p.tagName,id:p.id,className:p.className,datasets:{...p.dataset}});return a;})()
                  });
                }
              }
              return {
                url:location.href,
                workFlags:{
                  dedicated:window.__WORK_034_ZHANGJILAO__,
                  stable:window.__WORK_034_STABLE_READY__,
                  router74:window.__DAMAGE_AI_READING_ROUTER_V74__,
                  router73:window.__DAMAGE_AI_READING_ROUTER_V73__,
                  category:window.__DAMAGE_CATEGORY_STANDARDIZER_V2__
                },
                peopleDataset:people?{...people.dataset}:null,
                exact,
                damageBlocks:Array.from(document.querySelectorAll('#people .damage-block')).map((el,index)=>({index,className:el.className,label:el.querySelector('.damage-label')?.textContent?.trim()||'',text:el.innerText.slice(0,500),html:el.outerHTML.slice(0,1500)})),
                basisSelectors:{
                  block:document.querySelectorAll('#people .damage-basis-block').length,
                  card:document.querySelectorAll('#people .damage-basis-card').length,
                  data:document.querySelectorAll('#people [data-damage-basis]').length
                },
                scripts:Array.from(document.scripts).map(s=>s.src||'[inline]').filter(src=>src.includes('damage')||src.includes('work-034')||src.includes('detail_info')),
                peopleHTML:people?.innerHTML||''
              };
            });
            console.log('=== WORK034 DOM DIAGNOSIS ===');
            console.log(JSON.stringify({...result,peopleHTML:undefined},null,2));
            require('fs').writeFileSync('/tmp/work034-people.html', result.peopleHTML);
            await page.screenshot({path:'/tmp/work034-page.png',fullPage:true});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: work034-dom-diagnosis
          path: |
            /tmp/work034-people.html
            /tmp/work034-page.png
            /tmp/work034-http.log
