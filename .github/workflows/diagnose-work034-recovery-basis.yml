name: Fix work034 visible evidence block

on:
  push:
    branches:
      - agent/diagnose-work034-recovery-basis

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/diagnose-work034-recovery-basis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply actual removal
        run: python scripts/fix_work034_remove_evidence.py
      - name: Static validation
        run: |
          node --check js/work-034.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          python - <<'PY'
          from pathlib import Path
          work=Path('js/work-034.js').read_text(encoding='utf-8')
          assert 'damage-evidence-block' not in work
          assert '>AI分析依据<' not in work
          assert '>恢复依据<' not in work
          assert '>恢复后的上下文<' in work
          print('static visible-evidence removal passed')
          PY
      - name: Install browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Start local website
        run: |
          python3 -m http.server 8000 > /tmp/work034-http.log 2>&1 &
          sleep 2
      - name: Browser validation
        run: |
          CHROME_PATH="$(which google-chrome || which chromium || which chromium-browser || true)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-setuid-sandbox']});
            const page=await browser.newPage();
            page.on('pageerror',error=>console.error('[pageerror]',error.stack||error.message));
            await page.goto('http://127.0.0.1:8000/detail.html?id=034',{waitUntil:'networkidle2',timeout:120000});
            await new Promise(resolve=>setTimeout(resolve,5000));
            async function audit(stage){
              const result=await page.evaluate(()=>({
                labels:Array.from(document.querySelectorAll('#people .damage-label')).map(el=>el.textContent.trim()),
                evidenceBlocks:document.querySelectorAll('#people .damage-evidence-block').length,
                expandButtons:document.querySelectorAll('#people [data-action="expand"]').length,
                basisText:(document.getElementById('people')?.innerText||'').includes('恢复依据'),
                analysisText:(document.getElementById('people')?.innerText||'').includes('AI分析依据'),
                contextText:(document.getElementById('people')?.innerText||'').includes('恢复后的上下文'),
                script:Array.from(document.scripts).map(s=>s.src).find(src=>src.includes('/js/work-034.js'))||''
              }));
              console.log(stage,JSON.stringify(result));
              if(result.evidenceBlocks!==0||result.expandButtons!==0||result.basisText||result.analysisText||!result.contextText||!result.script.includes('20260726_zhangjilao_034_v3'))throw new Error(`browser audit failed at ${stage}`);
            }
            await audit('initial');
            const next=await page.$('#people [data-action="next"]');
            if(next){await next.click();await new Promise(resolve=>setTimeout(resolve,500));}
            await audit('after-next');
            await page.screenshot({path:'/tmp/work034-after-removal.png',fullPage:true});
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
      - name: Commit clean result
        run: |
          rm -rf node_modules
          rm -f scripts/fix_work034_remove_evidence.py .github/workflows/diagnose-work034-recovery-basis.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "彻底删除034依据分析区块"
          git push origin agent/diagnose-work034-recovery-basis
