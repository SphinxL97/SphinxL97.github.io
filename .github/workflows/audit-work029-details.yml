name: Audit work029 details
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - scripts/audit_work029_details.py
      - .github/workflows/audit-work029-details.yml
jobs:
  audit:
    if: github.head_ref == 'agent/work029-xianyu'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work029-xianyu
          fetch-depth: 0
      - run: python scripts/audit_work029_details.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/work029_details_existing.json
          git commit -m '暂存029详情结构审计结果'
          git push origin HEAD:agent/work029-xianyu
