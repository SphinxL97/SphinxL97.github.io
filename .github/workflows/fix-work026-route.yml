name: Fix work026 route isolation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/work026-magushan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work026-magushan
          fetch-depth: 0

      - name: Isolate 026 from legacy case patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('js/damage_ai_reading.js')
          text=path.read_text(encoding='utf-8')
          old='["003","004","005","006","007","010","011","013","014","015","016","017","018","020","022","023","024","025"].includes(id)'
          new='["003","004","005","006","007","010","011","013","014","015","016","017","018","020","022","023","024","025","026"].includes(id)'
          if old not in text:
              raise SystemExit('legacy exclusion list not found')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          node --check js/damage_ai_reading.js
          node --check js/work-026.js
          node --check js/work-026-coordinate-adapter.js

      - name: Remove one-off workflow and commit
        run: |
          rm -f .github/workflows/fix-work026-route.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate work026 from legacy case patches"
          git push origin HEAD:agent/work026-magushan
