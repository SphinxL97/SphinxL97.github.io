name: Temporary audit work036 coordinates

on:
  push:
    branches:
      - agent/add-work036-yiheming
    paths:
      - 'scripts/_tmp_audit_work036.py'
      - '.github/workflows/_tmp_audit_work036.yml'

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-work036-yiheming
          fetch-depth: 0
      - name: Extract work036 model audit
        run: python3 scripts/_tmp_audit_work036.py
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/_tmp_work036_coordinate_audit.json
          git commit -m '生成036坐标审计报告 [skip ci]'
          git push origin HEAD:agent/add-work036-yiheming
