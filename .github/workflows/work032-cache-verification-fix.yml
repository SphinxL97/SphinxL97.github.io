name: work032-cache-verification-fix
on:
  push:
    branches: [agent/work032-clean-removal-audit]
    paths: [.work032-cache-fix-trigger]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work032-clean-removal-audit
          fetch-depth: 0
      - name: Patch cache chain
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('js/damage_ai_reading.js'): [
                  ('__DAMAGE_AI_READING_ROUTER_V71__', '__DAMAGE_AI_READING_ROUTER_V72__'),
                  ('window.__DAMAGE_AI_READING_ROUTER_V72__=true;\n  window.__DAMAGE_AI_READING_ROUTER_V70__=true;', 'window.__DAMAGE_AI_READING_ROUTER_V72__=true;\n  window.__DAMAGE_AI_READING_ROUTER_V71__=true;\n  window.__DAMAGE_AI_READING_ROUTER_V70__=true;'),
                  ('js/work-032.js?v=20260725_xuzhenren_032_v1', 'js/work-032.js?v=20260726_xuzhenren_032_v2'),
              ],
              Path('js/detail_info_patch.js'): [
                  ('__DETAIL_INFO_STABLE_ENTRY_V31__', '__DETAIL_INFO_STABLE_ENTRY_V32__'),
                  ('window.__DETAIL_INFO_STABLE_ENTRY_V32__=true;\n  window.__DETAIL_INFO_STABLE_ENTRY_V30__=true;', 'window.__DETAIL_INFO_STABLE_ENTRY_V32__=true;\n  window.__DETAIL_INFO_STABLE_ENTRY_V31__=true;\n  window.__DETAIL_INFO_STABLE_ENTRY_V30__=true;'),
                  ('20260725_global_route_recovery_v7', '20260726_global_route_recovery_v8'),
              ],
              Path('detail.html'): [
                  ('js/detail_info_patch.js?v=20260725_xuzhenren032_v1', 'js/detail_info_patch.js?v=20260726_xuzhenren032_v2'),
                  ('js/damage_ai_reading.js?v=20260725_xuzhenren032_v1', 'js/damage_ai_reading.js?v=20260726_xuzhenren032_v2'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          work = Path('js/work-032.js').read_text(encoding='utf-8')
          required = ['恢复后的上下文', 'AI分析依据', 'removeRecoveryBasis', 'damage-basis-block']
          for token in required:
              if token not in work:
                  raise SystemExit(f'work032 missing {token}')
          template = work.split('section.innerHTML=', 1)[1].split(';\n    const list=', 1)[0]
          if '恢复依据' in template:
              raise SystemExit('work032 render template still contains 恢复依据')
          PY
      - name: Validate JavaScript and cache references
        run: |
          node --check js/work-032.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          grep -q 'js/work-032.js?v=20260726_xuzhenren_032_v2' js/damage_ai_reading.js
          grep -q '20260726_global_route_recovery_v8' js/detail_info_patch.js
          grep -q 'js/detail_info_patch.js?v=20260726_xuzhenren032_v2' detail.html
          grep -q 'js/damage_ai_reading.js?v=20260726_xuzhenren032_v2' detail.html
      - name: Commit patch and remove temporary files
        run: |
          rm -f .github/workflows/work032-cache-verification-fix.yml .work032-cache-fix-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/work-032.js js/damage_ai_reading.js js/detail_info_patch.js detail.html .github/workflows/work032-cache-verification-fix.yml .work032-cache-fix-trigger
          git commit -m 'Complete work032 recovery basis removal cache chain'
          git push origin HEAD:agent/work032-clean-removal-audit