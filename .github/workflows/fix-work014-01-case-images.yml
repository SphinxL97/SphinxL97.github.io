name: Fix work014-01 case images

on:
  push:
    branches:
      - agent/fix-work014-01-case-images
    paths:
      - '.github/workflows/fix-work014-01-case-images.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-work014-01-case-images
          fetch-depth: 0
      - name: Patch deterministic image paths and cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '20260723_lihanjing_014_01_v2'
          new = '20260723_lihanjing_014_01_v3'

          work = Path('js/work-014.js')
          text = work.read_text('utf-8')
          text = text.replace(old, new)

          root_line = '  const PAGE_INDEX_URL=`data/page_images_index.json?v=${VERSION}`;\n'
          root_insert = root_line + '  const PAGE_IMAGE_ROOT="assets/page_images/014_颜真卿李玄靖碑/images/01_顏真卿李玄靖碑册一";\n'
          if 'const PAGE_IMAGE_ROOT=' not in text:
              if root_line not in text:
                  raise SystemExit('PAGE_INDEX_URL anchor missing')
              text = text.replace(root_line, root_insert, 1)

          location_anchor = '  function makeLocation(item){\n'
          helper = '''  function chinesePageLabel(value){
    const page=Number(value||0);
    if(page<=0)return "";
    const digits=["零","一","二","三","四","五","六","七","八","九"];
    if(page<10)return digits[page];
    if(page<20)return `十${page===10?"":digits[page%10]}`;
    const tens=Math.floor(page/10),ones=page%10;
    return `${digits[tens]}十${ones?digits[ones]:""}`;
  }

  function directPageImage(page){
    const pageNo=Number(page||0);
    if(pageNo<1||pageNo>76)return "";
    return `${PAGE_IMAGE_ROOT}/${String(pageNo).padStart(4,"0")}_${chinesePageLabel(pageNo)}.jpg`;
  }

'''
          if 'function directPageImage(' not in text:
              if location_anchor not in text:
                  raise SystemExit('makeLocation anchor missing')
              text = text.replace(location_anchor, helper + location_anchor, 1)

          old_return = '    return {page,image:pageImages.get(page)||String(source.image||""),canvas,target,crop};'
          new_return = '    const image=String(source.image||"")||pageImages.get(page)||directPageImage(page);\n    return {page,image,canvas,target,crop};'
          if old_return in text:
              text = text.replace(old_return, new_return, 1)
          elif 'const image=String(source.image||"")||pageImages.get(page)||directPageImage(page);' not in text:
              raise SystemExit('image return anchor missing')

          work.write_text(text, 'utf-8')

          for name in ('js/damage_ai_reading.js','js/detail_info_patch.js','detail.html'):
              path=Path(name)
              value=path.read_text('utf-8')
              if old not in value and new not in value:
                  raise SystemExit(f'cache token missing: {name}')
              path.write_text(value.replace(old,new),'utf-8')

          workflow=Path('.github/workflows/fix-work014-01-case-images.yml')
          workflow.unlink()
          PY
      - name: Verify patch
        run: |
          grep -q 'function directPageImage' js/work-014.js
          grep -q '014_01_v3' js/work-014.js
          grep -q '014_01_v3' js/damage_ai_reading.js
          grep -q '014_01_v3' js/detail_info_patch.js
          grep -q '014_01_v3' detail.html
          test ! -e .github/workflows/fix-work014-01-case-images.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复014-01栏目三图片路径依赖"
          git push origin HEAD:agent/fix-work014-01-case-images
