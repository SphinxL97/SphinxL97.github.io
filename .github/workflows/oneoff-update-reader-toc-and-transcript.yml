name: One-off update reader toc and transcript bar

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/reader-layout-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Update only reader directory labels and transcript bar style
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/detail_info_patch.js')
          text = path.read_text(encoding='utf-8')

          old_width = "\n".join([
              '        width:100%;',
              '        max-width:none;',
              '        min-height:54px;',
          ])
          new_width = "\n".join([
              '        width:calc(100% - 56px);',
              '        max-width:1040px;',
              '        min-height:54px;',
          ])
          if old_width in text:
              text = text.replace(old_width, new_width, 1)
          elif new_width not in text:
              raise RuntimeError('Bottom transcript width block not found')

          old_label = "\n".join([
              '        color:#9f3025;',
              '        font-weight:900;',
              '        letter-spacing:.08em;',
          ])
          new_label = "\n".join([
              '        color:#9f3025;',
              '        font-family:"SimSun","Songti SC",serif;',
              '        font-size:19px;',
              '        font-weight:900;',
              '        letter-spacing:.08em;',
          ])
          if old_label in text:
              text = text.replace(old_label, new_label, 1)
          elif new_label not in text:
              raise RuntimeError('Bottom transcript label style not found')

          old_mobile = "\n".join([
              '        .reader-info.page-transcript-bottom{grid-template-columns:82px minmax(0,1fr);}',
              '        .page-transcript-bottom-label{padding:0 8px;font-size:12px;}',
          ])
          new_mobile = "\n".join([
              '        .reader-info.page-transcript-bottom{width:calc(100% - 16px);max-width:none;grid-template-columns:82px minmax(0,1fr);}',
              '        .page-transcript-bottom-label{padding:0 8px;font-size:17px;}',
          ])
          if old_mobile in text:
              text = text.replace(old_mobile, new_mobile, 1)
          elif new_mobile not in text:
              raise RuntimeError('Mobile transcript style block not found')

          marker = '/* 全部碑帖页面统一目录文字；仅改显示名称，不改链接与栏目内容。 */'
          if marker not in text:
              appendix = "\n".join([
                  '',
                  '',
                  marker,
                  '(function(){',
                  '  const labels=[',
                  '    "一、碑帖浏览",',
                  '    "二、碑文释文",',
                  '    "三、残缺字迹展示",',
                  '    "四、众智释读",',
                  '    "五、书法艺术赏析"',
                  '  ];',
                  '',
                  '  function applyReaderTocLabels(){',
                  '    document.querySelectorAll(".side a").forEach((link,index)=>{',
                  '      if(labels[index]) link.textContent=labels[index];',
                  '    });',
                  '  }',
                  '',
                  '  if(document.readyState==="loading"){',
                  '    document.addEventListener("DOMContentLoaded",applyReaderTocLabels);',
                  '  }else{',
                  '    applyReaderTocLabels();',
                  '  }',
                  '})();',
                  '',
              ])
              text += appendix

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit requested reader display changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/detail_info_patch.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update reader directory labels and transcript bar style"
          git push origin HEAD:${{ github.head_ref }}
