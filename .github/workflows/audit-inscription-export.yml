name: Audit inscription export

on:
  push:
    branches:
      - agent/export-33-inscriptions
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout text and data only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /tools/
            /data/
            /js/
            /*.html

      - name: Show checked-out size
        run: |
          du -sh .
          find data js -type f 2>/dev/null | wc -l

      - name: Correct repository-relative skip check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/audit_inscription_export.py')
          s = p.read_text(encoding='utf-8')
          old = 'def should_skip(path: Path) -> bool:\n    s = path.as_posix()\n    return any(part in s for part in SKIP_PARTS)'
          new = '''def should_skip(path: Path) -> bool:
              rel = path.relative_to(ROOT).as_posix()
              parts = set(path.relative_to(ROOT).parts)
              if '.git' in parts or 'node_modules' in parts:
                  return True
              return any(rel == prefix or rel.startswith(prefix + '/') for prefix in SKIP_PARTS if '/' in prefix)'''
          if old not in s:
              raise SystemExit('Expected skip-check block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Audit transcription and correction data
        run: python3 tools/audit_inscription_export.py

      - name: Collect full texts and repair sources
        run: |
          rm -rf inscription_source_bundle
          mkdir -p inscription_source_bundle/data inscription_source_bundle/js
          find data -maxdepth 1 -type f \( \
            -name '*full_text.txt' -o \
            -name '*damage_cases.json' -o \
            -name '*damage_case*.json' -o \
            -name 'beitie_catalog.json' -o \
            -name 'beitie_details.json' -o \
            -name 'beitie_header_info.json' -o \
            -name 'beitie_search_metadata.json' -o \
            -name 'page_images_index.json' \
          \) -print -exec cp '{}' inscription_source_bundle/data/ \;
          find js -maxdepth 1 -type f \( \
            -name 'work-*.js' -o \
            -name 'damage*.js' -o \
            -name 'full_transcript.js' -o \
            -name 'transcript-*.js' \
          \) -print -exec cp '{}' inscription_source_bundle/js/ \;
          find inscription_source_bundle -type f | sort > inscription_source_bundle/manifest.txt
          zip -qr inscription_source_bundle.zip inscription_source_bundle
          du -sh inscription_source_bundle inscription_source_bundle.zip

      - name: Upload audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: inscription-audit-bundle
          path: |
            inscription_audit_bundle.zip
            output_inscription_audit/summary.txt
            output_inscription_audit/summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload source bundle
        uses: actions/upload-artifact@v4
        with:
          name: inscription-source-bundle
          path: inscription_source_bundle.zip
          if-no-files-found: error
          retention-days: 7
