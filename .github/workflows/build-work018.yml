name: Build work018 data

on:
  push:
    branches:
      - agent/add-work018-songgao
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-work018-songgao
          fetch-depth: 0
      - name: Build work018 coordinates and modules
        run: python tools/tmp_build_work018.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/work018_full_text.txt data/work018_damage_cases.json data/work018_coordinate_report.json
          git add data/glyph_boxes/iiif/018 data/page_images_index.json data/beitie_catalog.json data/beitie_header_info.json
          git add js/work-018.js js/work-018-coordinate-adapter.js js/damage_ai_reading.js js/detail_info_patch.js detail.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "完成018碑文案例与逐页坐标"
            git push origin HEAD:agent/add-work018-songgao
          fi
