name: Validate Work031 volumes

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.head_ref == 'agent/work031-huangtingjian-volumes-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work031-huangtingjian-volumes-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture actual rendering
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/work031-http.log 2>&1 &
          python - <<'PY' > /tmp/work031-validation.log 2>&1
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json, traceback

          results={}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for vid in ('031-01','031-02'):
                  page=browser.new_page(viewport={'width':1500,'height':1000})
                  errors=[]
                  page.on('pageerror',lambda exc, errors=errors: errors.append(str(exc)))
                  row={'errors':errors}
                  try:
                      page.goto(f'http://127.0.0.1:8000/detail.html?id={vid}',wait_until='networkidle')
                      flag='__WORK_031_01_STABLE_READY__' if vid=='031-01' else '__WORK_031_02_STABLE_READY__'
                      crowd='__WORK_031_01_CROWDSOURCE_READY__' if vid=='031-01' else '__WORK_031_02_CROWDSOURCE_READY__'
                      page.wait_for_function(f'() => Boolean(window.{flag} && window.{crowd})',timeout=30000)
                      page.wait_for_selector('#people .damage-shell',timeout=30000)
                      page.wait_for_selector('#calligraphy .full-transcript-body',timeout=30000)
                      transcript=page.locator('#calligraphy .full-transcript-body').inner_text()
                      row.update({
                          'options':page.locator('#pageSelect option').count(),
                          'squares':transcript.count('□'),
                          'bracket_open':transcript.count('〔'),
                          'strongs':page.locator('#calligraphy strong.transcript-problem-sentence').count(),
                          'tabs':page.locator('#people .damage-tab').count(),
                          'damage_text':page.locator('#people').inner_text(),
                          'places_text':page.locator('#places').inner_text(),
                      })
                      tabs=page.locator('#people .damage-tab')
                      visual=[]
                      for i in range(tabs.count()):
                          tabs.nth(i).click();page.wait_for_timeout(100)
                          visual.append({
                              'index':i+1,
                              'red':page.locator('#people .damage-box').count(),
                              'caption':page.locator('#people .damage-caption').all_inner_texts(),
                              'missing':page.locator('#people .work031-location-missing').all_inner_texts(),
                          })
                      row['visual']=visual
                      for label,index in [('special',0 if vid=='031-01' else 57),('model',8 if vid=='031-01' else 10)]:
                          page.evaluate(f'loadPage({index})');page.wait_for_timeout(650)
                          row[label+'_boxes']=page.locator('#imageWrap .glyph-box').count()
                          row[label+'_status']=page.locator('#readerStatus').inner_text()
                      page.screenshot(path=f'/tmp/{vid}.png',full_page=True)
                  except Exception as exc:
                      row['exception']=repr(exc)
                      row['traceback']=traceback.format_exc()
                      try: page.screenshot(path=f'/tmp/{vid}.png',full_page=True)
                      except Exception: pass
                  results[vid]=row
                  page.close()
              browser.close()
          Path('/tmp/work031-validation.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
          cat /tmp/work031-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work031-validation
          path: |
            /tmp/031-01.png
            /tmp/031-02.png
            /tmp/work031-validation.json
            /tmp/work031-validation.log
            /tmp/work031-http.log
          retention-days: 2
