name: Validate Work031 volumes

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.head_ref == 'agent/work031-huangtingjian-volumes-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work031-huangtingjian-volumes-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Diagnose final crowdsource rendering
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/work031-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json,traceback
          result={}
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for vid in ('031-01','031-02'):
                  page=browser.new_page(viewport={'width':1500,'height':1000})
                  row={};errors=[];page.on('pageerror',lambda exc,errors=errors:errors.append(str(exc)))
                  try:
                      page.goto(f'http://127.0.0.1:8000/detail.html?id={vid}',wait_until='networkidle')
                      flag='__WORK_031_01_STABLE_READY__' if vid=='031-01' else '__WORK_031_02_STABLE_READY__'
                      crowd='__WORK_031_01_CROWDSOURCE_READY__' if vid=='031-01' else '__WORK_031_02_CROWDSOURCE_READY__'
                      page.wait_for_function(f'() => Boolean(window.{flag} && window.{crowd})',timeout=30000)
                      row['strongs']=page.locator('#calligraphy strong.transcript-problem-sentence').count()
                      row['crowd_tabs']=page.locator('#places .crowd-tab').count()
                      row['tab_texts']=page.locator('#places .crowd-tab').all_inner_texts()
                      row['before']=page.locator('#places').inner_text()
                      page.locator('#places .crowd-tab').nth(2).click();page.wait_for_timeout(700)
                      row['after']=page.locator('#places').inner_text()
                      row['cards']=page.locator('#places .crowd-simple-card').count()
                      row['heads']=page.locator('#places .crowd-simple-head').all_inner_texts()
                      row['errors']=errors
                      page.screenshot(path=f'/tmp/{vid}.png',full_page=True)
                  except Exception as exc:
                      row['exception']=repr(exc);row['traceback']=traceback.format_exc();row['errors']=errors
                  result[vid]=row;page.close()
              browser.close()
          Path('/tmp/work031-crowd-diagnostic.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work031-crowd-diagnostic
          path: |
            /tmp/031-01.png
            /tmp/031-02.png
            /tmp/work031-crowd-diagnostic.json
            /tmp/work031-http.log
          retention-days: 2
