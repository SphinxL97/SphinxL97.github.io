name: Generate work017 data

on:
  push:
    branches:
      - agent/add-work017-zhangmenglong
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-work017-zhangmenglong
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/model_boxes/glyph_model_border_016_020.json
            data/work017_full_text.txt
            data/work017_damage_cases.json
            data/work017_coordinate_report.json
            data/glyph_boxes/iiif/017
            data/beitie_catalog.json
            data/beitie_header_info.json
            data/page_images_index.json
            js/work-016.js
            js/work-016-coordinate-adapter.js
            js/work-017.js
            js/work-017-coordinate-adapter.js
            js/damage_ai_reading.js
            js/detail_info_patch.js
            detail.html
            .github/workflows/generate-work017.yml
      - name: Generate 017 website data
        run: |
          python - <<'PY'
          import json, re, difflib, traceback
          from pathlib import Path

          WORK='017'
          TITLE='张猛龙碑并阴'
          VERSION='20260723_zhangmenglong_v1'
          PAGE_COUNT=83
          MODEL=Path('data/model_boxes/glyph_model_border_016_020.json')
          TEXT=Path('data/work017_full_text.txt')
          CASES=Path('data/work017_damage_cases.json')
          REPORT=Path('data/work017_coordinate_report.json')
          OUT=Path('data/glyph_boxes/iiif/017')
          OUT.mkdir(parents=True,exist_ok=True)

          report={'work_id':WORK,'title':TITLE,'page_count':PAGE_COUNT,'status':'started'}

          def unwrap_rows(data):
            if isinstance(data,list): return data
            if isinstance(data,dict):
              for key in ('rows','items','data','glyphs','annotations'):
                if isinstance(data.get(key),list): return data[key]
            return []

          def rect(row):
            bbox=row.get('bbox') or []
            return {
              'x':float(row.get('x',row.get('bbox_x',bbox[0] if len(bbox)>0 else 0)) or 0),
              'y':float(row.get('y',row.get('bbox_y',bbox[1] if len(bbox)>1 else 0)) or 0),
              'w':float(row.get('w',row.get('bbox_w',bbox[2] if len(bbox)>2 else 0)) or 0),
              'h':float(row.get('h',row.get('bbox_h',bbox[3] if len(bbox)>3 else 0)) or 0),
            }

          ignored=set(' \t\r\n\u3000，。；：、！？,.!?;:“”‘’\'"（）()《》〈〉【】〔〕［］—–…·')
          variants={'於':'于','于':'于','隻':'只','祇':'只','裏':'里','裡':'里','陰':'阴','陽':'阳','縣':'县','郡':'郡','張':'张','龍':'龙','碑':'碑','憘':'憘','囧':'囧'}
          def canon(ch):
            if not ch or ch in ignored: return ''
            return variants.get(ch,ch)

          try:
            raw=unwrap_rows(json.loads(MODEL.read_text('utf-8')))
            selected=[]
            for source_index,row in enumerate(raw):
              wid=str(row.get('work_id','')).split('-')[0].zfill(3)
              if wid!=WORK: continue
              page=int(row.get('canvas_index',row.get('page',0)) or 0)
              box=rect(row)
              if not page or box['w']<=0 or box['h']<=0: continue
              item=dict(row)
              char=str(row.get('char',row.get('text','')))[:1]
              order=int(row.get('order_in_page',row.get('annotation_index',source_index+1)) or source_index+1)
              item.update({
                'work_id':WORK,'canvas_index':page,
                'glyph_id':str(row.get('glyph_id') or f'{WORK}_{page}_{order}'),
                'char':char,'text':char,'order_in_page':order,
                'bbox_x':box['x'],'bbox_y':box['y'],'bbox_w':box['w'],'bbox_h':box['h'],
                'bbox':[box['x'],box['y'],box['w'],box['h']]
              })
              selected.append(item)
            selected.sort(key=lambda r:(int(r['canvas_index']),int(r['order_in_page'])))

            groups={page:[] for page in range(1,PAGE_COUNT+1)}
            for row in selected:
              page=int(row['canvas_index'])
              if 1<=page<=PAGE_COUNT: groups[page].append(row)
            for page in range(1,PAGE_COUNT+1):
              (OUT/f'page_{page:04d}.json').write_text(json.dumps(groups[page],ensure_ascii=False,separators=(',',':')),encoding='utf-8')

            text=TEXT.read_text('utf-8')
            cases=json.loads(CASES.read_text('utf-8'))
            text_square_count=text.count('□')
            candidate_count=sum(len(re.findall(r'〔[^〕]+〕',str(case.get('corrected','')))) for case in cases)
            covered_count=sum(str(case.get('original','')).count('□') for case in cases)

            model_stream=[]
            model_chars=[]
            model_square_indices=[]
            for row in selected:
              key=canon(row.get('char') or row.get('text') or '')
              if not key: continue
              model_stream.append(row)
              model_chars.append(key)
              if key=='□': model_square_indices.append(len(model_stream)-1)

            clean_lines=[]
            for line in text.splitlines():
              if line.startswith('碑阳　') or line.startswith('碑阴　'): continue
              clean_lines.append(line)
            expected_source='\n'.join(clean_lines)
            expected=[]
            raw_to_expected={}
            for pos,ch in enumerate(expected_source):
              key=canon(ch)
              if key:
                raw_to_expected[pos]=len(expected)
                expected.append(key)

            matcher=difflib.SequenceMatcher(None,expected,model_chars,autojunk=False)
            exact_map={}
            matching_blocks=[]
            for block in matcher.get_matching_blocks():
              if block.size>=3: matching_blocks.append({'a':block.a,'b':block.b,'size':block.size})
              for offset in range(block.size): exact_map[block.a+offset]=block.b+offset

            def case_target(case):
              original=str(case.get('original',''))
              pos=expected_source.find(original)
              if pos<0: return None,None
              q=original.find('□')
              if q<0: return None,None
              raw_pos=pos+q
              eidx=sum(1 for ch in expected_source[:raw_pos] if canon(ch))
              ordinal=expected_source[:raw_pos].count('□')
              return eidx,ordinal

            def estimate_model_index(eidx):
              left=[(a,b) for a,b in exact_map.items() if a<eidx]
              right=[(a,b) for a,b in exact_map.items() if a>eidx]
              if left and right:
                la,lb=max(left);ra,rb=min(right)
                if ra!=la:return int(round(lb+(eidx-la)*(rb-lb)/(ra-la)))
              if left:
                la,lb=max(left);return lb+(eidx-la)
              if right:
                ra,rb=min(right);return rb-(ra-eidx)
              return len(model_chars)//2

            def context_score(eidx,midx,estimate):
              left_len=18;right_len=18
              el=''.join(expected[max(0,eidx-left_len):eidx])
              er=''.join(expected[eidx+1:min(len(expected),eidx+1+right_len)])
              ml=''.join(model_chars[max(0,midx-len(el)):midx])
              mr=''.join(model_chars[midx+1:midx+1+len(er)])
              lr=difflib.SequenceMatcher(None,el,ml,autojunk=False).ratio() if el else 0
              rr=difflib.SequenceMatcher(None,er,mr,autojunk=False).ratio() if er else 0
              distance=max(0,1-abs(midx-estimate)/220)
              return lr+rr+0.35*distance

            direct_ordinal=(len(model_square_indices)==text_square_count)
            previous=-1
            located=0
            audits=[]
            for case in cases:
              eidx,ordinal=case_target(case)
              chosen=None
              method=''
              score=None
              candidates=[]
              if eidx is not None:
                if direct_ordinal and ordinal is not None and ordinal<len(model_square_indices):
                  idx=model_square_indices[ordinal]
                  if idx>previous:
                    chosen=idx;method='square-ordinal-exact';score=1.0
                if chosen is None:
                  estimate=estimate_model_index(eidx)
                  for idx in model_square_indices:
                    if idx<=previous: continue
                    s=context_score(eidx,idx,estimate)
                    candidates.append((s,idx))
                  candidates.sort(reverse=True)
                  if candidates:
                    best=candidates[0]
                    second=candidates[1] if len(candidates)>1 else (-9,-1)
                    if best[0]>=1.05 and best[0]-second[0]>=0.06:
                      score,chosen=best;method='square-context-alignment'
              audit={'id':case.get('id'),'expected_index':eidx,'square_ordinal':ordinal,'accepted':chosen is not None,'top_candidates':[]}
              for s,idx in candidates[:3]:
                row=model_stream[idx]
                audit['top_candidates'].append({'score':round(s,4),'page':int(row['canvas_index']),'order_in_page':int(row['order_in_page']),'glyph_id':row.get('glyph_id','')})
              if chosen is not None:
                row=model_stream[chosen];box=rect(row);page=int(row['canvas_index'])
                canvas={'w':int(row.get('canvas_width',2943) or 2943),'h':int(row.get('canvas_height',4429) or 4429)}
                location={
                  'page':page,'glyph_id':str(row.get('glyph_id','')),'canvas':canvas,
                  'bbox':{'x':box['x'],'y':box['y'],'w':box['w'],'h':box['h']},
                  'bbox_source':'existing-model-square','match_method':method,'alignment_score':round(float(score or 0),4)
                }
                case['locations']=[location];case['page']=page
                previous=chosen;located+=1
                audit['location']=location
              else:
                case['locations']=[];case['page']='—'
              case['n']=case.get('category','残损碑文恢复');case['t']=case.get('title','');case['o']=case.get('original','');case['c']=case.get('corrected','')
              audits.append(audit)

            CASES.write_text(json.dumps(cases,ensure_ascii=False,indent=2),encoding='utf-8')

            coordinate_pages=[page for page,rows in groups.items() if rows]
            image_only_pages=[page for page in range(1,PAGE_COUNT+1) if not groups[page]]
            body_range=[min(coordinate_pages),max(coordinate_pages)] if coordinate_pages else []
            beiyin_case=next((a for a in audits if a.get('id')=='21' and a.get('location')),None)

            # Create dedicated module from the stable 016 implementation.
            module=Path('js/work-016.js').read_text('utf-8')
            module=module.replace('016《上尊号碑受禅表合册》','017《张猛龙碑并阴》')
            module=module.replace('016','017')
            module=module.replace('__WORK_017_SHICHENQIAN__','__WORK_017_ZHANGMENGLONG__')
            module=module.replace('上尊号碑受禅表合册','张猛龙碑并阴')
            module=module.replace('20260723_zunhao_shanrang_v1',VERSION)
            module=module.replace('本栏目以当前网页释文为底稿，分别整理《魏上尊号碑》与《魏受禅表》节录中的残损字。AI分析重点说明候选字与官职封爵、禅让典故、受禅礼制、祥瑞语汇和句法对偶的关系；没有对应方框的外部文字不写入恢复结果。','本栏目以当前网页释文为底稿，分别整理碑阳颂文与碑阴官吏、族望题名中的残损字。AI分析重点说明候选字与北魏人名、官职、家世、治郡政绩、铭辞对偶和题名结构的关系；没有对应方框的外部文字不写入恢复结果。')
            module=module.replace('assets/page_images/017_上尊号碑受禅表合册/images','assets/page_images/017_张猛龙碑并阴/images')
            module=module.replace('/^[上下]篇　/','/^(碑阳|碑阴)　/')
            module=module.replace('work017-zunhaoshanrang-style','work017-zhangmenglong-style')
            module=module.replace('dataset.work017Dedicated','dataset.work017Dedicated')
            Path('js/work-017.js').write_text(module,encoding='utf-8')

            adapter=Path('js/work-016-coordinate-adapter.js').read_text('utf-8')
            adapter=adapter.replace('016《上尊号碑受禅表合册》','017《张猛龙碑并阴》')
            adapter=adapter.replace('016','017')
            adapter=adapter.replace('20260723_zunhao_shanrang_v1',VERSION)
            adapter=adapter.replace('上尊号碑受禅表合册','张猛龙碑并阴')
            Path('js/work-017-coordinate-adapter.js').write_text(adapter,encoding='utf-8')

            # Update catalog and header metadata.
            catalog_path=Path('data/beitie_catalog.json')
            catalog=json.loads(catalog_path.read_text('utf-8'))
            entries=catalog if isinstance(catalog,list) else catalog.get('works',[])
            for entry in entries:
              if str(entry.get('id','')).zfill(3)==WORK:
                entry['creator']='撰文者、书写者不详'
                entry['subtitle']='碑阳颂文、碑阴题名、逐页释文与单字定位已接入。'
                entry['canvas_count']=PAGE_COUNT
            catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2),encoding='utf-8')

            header_path=Path('data/beitie_header_info.json')
            header=json.loads(header_path.read_text('utf-8'))
            record=header.setdefault(WORK,{'title':TITLE,'basic':{}})
            record['title']=TITLE
            basic=record.setdefault('basic',{})
            basic['首题']='张猛龙碑并阴'
            basic['其他题名']='张猛龙清颂碑；魏鲁郡太守张府君清颂之碑'
            basic['责任者']='撰文者、书写者不详'
            basic['版本说明']='本册兼收碑阳颂文与碑阴官吏、士望及各县族望题名。网站栏目二按碑阳、碑阴整理节录分别展示。'
            basic['镌刻特征']='碑阳颂扬张猛龙治鲁、兴学劝农之政绩；碑阴刻郡属官吏、士望及各县族望题名。'
            header_path.write_text(json.dumps(header,ensure_ascii=False,indent=2),encoding='utf-8')

            index_path=Path('data/page_images_index.json')
            index=json.loads(index_path.read_text('utf-8'))
            work=index.get('works',{}).get(WORK,{})
            pages=work.get('pages',[])
            for page in pages:
              page_no=int(page.get('page',0) or 0)
              rows=groups.get(page_no,[])
              chars=[str(row.get('char',row.get('text','')))[:1] for row in rows]
              page['text_clean']=''.join(chars)
              page['text_raw']='\n'.join(chars)
              page['char_count']=len(chars)
              page['has_char_boxes']=bool(rows)
            index_path.write_text(json.dumps(index,ensure_ascii=False,indent=2),encoding='utf-8')

            router_path=Path('js/damage_ai_reading.js')
            router=router_path.read_text('utf-8')
            router=router.replace('006、007、010、011、013、014-01、014-02、015、016使用单一专属模块','006、007、010、011、013、014-01、014-02、015、016、017使用单一专属模块')
            router=router.replace('__DAMAGE_AI_READING_ROUTER_V54__','__DAMAGE_AI_READING_ROUTER_V55__')
            if '"017":[' not in router:
              anchor='''    "016":[\n      {src:"js/work-016-coordinate-adapter.js?v=20260723_zunhao_shanrang_v1",key:"w016c",ready:()=>Boolean(window.__WORK_016_COORDINATE_ADAPTER__)},\n      {src:"js/work-016.js?v=20260723_zunhao_shanrang_v1",key:"w016",ready:()=>Boolean(window.__WORK_016_STABLE_READY__)}\n    ]'''
              addition=anchor+''',\n    "017":[\n      {src:"js/work-017-coordinate-adapter.js?v='''+VERSION+'''",key:"w017c",ready:()=>Boolean(window.__WORK_017_COORDINATE_ADAPTER__)},\n      {src:"js/work-017.js?v='''+VERSION+'''",key:"w017",ready:()=>Boolean(window.__WORK_017_STABLE_READY__)}\n    ]'''
              if anchor not in router: raise RuntimeError('016 route anchor not found')
              router=router.replace(anchor,addition,1)
            router=router.replace('"016":"上尊号碑受禅表合册"};','"016":"上尊号碑受禅表合册","017":"张猛龙碑并阴"};')
            router=router.replace('"014","015","016"].includes(id)','"014","015","016","017"].includes(id)')
            router=router.replace('"014","015"].includes(id)','"014","015","016","017"].includes(id)')
            router_path.write_text(router,encoding='utf-8')

            info_path=Path('js/detail_info_patch.js')
            info=info_path.read_text('utf-8')
            info=info.replace('__DETAIL_INFO_STABLE_ENTRY_V8__','__DETAIL_INFO_STABLE_ENTRY_V9__')
            info=info.replace('data/beitie_header_info.json?v=20260723_zunhao_shanrang_v1',f'data/beitie_header_info.json?v={VERSION}')
            info=info.replace('"014","015","016"].includes(workId)','"014","015","016","017"].includes(workId)')
            info=info.replace('window.__DAMAGE_AI_READING_ROUTER_V53__=true;','window.__DAMAGE_AI_READING_ROUTER_V53__=true;\n    window.__DAMAGE_AI_READING_ROUTER_V54__=true;')
            info=info.replace('js/damage_ai_reading.js?v=20260723_zunhao_shanrang_v1',f'js/damage_ai_reading.js?v={VERSION}')
            info_path.write_text(info,encoding='utf-8')

            detail_path=Path('detail.html')
            detail=detail_path.read_text('utf-8')
            detail=re.sub(r'js/detail_info_patch\.js\?v=[^"\']+',f'js/detail_info_patch.js?v={VERSION}',detail,count=1)
            detail=re.sub(r'js/damage_ai_reading\.js\?v=[^"\']+',f'js/damage_ai_reading.js?v={VERSION}',detail,count=1)
            detail_path.write_text(detail,encoding='utf-8')

            report.update({
              'status':'completed','model_rows':len(selected),'model_stream_chars':len(model_chars),
              'model_square_count':len(model_square_indices),'text_square_count':text_square_count,
              'covered_square_count':covered_count,'candidate_count':candidate_count,
              'remaining_square_count':text_square_count-candidate_count,
              'case_count':len(cases),'located_cases':located,
              'unlocated_cases':[a['id'] for a in audits if not a['accepted']],
              'sequence_ratio':round(matcher.ratio(),4),'direct_square_ordinal':direct_ordinal,
              'coordinate_pages':coordinate_pages,'image_only_pages':image_only_pages,
              'body_page_range':body_range,
              'beiyin_start_page':beiyin_case.get('location',{}).get('page') if beiyin_case else None,
              'matching_blocks':matching_blocks[:80],'cases':audits
            })
          except Exception as error:
            report.update({'status':'error','error':repr(error),'traceback':traceback.format_exc()})
          REPORT.parent.mkdir(parents=True,exist_ok=True)
          REPORT.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:report.get(k) for k in ('status','model_rows','model_square_count','text_square_count','case_count','located_cases','unlocated_cases','body_page_range','beiyin_start_page','error')},ensure_ascii=False,indent=2))
          PY
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data/work017_damage_cases.json data/work017_coordinate_report.json data/glyph_boxes/iiif/017 data/beitie_catalog.json data/beitie_header_info.json data/page_images_index.json js/work-017.js js/work-017-coordinate-adapter.js js/damage_ai_reading.js js/detail_info_patch.js detail.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "生成017张猛龙碑并阴坐标与专属页面"
          git push origin HEAD:agent/add-work017-zhangmenglong
