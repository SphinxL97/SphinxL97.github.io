name: One-off refine crowdsource UI v5

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/crowdsource-v5-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply fourth-section refinements
        shell: bash
        run: |
          if ! python .github/scripts/patch_crowdsource_v5.py > /tmp/crowdsource-v5.log 2>&1; then
            cat /tmp/crowdsource-v5.log
            cp /tmp/crowdsource-v5.log .github/crowdsource-v5-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/crowdsource-v5-error.txt
            git commit -m "Record crowdsource v5 patch error"
            git push origin HEAD:${{ github.head_ref }}
            exit 1
          fi
          cat /tmp/crowdsource-v5.log

      - name: Validate JavaScript and expected UI changes
        shell: bash
        run: |
          node --check assets/js/crowdsource.js
          grep -q 'pageTextBounds' assets/js/crowdsource.js
          grep -q 'installCrowdRailHint' assets/js/crowdsource.js
          ! grep -q 'data-page-select' assets/js/crowdsource.js
          ! grep -q 'buildCandidateField' assets/js/crowdsource.js
          grep -q '20260713_fix5' detail.html
          grep -q '20260713_fix5' assets/js/form-config.js

      - name: Remove temporary branch files
        run: |
          rm -f .github/crowdsource-v5-trigger
          rm -f .github/scripts/patch_crowdsource_v5.py
          rm -f .github/workflows/oneoff-crowdsource-v5.yml
          rm -f .github/crowdsource-v5-error.txt

      - name: Commit refined fourth section
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/crowdsource.js assets/css/crowdsource.css assets/js/form-config.js detail.html .github
          git commit -m "Refine crowdsource image, controls, and side hint"
          git push origin HEAD:${{ github.head_ref }}
