name: One-off repair crowdsource fourth section

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply fourth-section repair
        run: python .github/fix_crowdsource_fourth_section.py

      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/crowdsource.js
          node --check assets/js/form-config.js

      - name: Commit repaired files to pull-request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html assets/js/crowdsource.js assets/js/form-config.js
          git commit -m "Repair static and interactive crowdsource fourth section"
          git push origin HEAD:${{ github.head_ref }}
