name: work029-finalizer-debug

on:
  push:
    branches:
      - agent/work029-xianyu-guangzu
    paths:
      - .github/workflows/work029-finalizer-debug.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work029-xianyu-guangzu
          fetch-depth: 0
      - name: Run embedded finalizer and capture error
        shell: bash
        run: |
          mkdir -p tmp
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/work029-coordinate-audit.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY\n",start)
          lines=source[start:end].splitlines()
          lines=[line[10:] if line.startswith('          ') else line for line in lines]
          Path('/tmp/work029_finalizer.py').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          set +e
          python /tmp/work029_finalizer.py > tmp/work029_finalizer_error.log 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> tmp/work029_finalizer_error.log
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/work029_finalizer_error.log
          git commit -m "temp: record work029 finalizer error" || true
          git push origin HEAD:agent/work029-xianyu-guangzu
