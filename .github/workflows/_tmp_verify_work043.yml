name: Temporary verify work043

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/_tmp_verify_work043.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work043-mengjingxun-v1
          fetch-depth: 1
          show-progress: false

      - name: Validate formal files
        shell: bash
        run: |
          set -euo pipefail
          node --check js/work-043.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('data/work043_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work043_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work043_coordinate_report.json').read_text(encoding='utf-8'))
          router=Path('js/damage_ai_reading.js').read_text(encoding='utf-8')
          assert text.count('□')==1
          assert len(cases)==1 and cases[0]['corrected']=='又夫人性寡妒〔𡜱〕，多于容纳。'
          assert cases[0]['locations']==[]
          assert report['image_page_count']==20 and report['model_box_rows']==0
          assert '"030","033","043"].includes(id)' in router
          PY

      - name: Install browser dependency
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

      - name: Verify rendered page
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/work043-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 'http://127.0.0.1:8000/detail.html?id=043' >/dev/null
          node <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1536,height:1024}});
            const errors=[];
            page.on('pageerror',error=>errors.push(String(error)));
            await page.goto('http://127.0.0.1:8000/detail.html?id=043',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.__WORK_043_STABLE_READY__===true,{timeout:30000});
            await page.waitForTimeout(1000);
            const result=await page.evaluate(()=>({
              title:document.title,
              paragraphs:document.querySelectorAll('#calligraphy .full-transcript-body > p').length,
              boxes:(document.querySelector('#calligraphy .full-transcript-body')?.innerText.match(/□/g)||[]).length,
              bold:document.querySelectorAll('#calligraphy .transcript-problem-sentence').length,
              cases:document.querySelectorAll('#people .damage-tab').length,
              shared:Array.isArray(window.DAMAGE_AI_CASES)?window.DAMAGE_AI_CASES.length:0,
              missing:document.querySelector('#people .work043-location-missing')?.innerText||'',
              redBoxes:document.querySelectorAll('#people .damage-box,#people .work043-real-box').length,
              people:document.querySelector('#people')?.innerText||'',
              pageCount:document.querySelectorAll('#pageSelect option').length,
              crowd:Boolean(window.__WORK_043_CROWDSOURCE_READY__),
              auditLoaded:Array.from(document.scripts).some(s=>(s.src||'').includes('damage_case_audit.js')),
              standardLoaded:Array.from(document.scripts).some(s=>(s.src||'').includes('damage_case_standard_patch.js'))
            }));
            if(result.paragraphs!==3||result.boxes!==1||result.bold!==1)throw new Error('transcript '+JSON.stringify(result));
            if(result.cases!==1||result.shared!==1)throw new Error('cases '+JSON.stringify(result));
            if(!result.missing.includes('暂未获得可靠页码与真实字框')||result.redBoxes!==0)throw new Error('location '+JSON.stringify(result));
            if(result.people.includes('恢复依据')||result.people.includes('资料查证结果')||result.people.includes('资料使用原则'))throw new Error('forbidden '+JSON.stringify(result));
            if(result.auditLoaded||result.standardLoaded)throw new Error('legacy scripts '+JSON.stringify(result));
            if(result.pageCount!==20||!result.crowd||errors.length)throw new Error('page '+JSON.stringify({result,errors}));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS
