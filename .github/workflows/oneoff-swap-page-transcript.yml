name: One-off swap page transcript and glyph status

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/swap-page-transcript-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Replace only the page transcript status patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/detail_info_patch.js')
          text = path.read_text(encoding='utf-8')
          marker = '/* 当前页连续释文：'
          pos = text.find(marker)
          if pos < 0:
              raise RuntimeError('Current page transcript patch marker was not found')
          replacement = Path('.github/page_status_replacement.js').read_text(encoding='utf-8')
          path.write_text(text[:pos] + replacement, encoding='utf-8')
          PY

      - name: Commit only the requested layout change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/detail_info_patch.js
          git commit -m "Swap page transcript and selected glyph status"
          git push origin HEAD:${{ github.head_ref }}
