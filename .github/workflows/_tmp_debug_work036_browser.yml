name: Temporary debug work036 browser

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/_tmp_debug_work036_browser.yml'
  push:
    branches: [agent/work036-yiheming-v1]
    paths:
      - '.github/workflows/_tmp_debug_work036_browser.yml'

permissions:
  contents: read

jobs:
  debug-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work036-yiheming-v1
          fetch-depth: 1
          show-progress: false
      - run: python3 scripts/_tmp_patch_work036_mapping.py
      - run: python3 scripts/_tmp_build_work036.py
      - run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Capture rendered result
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/work036-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const fs=require('fs');
          const { chromium } = require('playwright');
          (async()=>{
            let result={};
            try{
              const browser=await chromium.launch({headless:true});
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              await page.goto('http://127.0.0.1:8000/detail.html?id=036',{waitUntil:'networkidle'});
              await page.waitForFunction(()=>window.__WORK_036_STABLE_READY__===true,{timeout:30000});
              result=await page.evaluate(()=>({
                title:document.title,
                transcriptText:document.querySelector('#calligraphy .full-transcript-body')?.innerText||'',
                transcriptBoxes:(document.querySelector('#calligraphy .full-transcript-body')?.innerText.match(/□/g)||[]).length,
                transcriptParagraphs:document.querySelectorAll('#calligraphy .full-transcript-body > p').length,
                transcriptAllParagraphs:document.querySelectorAll('#calligraphy .full-transcript-body p').length,
                cases:document.querySelectorAll('#people .damage-tab').length,
                redBoxes:document.querySelectorAll('#people .work036-real-box').length,
                caption:document.querySelector('#people .damage-caption')?.textContent?.trim()||'',
                peopleText:document.querySelector('#people')?.innerText||'',
                crowdReady:window.__WORK_036_CROWDSOURCE_READY__===true,
                coordReady:window.__WORK_036_COORDINATE_ADAPTER__===true,
                stableReady:window.__WORK_036_STABLE_READY__===true,
                pageErrors:window.__WORK_036_PAGE_ERRORS__||null
              }));
              await browser.close();
            }catch(error){result.error=String(error&&error.stack||error);}
            fs.writeFileSync('/tmp/work036-browser-result.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            if(result.error)process.exit(1);
          })();
          JS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work036-browser-result
          path: /tmp/work036-browser-result.json
