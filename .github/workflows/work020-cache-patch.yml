name: Patch work020 cache

on:
  push:
    branches:
      - agent/work020-conservative-damage-review
    paths:
      - .github/workflows/work020-cache-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work020-conservative-damage-review
          fetch-depth: 0
      - name: Patch top-level cache tags
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('detail.html')
          text = path.read_text(encoding='utf-8')
          old_detail = 'js/detail_info_patch.js?v=20260724_huadusi_v1'
          new_detail = 'js/detail_info_patch.js?v=20260724_huadusi_v2'
          old_router = 'js/damage_ai_reading.js?v=20260724_huadusi_v1'
          new_router = 'js/damage_ai_reading.js?v=20260724_huadusi_v2'
          if old_detail not in text or old_router not in text:
              raise SystemExit('Expected work020 cache tags were not found')
          text = text.replace(old_detail, new_detail, 1).replace(old_router, new_router, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html
          git rm .github/workflows/work020-cache-patch.yml
          git commit -m "Bump work020 top-level cache"
          git push origin HEAD:agent/work020-conservative-damage-review
