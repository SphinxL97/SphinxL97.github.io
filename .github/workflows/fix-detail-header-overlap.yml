name: Fix detail header row overlap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-detail-header-row-overlap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-detail-header-row-overlap
          fetch-depth: 1

      - name: Apply shared header overlap fix
        run: python scripts/fix_detail_header_overlap.py

      - name: Validate non-overlapping rows and scope
        run: |
          node --check js/detail_info_patch.js
          node --check js/detail_info_patch_core.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          entry=Path('js/detail_info_patch.js').read_text(encoding='utf-8')
          core=Path('js/detail_info_patch_core.js').read_text(encoding='utf-8')
          html=Path('detail.html').read_text(encoding='utf-8')
          assert '__DETAIL_INFO_STABLE_ENTRY_V17__' in entry
          assert '20260724_no_overlap_header_v1' in entry and '20260724_no_overlap_header_v1' in html
          assert 'grid-auto-rows:max-content!important' in core
          assert 'min-height:max-content!important' in core
          assert 'align-items:start!important' in core
          assert 'overflow-y:auto!important' in core
          assert 'align-items:center!important' not in core
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).split())
          assert changed == {'detail.html','js/detail_info_patch.js','js/detail_info_patch_core.js'}, changed
          print('detail header overlap validation ok')
          PY

      - name: Commit final shared files and remove temporary files
        run: |
          rm -f .github/workflows/fix-detail-header-overlap.yml scripts/fix_detail_header_overlap.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix multi-line detail header rows"
          git push origin HEAD:agent/fix-detail-header-row-overlap
