name: Apply crowdsource missing recovery v9

on:
  push:
    branches: [crowdsource-missing-recovery-v9]
    paths:
      - '.github/crowdsource-v9-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: crowdsource-missing-recovery-v9

      - name: Patch cache references
        run: python .github/scripts/patch_detail_v9.py

      - name: Validate v9 files
        shell: bash
        run: |
          node --check assets/js/crowdsource-v9.js
          node --check js/damage_ai_reading.js
          grep -q '20260714_v9' detail.html
          grep -q 'crowdsource-v9.js' assets/js/form-config.js
          grep -q 'window.DAMAGE_AI_CASES' js/damage_ai_reading.js
          ! grep -q 'span class="sub"' js/damage_ai_reading.js

      - name: Remove temporary patch files
        run: |
          rm -f .github/crowdsource-v9-trigger
          rm -f .github/scripts/patch_detail_v9.py
          rm -f .github/workflows/oneoff-crowdsource-v9.yml

      - name: Commit crowdsource v9
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html assets/js/crowdsource-v9.js assets/css/crowdsource-v9.css assets/js/form-config.js js/damage_ai_reading.js .github
          git commit -m "Link missing text review to recovery cases"
          git push origin HEAD:crowdsource-missing-recovery-v9
