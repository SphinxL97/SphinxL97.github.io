name: Commit final column one fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  commit:
    if: github.head_ref == 'agent/fix-final-column1-model-boxes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-final-column1-model-boxes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/final_column1_apply_temp.py
      - name: Commit formal file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html
          git diff --cached --quiet && exit 0
          git commit -m "修复栏目一最终深度学习精修字框 [skip ci]"
          git push origin HEAD:agent/fix-final-column1-model-boxes
