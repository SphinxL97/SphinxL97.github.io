name: Finalize work029
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - scripts/finalize_work029.py
      - .github/workflows/finalize-work029.yml
jobs:
  finalize:
    if: github.head_ref == 'agent/work029-xianyu'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work029-xianyu
          fetch-depth: 0
      - name: Apply final 029 corrections
        run: python scripts/finalize_work029.py
      - name: Validate final scope and content
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          def load(path):return json.loads(Path(path).read_text(encoding='utf-8'))
          def base(path):return json.loads(subprocess.check_output(['git','show',f'origin/main:{path}'],text=True))
          cases=load('data/work029_damage_cases.json')
          report=load('data/work029_coordinate_report.json')
          details=load('data/beitie_details.json')
          header=load('data/beitie_header_info.json')
          catalog=load('data/beitie_catalog.json')
          index=load('data/page_images_index.json')
          assert len(cases)==20
          assert sum(x['candidate_count'] for x in cases)==14
          assert sum(x['remaining_square_count'] for x in cases)==6
          assert [x['locations'][0]['page'] for x in cases]==report['case_pages']
          assert report['page_sequence_monotonic'] is True
          assert report['minimum_location_score']>=0.50
          assert report['unique_location_glyphs']==20
          assert report['details_placeholder_removed'] is True
          assert '道因法师' not in json.dumps(details['029'],ensure_ascii=False)
          assert details['029']['basic']['馆藏号']=='18A356'
          assert header['029']['basic']['刻立地点'].startswith('浙江钱塘县西次孤山')
          assert '原石地点' not in header['029']['basic']
          assert next(x for x in catalog if x['id']=='029')['status']=='待验收样板'
          assert len(list(Path('data/glyph_boxes/iiif/029').glob('page_*.json')))==33
          assert '028_${pageNo}' not in Path('js/work-029-coordinate-adapter.js').read_text(encoding='utf-8')
          assert '029_${pageNo}' in Path('js/work-029-coordinate-adapter.js').read_text(encoding='utf-8')
          assert '20260725_xianyu_v2' in Path('js/work-029.js').read_text(encoding='utf-8')
          assert 'getBoundingClientRect' in Path('js/work-029.js').read_text(encoding='utf-8')
          assert Path('data/work029_full_text.txt').read_text(encoding='utf-8').count('□')==20
          base_catalog={x['id']:x for x in base('data/beitie_catalog.json')}
          cur_catalog={x['id']:x for x in catalog}
          assert all(cur_catalog[k]==v for k,v in base_catalog.items() if k!='029')
          base_header=base('data/beitie_header_info.json')
          assert all(header[k]==v for k,v in base_header.items() if k!='029')
          base_details=base('data/beitie_details.json')
          assert all(details[k]==v for k,v in base_details.items() if k!='029')
          base_index=base('data/page_images_index.json')
          assert all(index['works'][k]==v for k,v in base_index['works'].items() if k!='029')
          print({'cases':20,'candidates':14,'unresolved':6,'min_score':report['minimum_location_score'],'pages':report['case_pages']})
          PY
          node --check js/work-029.js
          node --check js/work-029-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          grep -q '20260725_xianyu_v2' detail.html
      - name: Remove all temporary 029 audit files
        run: |
          rm -f scripts/finalize_work029.py
          rm -f .github/workflows/finalize-work029.yml
          rm -f scripts/audit_work029_details.py
          rm -f .github/workflows/audit-work029-details.yml
          rm -f data/work029_details_existing.json
      - name: Commit final reviewed files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/beitie_catalog.json data/beitie_header_info.json data/beitie_details.json data/work029_coordinate_report.json detail.html js/damage_ai_reading.js js/detail_info_patch.js js/work-029.js js/work-029-coordinate-adapter.js
          git add -u scripts/finalize_work029.py .github/workflows/finalize-work029.yml scripts/audit_work029_details.py .github/workflows/audit-work029-details.yml data/work029_details_existing.json
          git commit -m '完善029详情并完成最终静态验收'
          git push origin HEAD:agent/work029-xianyu
