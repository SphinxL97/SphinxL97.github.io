name: Temporary build work035

on:
  push:
    branches:
      - agent/work035-wushici
    paths:
      - .github/workflows/_tmp_build_work035.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work035-wushici
          fetch-depth: 0
      - name: Build and validate work035
        run: |
          python scripts/_tmp_build_work035.py
          node --check js/work-035.js
          node --check js/work-035-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          python -m json.tool data/work035_damage_cases.json >/dev/null
          python -m json.tool data/work035_coordinate_report.json >/dev/null
      - name: Commit final work035 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "完成035武氏祠画像题字专属内容 [skip ci]"
            git push origin HEAD:agent/work035-wushici
          fi
