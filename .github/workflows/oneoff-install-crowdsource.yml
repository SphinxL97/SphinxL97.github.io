name: One-off final crowdsource patch

on:
  push:
    branches: [main]
    paths:
      - '.github/crowdsource-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            assets/js/crowdsource.js
          sparse-checkout-cone-mode: false

      - name: Refine crowdsource copy and successful-reset behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('assets/js/crowdsource.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace('点击右侧碑帖图片中的任意字','点击左侧碑帖图片中的任意字')
          old='''  function resetModule(type){
    state.contacts[type]=blankContact();
    if(type==="transcription"){state.selected.clear();state.lastKey="";renderTranscriptionItems();renderCurrentImage();}
    if(type==="punctuation"){state.punctuation=[blankPunctuation()];renderSimpleItems(type);}
    if(type==="missingText"){state.missingText=[blankMissing()];renderSimpleItems(type);}
  }'''
          new='''  function resetModule(type){
    Object.assign(state.contacts[type],blankContact());
    if(type==="transcription"){state.selected.clear();state.lastKey="";renderTranscriptionItems();renderCurrentImage();}
    if(type==="punctuation"){state.punctuation=[blankPunctuation()];renderSimpleItems(type);}
    if(type==="missingText"){state.missingText=[blankMissing()];renderSimpleItems(type);}
    const card=qs(`[data-submit-card="${type}"]`);
    if(card){
      qsa("input",card).forEach(node=>{
        if(node.type==="checkbox") node.checked=false;
        else node.value="";
      });
    }
  }'''
          if old in text:
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Commit final crowdsource refinements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/crowdsource.js
          if git diff --cached --quiet; then
            echo "No crowdsource patch needed."
          else
            git commit -m "Refine crowdsource interaction details"
            git push origin HEAD:main
          fi
