name: One-off install crowdsource section

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/crowdsource-trigger'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Load crowdsource assets on detail pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('detail.html')
          text=path.read_text(encoding='utf-8')
          anchor='<script defer src="js/full_transcript.js?v=20260713"></script>'
          additions='\n'.join([
              '<link rel="stylesheet" href="assets/css/crowdsource.css?v=20260713">',
              '<script defer src="assets/js/form-config.js?v=20260713"></script>',
              '<script defer src="assets/js/crowdsource.js?v=20260713"></script>',
          ])
          if additions not in text:
              if anchor not in text:
                  raise RuntimeError('full transcript loader anchor not found')
              text=text.replace(anchor,anchor+'\n'+additions,1)
              path.write_text(text,encoding='utf-8')
          PY

      - name: Commit detail page loader to pull-request branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html
          if git diff --cached --quiet; then
            echo "No loader change needed."
          else
            git commit -m "Load structured crowdsource module"
            git push origin HEAD:${{ github.head_ref }}
          fi
