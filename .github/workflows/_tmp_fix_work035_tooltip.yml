name: Temporary remove work035 glyph tooltip

on:
  push:
    branches:
      - agent/fix-work035-tooltip
    paths:
      - 'scripts/_tmp_fix_work035_tooltip.py'
      - '.github/workflows/_tmp_fix_work035_tooltip.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-work035-tooltip
          fetch-depth: 0

      - name: Apply source-level patch
        run: python3 scripts/_tmp_fix_work035_tooltip.py

      - name: Validate JavaScript and visible text
        shell: bash
        run: |
          set -euo pipefail
          node --check js/work-035.js
          node --check js/work-035-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          ! grep -F 'title="${esc(loc.glyph_id||"")}"' js/work-035.js
          ! grep -F '清代题记校读说明' js/work-035.js
          ! grep -F '真实模型字框' js/work-035.js
          grep -F '《${TITLE}》第${page}页，对应问题字局部' js/work-035.js
          grep -F '20260726_wushici_035_v4' js/work-035.js
          grep -F '__DAMAGE_AI_READING_ROUTER_V79__' js/damage_ai_reading.js
          grep -F '__DETAIL_INFO_STABLE_ENTRY_V39__' js/detail_info_patch.js

      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Test rendered 035 page
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/work035-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:8000/detail.html?id=035',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__WORK_035_STABLE_READY__===true,{timeout:30000});
            const result=await page.evaluate(()=>({
              noteText:document.body.innerText.includes('清代题记校读说明'),
              technicalText:document.body.innerText.includes('真实模型字框'),
              glyphTooltipTitles:Array.from(document.querySelectorAll('#people .work035-real-box')).filter(node=>node.hasAttribute('title')).length,
              caption:document.querySelector('#people .damage-caption')?.textContent?.trim()||'',
              cases:document.querySelectorAll('#people .damage-tab').length,
              redBoxes:document.querySelectorAll('#people .work035-real-box').length
            }));
            if(result.noteText||result.technicalText||result.glyphTooltipTitles!==0)throw new Error('technical residue remains: '+JSON.stringify(result));
            if(!/^《武氏祠画像题字》第\d+页，对应问题字局部$/.test(result.caption))throw new Error('caption mismatch: '+JSON.stringify(result));
            if(result.cases!==29||result.redBoxes<1)throw new Error('case/red box regression: '+JSON.stringify(result));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS

      - name: Remove temporary files and commit final changes
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_tmp_fix_work035_tooltip.py
          rm .github/workflows/_tmp_fix_work035_tooltip.yml
          rm -rf node_modules package-lock.json package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '彻底移除035内部字框编号提示 [skip ci]'
          git push origin HEAD:agent/fix-work035-tooltip
