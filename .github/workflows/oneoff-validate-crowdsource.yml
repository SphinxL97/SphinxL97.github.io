name: One-off validate crowdsource module

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/crowdsource-validation-trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          sparse-checkout: |
            detail.html
            assets/js/crowdsource.js
            assets/js/form-config.js
            assets/css/crowdsource.css
          sparse-checkout-cone-mode: false

      - name: Check JavaScript syntax and page references
        shell: bash
        run: |
          node --check assets/js/crowdsource.js
          node --check assets/js/form-config.js
          python - <<'PY'
          from pathlib import Path
          detail=Path('detail.html').read_text(encoding='utf-8')
          required=[
              'assets/css/crowdsource.css?v=20260713_fix2',
              'assets/js/form-config.js?v=20260713_fix2',
              'assets/js/crowdsource.js?v=20260713_fix2',
          ]
          missing=[item for item in required if item not in detail]
          if missing:
              raise SystemExit('Missing references: '+', '.join(missing))
          js=Path('assets/js/crowdsource.js').read_text(encoding='utf-8')
          for marker in ['const TITLE="四、众智释读"','document.getElementById("places")','class="crowd-shell"']:
              if marker not in js:
                  raise SystemExit('Missing module marker: '+marker)
          print('PASS: JavaScript syntax, asset references, and replacement markers are valid.')
          PY
