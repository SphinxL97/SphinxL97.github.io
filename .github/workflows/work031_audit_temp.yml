name: Audit Work031 volumes

on:
  pull_request:
    branches:
      - main

jobs:
  audit:
    if: github.head_ref == 'agent/work031-huangtingjian-volumes-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install pillow
      - name: Audit images and coordinates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import json

          out = Path('/tmp/work031-audit')
          out.mkdir(parents=True, exist_ok=True)
          base = Path('assets/page_images/031_黄庭堅青原山诗刻石/images')
          volumes = {
              '031-01': base / '01_黄庭堅青原山诗刻石(第一辑)册一',
              '031-02': base / '02_黄庭堅青原山诗刻石(第一辑)册二',
          }
          report = {'volumes': {}, 'coordinate_hits': [], 'json_files_scanned': []}
          page_paths = {}
          for vid, folder in volumes.items():
              files = sorted(folder.glob('*.jpg'))
              page_paths[vid] = {i+1:path for i,path in enumerate(files)}
              entries = []
              thumbs = []
              for index, path in enumerate(files, 1):
                  with Image.open(path) as im:
                      w, h = im.size
                      thumb = ImageOps.contain(im.convert('RGB'), (180, 260))
                      tile = Image.new('RGB', (200, 300), 'white')
                      tile.paste(thumb, ((200-thumb.width)//2, 24))
                      draw = ImageDraw.Draw(tile)
                      draw.text((8, 4), f'{index:02d} {path.name}', fill='black')
                      thumbs.append(tile)
                      entries.append({'page': index, 'file': path.name, 'width': w, 'height': h, 'bytes': path.stat().st_size})
              cols = 5
              rows = (len(thumbs)+cols-1)//cols
              sheet = Image.new('RGB', (cols*200, rows*300), '#ddd8cf')
              for i, tile in enumerate(thumbs):
                  sheet.paste(tile, ((i%cols)*200, (i//cols)*300))
              sheet.save(out / f'{vid}_contact.jpg', quality=88)
              report['volumes'][vid] = {'folder': str(folder), 'count': len(files), 'pages': entries}

          for path in Path('data').rglob('*.json'):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              report['json_files_scanned'].append(str(path))
              stack = [data]
              while stack:
                  obj = stack.pop()
                  if isinstance(obj, dict):
                      wid = str(obj.get('work_id', ''))
                      vid = str(obj.get('virtual_id', ''))
                      gid = str(obj.get('glyph_id', ''))
                      has_bbox = any(k in obj for k in ('bbox','x','bbox_x','model_x','border_x'))
                      if has_bbox and (wid.startswith('031') or vid.startswith('031') or gid.startswith('031')):
                          report['coordinate_hits'].append({'file': str(path), 'record': obj})
                      stack.extend(obj.values())
                  elif isinstance(obj, list):
                      stack.extend(obj)

          for vid in volumes:
              records = [h['record'] for h in report['coordinate_hits'] if h['record'].get('virtual_id') == vid and h['record'].get('char') == '□']
              records.sort(key=lambda r:(int(r.get('canvas_index',0)),int(r.get('order_in_page',0))))
              tiles=[]
              for r in records:
                  p=int(r['canvas_index']); path=page_paths[vid].get(p)
                  if not path: continue
                  with Image.open(path) as im:
                      im=im.convert('RGB'); iw,ih=im.size
                      x,y,w,h=[int(r[k]) for k in ('x','y','w','h')]
                      pad_x=max(120,w//3); pad_y=max(160,h//2)
                      x1=max(0,x-pad_x); y1=max(0,y-pad_y); x2=min(iw,x+w+pad_x); y2=min(ih,y+h+pad_y)
                      crop=im.crop((x1,y1,x2,y2))
                      crop=ImageOps.contain(crop,(340,420))
                      tile=Image.new('RGB',(360,470),'white'); tile.paste(crop,((360-crop.width)//2,36))
                      dr=ImageDraw.Draw(tile); dr.text((8,5),f"p{p:02d} {r['glyph_id']}",fill='black')
                      sx=crop.width/(x2-x1); sy=crop.height/(y2-y1); ox=(360-crop.width)//2; oy=36
                      dr.rectangle((ox+(x-x1)*sx,oy+(y-y1)*sy,ox+(x+w-x1)*sx,oy+(y+h-y1)*sy),outline='red',width=5)
                      tiles.append(tile)
              cols=4; rows=(len(tiles)+cols-1)//cols
              sheet=Image.new('RGB',(cols*360,rows*470),'#ddd8cf')
              for i,t in enumerate(tiles): sheet.paste(t,((i%cols)*360,(i//cols)*470))
              sheet.save(out/f'{vid}_missing_boxes.jpg',quality=92)
          (out / 'audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'counts': {k:v['count'] for k,v in report['volumes'].items()}, 'coordinate_hits': len(report['coordinate_hits'])}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: work031-audit
          path: /tmp/work031-audit
          retention-days: 2
