name: Audit Work031 volumes

on:
  pull_request:
    branches:
      - main

jobs:
  audit:
    if: github.head_ref == 'agent/work031-huangtingjian-volumes-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install pillow
      - name: Audit images and coordinates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import json

          out = Path('/tmp/work031-audit')
          out.mkdir(parents=True, exist_ok=True)
          base = Path('assets/page_images/031_黄庭堅青原山诗刻石/images')
          volumes = {
              '031-01': base / '01_黄庭堅青原山诗刻石(第一辑)册一',
              '031-02': base / '02_黄庭堅青原山诗刻石(第一辑)册二',
          }
          report = {'volumes': {}, 'coordinate_hits': [], 'json_files_scanned': []}
          for vid, folder in volumes.items():
              files = sorted(folder.glob('*.jpg'))
              entries = []
              thumbs = []
              for index, path in enumerate(files, 1):
                  with Image.open(path) as im:
                      w, h = im.size
                      thumb = ImageOps.contain(im.convert('RGB'), (180, 260))
                      tile = Image.new('RGB', (200, 300), 'white')
                      tile.paste(thumb, ((200-thumb.width)//2, 24))
                      draw = ImageDraw.Draw(tile)
                      draw.text((8, 4), f'{index:02d} {path.name}', fill='black')
                      thumbs.append(tile)
                      entries.append({'page': index, 'file': path.name, 'width': w, 'height': h, 'bytes': path.stat().st_size})
              cols = 5
              rows = (len(thumbs)+cols-1)//cols
              sheet = Image.new('RGB', (cols*200, rows*300), '#ddd8cf')
              for i, tile in enumerate(thumbs):
                  sheet.paste(tile, ((i%cols)*200, (i//cols)*300))
              sheet.save(out / f'{vid}_contact.jpg', quality=88)
              report['volumes'][vid] = {'folder': str(folder), 'count': len(files), 'pages': entries}

          for path in Path('data').rglob('*.json'):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              report['json_files_scanned'].append(str(path))
              stack = [data]
              while stack:
                  obj = stack.pop()
                  if isinstance(obj, dict):
                      wid = str(obj.get('work_id', ''))
                      vid = str(obj.get('virtual_id', ''))
                      gid = str(obj.get('glyph_id', ''))
                      has_bbox = any(k in obj for k in ('bbox','x','bbox_x','model_x','border_x'))
                      if has_bbox and (wid.startswith('031') or vid.startswith('031') or gid.startswith('031')):
                          report['coordinate_hits'].append({'file': str(path), 'record': obj})
                      stack.extend(obj.values())
                  elif isinstance(obj, list):
                      stack.extend(obj)
          (out / 'audit.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps({'counts': {k:v['count'] for k,v in report['volumes'].items()}, 'coordinate_hits': len(report['coordinate_hits'])}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: work031-audit
          path: /tmp/work031-audit
          retention-days: 2
