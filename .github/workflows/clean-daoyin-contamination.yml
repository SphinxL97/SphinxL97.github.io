name: Remove mistakenly restored Daoyin fields

on:
  push:
    paths:
      - ".github/workflows/clean-daoyin-contamination.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Undo only mistaken era and version restoration
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          from pathlib import Path

          BEFORE_RESTORE = 'd0fa49acb0a2a812a1e8e2cd70c0ddadce6d4027'
          PATH = Path('data/beitie_details.json')

          current = json.loads(PATH.read_text(encoding='utf-8'))
          previous = json.loads(subprocess.check_output(
              ['git', 'show', f'{BEFORE_RESTORE}:{PATH.as_posix()}'],
              text=True,
              encoding='utf-8'
          ))

          removed = []
          for raw_wid, obj in current.items():
              wid = str(raw_wid).zfill(3)
              if wid == '001' or not isinstance(obj, dict):
                  continue
              old_obj = previous.get(raw_wid) or previous.get(wid) or {}
              basic = obj.get('basic')
              old_basic = old_obj.get('basic', {}) if isinstance(old_obj, dict) else {}
              if not isinstance(basic, dict):
                  continue

              # 只撤销上一轮新增、且清理前已被判定为 001 模板复制的两类字段。
              # “书体”不撤销，因为它是各碑帖自身的通用信息。
              for key in ('时代', '版本'):
                  if key in basic and key not in old_basic:
                      removed.append((wid, key, basic[key]))
                      del basic[key]

          PATH.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(PATH.read_text(encoding='utf-8'))
          print(f'精确撤销 {len(removed)} 处误恢复字段：')
          for row in removed:
              print(row)
          PY

      - name: Commit final correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beitie_details.json
          if git diff --cached --quiet; then
            echo "No final correction needed."
          else
            git commit -m "删除误恢复的道因模板时代与版本字段"
            git push
          fi
