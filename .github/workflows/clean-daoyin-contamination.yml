name: Restore non-Daoyin generic fields

on:
  push:
    paths:
      - ".github/workflows/clean-daoyin-contamination.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore generic fields that were not uniquely Daoyin content
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import subprocess
          from pathlib import Path

          PRE_CLEAN_COMMIT = '32dd31ea0aad1e7be0e2cd0d55c602fce836377a'
          CATALOG_PATH = Path('data/beitie_catalog.json')
          DETAILS_PATH = Path('data/beitie_details.json')
          META_PATH = Path('data/beitie_search_metadata.json')

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def old_json(path):
              raw = subprocess.check_output(
                  ['git', 'show', f'{PRE_CLEAN_COMMIT}:{path.as_posix()}'],
                  text=True,
                  encoding='utf-8'
              )
              return json.loads(raw)

          def save(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          current_catalog = load(CATALOG_PATH)
          current_details = load(DETAILS_PATH)
          old_catalog = old_json(CATALOG_PATH)
          old_details = old_json(DETAILS_PATH)
          metadata_list = load(META_PATH) if META_PATH.exists() else []
          metadata = {str(x.get('id', '')).zfill(3): x for x in metadata_list if x.get('id') is not None}

          old_catalog_map = {str(x.get('id', '')).zfill(3): x for x in old_catalog}
          restored = []

          def has_values(meta, key):
              if not meta or key not in meta:
                  return False
              value = meta.get(key)
              if isinstance(value, list):
                  return bool([x for x in value if x not in (None, '')])
              return value not in (None, '')

          # “楷书”本身不是道因专属内容。第一次筛查中，只有这一类通用字段
          # 可能因元数据缺项而被清空，因此从清理前版本恢复。
          for item in current_catalog:
              wid = str(item.get('id', '')).zfill(3)
              if wid == '001':
                  continue
              old = old_catalog_map.get(wid, {})
              if item.get('script', '') == '' and old.get('script'):
                  item['script'] = old['script']
                  restored.append((wid, 'catalog.script', old['script']))

          # 对详情 basic 中的“时代 / 书体 / 版本”，只有在现有检索元数据明确
          # 给出相反信息时才允许删除；元数据缺失时恢复原值，避免误删其他内容。
          for raw_wid, obj in current_details.items():
              wid = str(raw_wid).zfill(3)
              if wid == '001' or not isinstance(obj, dict):
                  continue
              old_obj = old_details.get(raw_wid) or old_details.get(wid) or {}
              old_basic = old_obj.get('basic', {}) if isinstance(old_obj, dict) else {}
              basic = obj.setdefault('basic', {})
              meta = metadata.get(wid, {})

              restore_rules = (
                  ('时代', 'dynasty'),
                  ('书体', 'script'),
                  ('版本', 'copy_era'),
              )
              for basic_key, meta_key in restore_rules:
                  if basic_key not in basic and basic_key in old_basic and not has_values(meta, meta_key):
                      basic[basic_key] = old_basic[basic_key]
                      restored.append((wid, f'details.basic.{basic_key}', old_basic[basic_key]))

          save(CATALOG_PATH, current_catalog)
          save(DETAILS_PATH, current_details)

          # JSON 完整性校验。
          load(CATALOG_PATH)
          load(DETAILS_PATH)
          print(f'恢复 {len(restored)} 处无法确认属于道因污染的通用字段：')
          for row in restored:
              print(row)
          PY

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beitie_catalog.json data/beitie_details.json
          if git diff --cached --quiet; then
            echo "No correction needed."
          else
            git commit -m "恢复误删的非道因通用字段"
            git push
          fi
