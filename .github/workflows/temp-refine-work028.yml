name: Temporary refine work028 candidates
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - scripts/refine_work028_candidates.py
      - .work028-refine-trigger
jobs:
  refine:
    if: github.head_ref == 'agent/work028-jintang-nine'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work028-jintang-nine
          fetch-depth: 0
      - name: Refine candidates
        run: python scripts/refine_work028_candidates.py
      - name: Validate refined 028
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          full=Path('data/work028_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work028_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work028_coordinate_report.json').read_text(encoding='utf-8'))
          assert len(cases)==226
          assert report['case_count']==226
          assert report['base_text_square_count']==347
          assert report['model_square_count']==347
          assert report['candidate_count']==347
          assert report['remaining_square_count']==0
          assert report['located_case_count']==226
          assert report['unlocated_case_count']==0
          assert report['unresolved_case_count']==0
          assert report['documentary_case_count']+report['ai_provisional_case_count']==226
          assert report['manual_reviewed_case_count']>0
          assert report['cache_version']=='20260725_jintang_nine_v2'
          assert '□' not in full
          assert all('□' not in x['corrected'] and '□' not in x['current_context'] for x in cases)
          assert all(x['candidate_count']==x['square_count'] for x in cases)
          assert all(len(x.get('analysis',[]))>=3 for x in cases)
          assert all(x.get('locations') and x['locations'][0].get('bbox') for x in cases)
          by={x['id']:x for x in cases}
          expected={
            '031':'肺之〔為〕〔氣〕〔三〕焦起。',
            '039':'或者〔其〕〔旨〕〔趣〕未盡乎。',
            '047':'願釋干〔戈〕。',
            '049':'微子適〔周〕。',
            '050':'其先與周同〔祖〕。',
            '059':'〔乍〕沉〔乍〕〔浮〕。',
            '060':'千夫〔共〕聲。',
            '099':'子敬好〔寫〕洛神〔賦〕，人間合有數本，奉此其一焉。',
            '100':'太子中書舍人〔吳郡〕〔虞〕世南撰〔并〕書。',
            '145':'此地〔有崇〕山峻嶺，茂林脩竹，又有清流激湍，映帶左右。',
            '190':'維貞觀廿三年〔歲次己酉五月甲辰朔〕廿六日己巳，太宗皇帝崩于翠微宫之含風殿。',
            '211':'商管初飛，秋絃罷〔脩〕。',
            '216':'崤陵〔玄〕壤，隅山窮路。',
            '226':'绍興丙辰十二〔月〕〔初〕五日，臣〔友〕〔仁〕審定。',
          }
          for key,value in expected.items(): assert by[key]['corrected']==value,(key,by[key]['corrected'])
          assert by['031']['mode']=='ai_provisional'
          assert by['223']['mode']=='documentary'
          assert len(list(Path('data/glyph_boxes/iiif/028').glob('page_*.json')))==91
          print({'documentary':report['documentary_case_count'],'ai_provisional':report['ai_provisional_case_count'],'reviewed':report['manual_reviewed_case_count']})
          PY
          node --check js/work-028.js
          node --check js/work-028-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          grep -q '20260725_jintang_nine_v2' detail.html
          grep -q '20260725_jintang_nine_v2' js/damage_ai_reading.js
          grep -q 'getBoundingClientRect' js/work-028.js
      - name: Remove temporary refine files
        run: |
          rm -f scripts/refine_work028_candidates.py .work028-refine-trigger
      - name: Commit refined content
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/work028_full_text.txt data/work028_damage_cases.json data/work028_coordinate_report.json data/work028_case_audit.txt
          git add js/work-028.js js/work-028-coordinate-adapter.js js/damage_ai_reading.js js/detail_info_patch.js detail.html
          git add -u scripts/refine_work028_candidates.py .work028-refine-trigger
          git commit -m '逐例复核028候选字并修正自动对齐错位'
          git push origin HEAD:agent/work028-jintang-nine
