name: Generate work014-02 coordinates

on:
  push:
    branches:
      - agent/add-work014-02-lihanjing

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-work014-02-lihanjing
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/generate_work014_02.py
            data/model_boxes/glyph_model_border_011_015.json
            data/work014_02_full_text.txt
            data/work014_02_damage_cases.json
            data/work014_02_coordinate_report.json
            data/glyph_boxes/iiif/014-02
            data/page_images_index.json
            data/beitie_catalog.json
            js/damage_ai_reading.js
            js/detail_info_patch.js
            detail.html
      - name: Generate coordinates and audit data
        run: python scripts/generate_work014_02.py
      - name: Commit generated website data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data/work014_02_damage_cases.json data/work014_02_coordinate_report.json data/glyph_boxes/iiif/014-02 data/page_images_index.json data/beitie_catalog.json js/damage_ai_reading.js js/detail_info_patch.js detail.html
          if git diff --cached --quiet; then
            echo "Generated data is already current"
            exit 0
          fi
          git commit -m "生成014-02册二逐页坐标与静态案例位置"
          git push origin HEAD:agent/add-work014-02-lihanjing
