name: Update beitie page index

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/page_images/**'
      - '01_fix_gallery_cover_and_detail_index.py'
      - 'data/beitie_pages.json'
      - 'data/beitie_catalog.json'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run index builder
        run: python 01_fix_gallery_cover_and_detail_index.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beitie_catalog.json data/beitie_details.json data/page_images_index.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Update beitie gallery and page index"
            git push
          fi
