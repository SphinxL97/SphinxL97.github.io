name: One-off convert 014 031 039 to model boxes

on:
  push:
    paths:
      - '.github/workflows/oneoff-convert-014-031-039.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert three works and update only related files
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import math
          import re
          from pathlib import Path

          ROOT = Path('.')
          TARGETS = {
              '014': ROOT / 'data/model_boxes/glyph_model_border_011_015.json',
              '031': ROOT / 'data/model_boxes/glyph_model_border_031_035.json',
              '039': ROOT / 'data/model_boxes/glyph_model_border_036_040.json',
          }

          def estimate_rows(n):
              if n <= 0:
                  return 1
              if n <= 10:
                  return math.ceil(n / 2)
              if n <= 32:
                  return math.ceil(n / 3)
              if n <= 70:
                  return math.ceil(n / 5)
              return math.ceil(math.sqrt(n * 1.8))

          def num(v, default=0):
              try:
                  f = float(v)
                  return int(f) if f.is_integer() else f
              except Exception:
                  return default

          def rect(row):
              bbox = row.get('bbox') if isinstance(row.get('bbox'), list) else []
              bbox2 = row.get('bbox_xywh') if isinstance(row.get('bbox_xywh'), list) else []
              x = row.get('x', row.get('border_x', row.get('display_x', row.get('model_x', row.get('bbox_x', bbox[0] if len(bbox) > 0 else (bbox2[0] if len(bbox2) > 0 else 0))))))
              y = row.get('y', row.get('border_y', row.get('display_y', row.get('model_y', row.get('bbox_y', bbox[1] if len(bbox) > 1 else (bbox2[1] if len(bbox2) > 1 else 0))))))
              w = row.get('w', row.get('border_w', row.get('display_w', row.get('model_w', row.get('bbox_w', bbox[2] if len(bbox) > 2 else (bbox2[2] if len(bbox2) > 2 else 0))))))
              h = row.get('h', row.get('border_h', row.get('display_h', row.get('model_h', row.get('bbox_h', bbox[3] if len(bbox) > 3 else (bbox2[3] if len(bbox2) > 3 else 0))))))
              return num(x), num(y), num(w), num(h)

          added_counts = {}
          for work_id, shard_path in TARGETS.items():
              converted = []
              pattern = str(ROOT / f'data/glyph_boxes/iiif/{work_id}-*/page_*.json')
              page_files = sorted(glob.glob(pattern))
              for filename in page_files:
                  path = Path(filename)
                  virtual_id = path.parent.name
                  m = re.search(r'page_(\d+)\.json$', path.name)
                  if not m:
                      continue
                  page_no = int(m.group(1))
                  try:
                      rows = json.loads(path.read_text(encoding='utf-8'))
                  except Exception:
                      continue
                  if not isinstance(rows, list) or not rows:
                      continue
                  row_count = estimate_rows(len(rows))
                  for i, row in enumerate(rows, 1):
                      if not isinstance(row, dict):
                          continue
                      x, y, w, h = rect(row)
                      if w <= 0 or h <= 0:
                          continue
                      ch = str(row.get('char') or row.get('text') or row.get('value') or '')[:1]
                      converted.append({
                          'glyph_id': f'{virtual_id}_p{page_no:04d}_c{i:03d}',
                          'char': ch,
                          'work_id': work_id,
                          'virtual_id': virtual_id,
                          'canvas_index': page_no,
                          'canvas_label': str(row.get('canvas_label') or page_no),
                          'canvas_width': num(row.get('canvas_width'), 0),
                          'canvas_height': num(row.get('canvas_height'), 0),
                          'order_in_page': i,
                          'x': x,
                          'y': y,
                          'w': w,
                          'h': h,
                          'auto_col': num(row.get('auto_col'), (i - 1) // row_count),
                          'auto_row': num(row.get('auto_row'), (i - 1) % row_count),
                          'source': 'model_border_refined',
                      })

              shard = json.loads(shard_path.read_text(encoding='utf-8'))
              if not isinstance(shard, list):
                  raise RuntimeError(f'Invalid shard: {shard_path}')
              shard = [r for r in shard if str(r.get('work_id', '')).zfill(3) != work_id]
              converted.sort(key=lambda r: (r.get('virtual_id', ''), int(r.get('canvas_index', 0)), int(r.get('order_in_page', 0))))
              shard.extend(converted)
              shard_path.write_text(json.dumps(shard, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
              added_counts[work_id] = len(converted)

          # Update manifest, preserving its existing structure and file order.
          manifest_path = ROOT / 'data/model_boxes/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '20260711_model_border_v3'
          manifest['works'] = [f'{n:03d}' for n in range(1, 46)]
          manifest['work_count'] = 45
          manifest.pop('iiif_fallback', None)

          total = 0
          for item in manifest.get('files', []):
              file_path = ROOT / item['file']
              data = json.loads(file_path.read_text(encoding='utf-8'))
              raw = file_path.read_bytes()
              works = sorted({str(r.get('work_id', '')).zfill(3) for r in data if r.get('work_id') not in (None, '')})
              item['records'] = len(data)
              item['works'] = works
              item['bytes'] = len(raw)
              item['sha256'] = hashlib.sha256(raw).hexdigest()
              total += len(data)
          manifest['total_records'] = total
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')

          # Remove only the temporary compatibility layer from the existing patch.
          js_path = ROOT / 'js/detail_info_patch.js'
          js = js_path.read_text(encoding='utf-8')
          js = js.replace('   2. 45件碑帖统一采用与深度学习结果一致的字框表示结构。\n   3. 014、031、039沿用现有坐标数值，但在前端标准化为同样的 x/y/w/h 与 model_border_refined 表示。',
                          '   2. 45件碑帖统一读取 data/model_boxes 中的 model_border_refined 字框。')
          js = js.replace('const MODEL_VERSION = "20260711_model_border_v2";', 'const MODEL_VERSION = "20260711_model_border_v3";')
          js = re.sub(r'\n  const MODEL_COMPAT_WORKS = new Set\(\["014","031","039"\]\);', '', js, count=1)
          js = re.sub(r'\n  function normalizeCompatibleRows\(rows,pageObj\)\{.*?\n  \}\n\n  function installModelBoxOverride',
                      '\n\n  function installModelBoxOverride', js, count=1, flags=re.S)

          old_filter = '''      const rows = shard.filter(r=>
        String(r.work_id || "").padStart(3,"0") === parentId &&
        +r.canvas_index === pageNo
      );
      if(rows.length) return normalizeModelRows(rows,pageObj);

      const compatibleRows = await originalLoadPageGlyphBoxes(id,pageObj);
      if(MODEL_COMPAT_WORKS.has(parentId) && compatibleRows.length){
        return normalizeCompatibleRows(compatibleRows,pageObj);
      }
      return compatibleRows;'''
          new_filter = '''      const effectiveId = (typeof EFFECTIVE_WORK_ID !== "undefined" && EFFECTIVE_WORK_ID)
        ? String(EFFECTIVE_WORK_ID)
        : (rawId.includes("-") ? rawId : parentId);
      const rows = shard.filter(r=>{
        const recordWorkId = String(r.work_id || "").padStart(3,"0");
        const recordVirtualId = String(r.virtual_id || "");
        const idMatches = recordVirtualId ? recordVirtualId === effectiveId : recordWorkId === parentId;
        return idMatches && +r.canvas_index === pageNo;
      });
      if(rows.length) return normalizeModelRows(rows,pageObj);
      return originalLoadPageGlyphBoxes(id,pageObj);'''
          if old_filter not in js:
              raise RuntimeError('Expected compatibility filter block was not found')
          js = js.replace(old_filter, new_filter, 1)

          js = js.replace('      if(!data.length && !MODEL_COMPAT_WORKS.has(parentId)) return;', '      if(!data.length) return;', 1)
          js = re.sub(r'''  function updateSourceNote\(\)\{\n    const sourceParagraph=document\.querySelector\("#sources p"\);\n    if\(!sourceParagraph\) return;\n    if\(MODEL_COMPAT_WORKS\.has\(parentId\)\)\{\n      sourceParagraph\.innerHTML="[^"]*";\n    \}else\{\n      sourceParagraph\.innerHTML="[^"]*";\n    \}\n  \}''',
                      '''  function updateSourceNote(){
    const sourceParagraph=document.querySelector("#sources p");
    if(!sourceParagraph) return;
    sourceParagraph.innerHTML="本作品的单字定位读取统一的深度学习模型最终边框坐标数据。";
  }''', js, count=1)
          if 'MODEL_COMPAT_WORKS' in js or 'normalizeCompatibleRows' in js:
              raise RuntimeError('Compatibility code still remains')
          js_path.write_text(js, encoding='utf-8')

          print('Converted records:', added_counts)
          print('Total model records:', total)
          PY

      - name: Commit generated model data and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-convert-014-031-039.yml
          git add \
            data/model_boxes/glyph_model_border_011_015.json \
            data/model_boxes/glyph_model_border_031_035.json \
            data/model_boxes/glyph_model_border_036_040.json \
            data/model_boxes/manifest.json \
            js/detail_info_patch.js
          git commit -m "Move 014 031 039 glyph data into model boxes"
          git push
