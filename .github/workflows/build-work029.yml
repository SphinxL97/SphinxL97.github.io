name: Build work029
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - data/work029_raw_text.txt
      - scripts/build_work029.py
      - .github/workflows/build-work029.yml
      - .work029-build-trigger
jobs:
  build:
    if: github.head_ref == 'agent/work029-xianyu'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/work029-xianyu
          fetch-depth: 0
      - name: Build 029 data and modules
        run: python scripts/build_work029.py
      - name: Run validation and save full log
        continue-on-error: true
        run: |
          set +e
          {
            python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('data/work029_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work029_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work029_coordinate_report.json').read_text(encoding='utf-8'))
          checks={
            'raw_square_count':raw.count('□')==20,
            'case_count':len(cases)==20,
            'case_square_sum':sum(x['square_count'] for x in cases)==20,
            'candidate_plus_remaining':sum(x['candidate_count']+x['remaining_square_count'] for x in cases)==20,
            'analysis_present':all(x['analysis'] for x in cases),
            'report_square_count':report['base_text_square_count']==20,
            'report_case_count':report['case_count']==20,
            'same_cases_col3_col4':report['column_four']['uses_same_cases_as_column_three'] is True,
            'page_files_33':len(list(Path('data/glyph_boxes/iiif/029').glob('page_*.json')))==33,
            'mapping_not_nth_forced':'no nth-square forced binding' in report['mapping_method'],
            'all_locations_real':all(loc['bbox']['w']>0 and loc['bbox']['h']>0 and loc['match']=='local-context-verified-model-square' for item in cases for loc in item.get('locations',[])),
          }
          print(json.dumps(checks,ensure_ascii=False,indent=2))
          print(json.dumps({k:report[k] for k in ('model_rows','model_square_count','candidate_count','remaining_square_count','located_case_count','unlocated_case_count')},ensure_ascii=False,indent=2))
          failed=[k for k,v in checks.items() if not v]
          if failed:raise SystemExit('failed checks: '+','.join(failed))
          PY
            echo "python_status=$?"
            node --check js/work-029.js; echo "work_js_status=$?"
            node --check js/work-029-coordinate-adapter.js; echo "coord_js_status=$?"
            node --check js/damage_ai_reading.js; echo "router_status=$?"
            node --check js/detail_info_patch.js; echo "detail_patch_status=$?"
            grep -q '20260725_xianyu_v1' detail.html; echo "detail_cache_status=$?"
            grep -q '"029"' js/damage_ai_reading.js; echo "router_029_status=$?"
            grep -q '鲜于光祖墓志' js/detail_info_patch.js; echo "detail_029_status=$?"
          } > data/work029_validation.log 2>&1
          cat data/work029_validation.log
      - name: Commit generated outputs and validation log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/beitie_catalog.json data/beitie_header_info.json data/page_images_index.json detail.html js/damage_ai_reading.js js/detail_info_patch.js
          git add data/work029_full_text.txt data/work029_damage_cases.json data/work029_coordinate_report.json data/work029_validation.log js/work-029.js js/work-029-coordinate-adapter.js data/glyph_boxes/iiif/029
          git commit -m '暂存029生成结果与完整验证日志'
          git push origin HEAD:agent/work029-xianyu
