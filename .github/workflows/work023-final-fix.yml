name: Finalize work023

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/work023-guifeng'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work023-guifeng
          fetch-depth: 1

      - name: Fix module guard and manually review case09 first square
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          old='20260724_guifeng_v1'
          new='20260724_guifeng_v2'

          page81=json.loads(Path('data/glyph_boxes/iiif/023/page_0081.json').read_text(encoding='utf-8'))
          row=next(r for r in page81 if r['glyph_id']=='023_圭峰定慧禅师碑_p0081_c023')
          location={
            'page':81,
            'glyph_id':row['glyph_id'],
            'canvas':{'w':int(row['canvas_width']),'h':int(row['canvas_height'])},
            'bbox':{'x':row['x'],'y':row['y'],'w':row['w'],'h':row['h']},
            'image':row['local_image'],
            'bbox_source':row.get('bbox_source','model_border_refined'),
            'match_method':'manual-first-square-after-sequence-anchor',
            'alignment_score':1.0,
            'uniqueness_margin':1.0,
            'target_char_in_model':'□',
            'coordinate_note':'连续33个方框跨第81—82页；本句第一个问题字是紧接“永”后的第81页c023，而非后续同分方框。'
          }
          cases_path=Path('data/work023_damage_cases.json')
          cases=json.loads(cases_path.read_text(encoding='utf-8'))
          case09=next(c for c in cases if c['id']=='09')
          case09['locations']=[location]
          case09['page']=81
          cases_path.write_text(json.dumps(cases,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          report_path=Path('data/work023_coordinate_report.json')
          report=json.loads(report_path.read_text(encoding='utf-8'))
          report['status']='confirmed-audit-manual-review-v2'
          audit=next(c for c in report['case_locations'] if c['id']=='09')
          audit.update({
            'located':True,'page':81,'glyph_id':row['glyph_id'],'score':1.0,'margin':1.0,
            'match_method':'manual-first-square-after-sequence-anchor',
            'manual_review':'连续33框跨页，首框经“無負法恩永”顺序核对确定为第81页c023。'
          })
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          work_path=Path('js/work-023.js')
          work=work_path.read_text(encoding='utf-8')
          work=work.replace('workId!=="022"','workId!=="023"',1)
          work=work.replace('__WORK_023_WANGJUSHI__','__WORK_023_GUIFENG__')
          work=work.replace('work023-wangjushi-style','work023-guifeng-style')
          work=work.replace(old,new)
          work_path.write_text(work,encoding='utf-8')

          adapter_path=Path('js/work-023-coordinate-adapter.js')
          adapter_path.write_text(adapter_path.read_text(encoding='utf-8').replace(old,new),encoding='utf-8')

          router_path=Path('js/damage_ai_reading.js')
          router=router_path.read_text(encoding='utf-8').replace(old,new)
          router=router.replace('020、022使用单一专属模块','020、022、023使用单一专属模块')
          router_path.write_text(router,encoding='utf-8')

          detail_path=Path('js/detail_info_patch.js')
          detail=detail_path.read_text(encoding='utf-8').replace(old,new)
          detail_path.write_text(detail,encoding='utf-8')

          html_path=Path('detail.html')
          html_path.write_text(html_path.read_text(encoding='utf-8').replace(old,new),encoding='utf-8')
          PY

      - name: Validate work023 final state
        run: |
          node --check js/work-023.js
          node --check js/work-023-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          python - <<'PY'
          import json
          from pathlib import Path
          cases=json.loads(Path('data/work023_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work023_coordinate_report.json').read_text(encoding='utf-8'))
          work=Path('js/work-023.js').read_text(encoding='utf-8')
          assert 'workId!=="023"' in work and 'workId!=="022"' not in work
          assert '__WORK_023_GUIFENG__' in work
          case09=next(c for c in cases if c['id']=='09')
          assert case09['page']==81 and case09['locations'][0]['glyph_id'].endswith('p0081_c023')
          assert report['model_rows']==2119 and report['model_square_count']==93
          assert report['sequence_similarity']==0.9986
          assert report['located_cases']==14 and not report['unlocated_cases']
          assert sum(c['square_count'] for c in cases)==93
          assert sum(c['candidate_count'] for c in cases)==25
          assert sum(c['remaining_square_count'] for c in cases)==68
          assert all('20260724_guifeng_v2' in Path(p).read_text(encoding='utf-8') for p in ['js/work-023.js','js/work-023-coordinate-adapter.js','js/damage_ai_reading.js','js/detail_info_patch.js','detail.html'])
          print('work023 final validation ok')
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/work023-final-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize 023 routing and first-square coordinates'
          git push origin HEAD:agent/work023-guifeng
