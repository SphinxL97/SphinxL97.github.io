name: Refine work027 case analysis
on:
  push:
    branches: [agent/work027-fill-all]
    paths:
      - scripts/refine_work027_analysis.py
      - .github/workflows/refine-work027-analysis.yml
jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/work027-fill-all
          fetch-depth: 0
      - name: Refine all cases
        run: python scripts/refine_work027_analysis.py
      - name: Validate refined content
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          text=Path('data/work027_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work027_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work027_coordinate_report.json').read_text(encoding='utf-8'))
          assert '□' not in text and '〔某〕' not in text
          assert len(cases)==100
          assert sum(x['candidate_count'] for x in cases)==161
          assert all(x['mode']=='documentary' for x in cases)
          assert all(x['category']=='文献对校' for x in cases)
          assert all('□' not in x['corrected'] and '某' not in x['corrected'] for x in cases)
          assert all(len(x['analysis'])==3 for x in cases)
          assert len({tuple(x['analysis']) for x in cases})==100
          assert report['documentary_case_count']==100
          assert report['fallback_candidate_count']==0
          assert report['case_specific_analysis_count']==100
          print({'cases':len(cases),'candidates':161,'specific_analysis':100})
          PY
          node --check js/work-027.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          grep -q '20260724_wei_five_v4' detail.html
      - name: Remove temporary files
        run: |
          rm -f scripts/refine_work027_analysis.py
          rm -f .github/workflows/refine-work027-analysis.yml
      - name: Commit refined analysis
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/work027_full_text.txt data/work027_damage_cases.json data/work027_coordinate_report.json js/work-027.js js/damage_ai_reading.js js/detail_info_patch.js detail.html
          git add -u scripts/refine_work027_analysis.py .github/workflows/refine-work027-analysis.yml
          git commit -m '细化027逐例补字分析并补正常彪贾子谧'
          git push origin HEAD:agent/work027-fill-all
