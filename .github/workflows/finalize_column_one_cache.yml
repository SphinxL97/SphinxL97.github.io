name: Finalize column-one cache versions

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/fix-column-one-coordinate-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-column-one-coordinate-policy
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh cache versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('detail.html'): (
                  'js/detail_info_patch.js?v=20260727_huangtingjian_031_v1',
                  'js/detail_info_patch.js?v=20260727_column_one_policy_v4',
              ),
              Path('js/detail_info_patch.js'): (
                  'js/detail_info_patch_core.js?v=20260724_uniform_font_header_v1',
                  'js/detail_info_patch_core.js?v=20260727_column_one_policy_v4',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: cache anchor count={text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/finalize_column_one_cache.yml').unlink()
          PY

          node --check js/detail_info_patch.js
          node --check js/detail_info_patch_core.js
          grep -F 'js/detail_info_patch.js?v=20260727_column_one_policy_v4' detail.html
          grep -F 'js/detail_info_patch_core.js?v=20260727_column_one_policy_v4' js/detail_info_patch.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "刷新栏目一坐标策略缓存 [skip ci]"
          git push origin HEAD:agent/fix-column-one-coordinate-policy
