name: Diagnose final column one fix

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-final-column1-model-boxes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-final-column1-model-boxes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/final_column1_apply_temp.py
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          python -m http.server 8000 >/tmp/final-column1-diag-http.log 2>&1 &
          python tools/final_column1_diag_temp.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-column1-diagnostics
          path: /tmp/final-column1-diag/*
          retention-days: 1
