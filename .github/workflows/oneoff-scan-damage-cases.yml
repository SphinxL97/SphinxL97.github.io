name: One-off scan damaged-text case locations

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/damage-ai-scan-trigger'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Find exact Dao Yin case pages and model boxes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict

          rows=json.loads(Path('data/model_boxes/glyph_model_border_001_005.json').read_text(encoding='utf-8'))
          rows=[r for r in rows if str(r.get('work_id','')).zfill(3)=='001']
          pages=defaultdict(list)
          for r in rows:
              pages[int(r.get('canvas_index',0))].append(r)
          for p in pages:
              pages[p].sort(key=lambda r:int(r.get('order_in_page',0)))

          index=json.loads(Path('data/page_images_index.json').read_text(encoding='utf-8'))
          page_map={int(p['page']):p['image'] for p in index['works']['001']['pages']}

          def compact(r):
              return {k:r.get(k) for k in ['glyph_id','char','x','y','w','h','canvas_width','canvas_height','order_in_page']}

          def union_box(items,pad_x=70,pad_y=90):
              minx=min(float(r['x']) for r in items); miny=min(float(r['y']) for r in items)
              maxx=max(float(r['x'])+float(r['w']) for r in items); maxy=max(float(r['y'])+float(r['h']) for r in items)
              cw=float(items[0].get('canvas_width') or 1); ch=float(items[0].get('canvas_height') or 1)
              x=max(0,minx-pad_x); y=max(0,miny-pad_y)
              return {'x':x,'y':y,'w':min(cw,maxx+pad_x)-x,'h':min(ch,maxy+pad_y)-y,'canvas_width':cw,'canvas_height':ch}

          def case1():
              p=56; rs=pages[p]; text=''.join(str(r.get('char') or '')[:1] for r in rs)
              issue_i=text.find('对几')+2
              target=rs[issue_i]
              start=text.find('循堂室而濡涕'); end=text.find('而流恸')+len('而流恸')
              context=rs[start:end]
              return {'page':p,'image':page_map[p],'text':text,'target_box':compact(target),'context_boxes':[compact(r) for r in context],'crop':union_box(context,90,120)}

          def case2():
              p=19; rs=pages[p]; text=''.join(str(r.get('char') or '')[:1] for r in rs)
              issue_i=text.find('逮乎初卝')+3
              target=rs[issue_i]
              start=text.find('逮乎初卝'); end=text.find('方蒙落发')+len('方蒙落发')
              context=rs[start:end]
              return {'page':p,'image':page_map[p],'text':text,'target_box':compact(target),'context_boxes':[compact(r) for r in context],'crop':union_box(context,90,120)}

          def case3():
              p=63; rs=pages[p]; text=''.join(str(r.get('char') or '')[:1] for r in rs)
              start=text.find('沦羲'); end=text.find('光',start)+1
              context=rs[start:end]
              damaged=[r for r in context if str(r.get('char') or '')[:1]=='□']
              target_items=damaged or context[2:-1] or context
              return {'page':p,'image':page_map[p],'text':text,'target_box':union_box(target_items,0,0),'context_boxes':[compact(r) for r in context],'crop':union_box(context,120,150)}

          out={'case1':case1(),'case2':case2(),'case3':case3()}
          Path('.github/damage_ai_scan_result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Commit scan result to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/damage_ai_scan_result.json
          git commit -m "Scan exact damaged-text case locations"
          git push origin HEAD:${{ github.head_ref }}
