name: Unify detail header font

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/unify-detail-header-font'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-detail-header-font
          fetch-depth: 1

      - name: Apply unified font migration
        run: python scripts/unify_detail_header_font.py

      - name: Validate uniform font and scope
        run: |
          node --check js/detail_info_patch.js
          node --check js/detail_info_patch_core.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          entry=Path('js/detail_info_patch.js').read_text(encoding='utf-8')
          core=Path('js/detail_info_patch_core.js').read_text(encoding='utf-8')
          html=Path('detail.html').read_text(encoding='utf-8')
          assert '__DETAIL_INFO_STABLE_ENTRY_V18__' in entry
          assert '20260724_uniform_font_header_v1' in entry and '20260724_uniform_font_header_v1' in html
          assert '.meta-line span{' in core and 'font-size:15px!important;' in core
          assert 'font-size:13.5px!important' not in core
          assert '.meta-line.compact-note span{' in core
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).split())
          assert changed == {'detail.html','js/detail_info_patch.js','js/detail_info_patch_core.js'}, changed
          print('uniform detail header font validation ok')
          PY

      - name: Commit final shared files and remove temporary files
        run: |
          rm -f .github/workflows/unify-detail-header-font.yml scripts/unify_detail_header_font.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify detail header font size"
          git push origin HEAD:agent/unify-detail-header-font
