name: Import complete stele header information

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-header-info.yml"
      - "data/header_info_import.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install complete header-card data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          source_path = Path('data/header_info_import.json')
          final_path = Path('data/beitie_header_info.json')
          patch_path = Path('js/detail_info_patch.js')

          payload = json.loads(source_path.read_text(encoding='utf-8'))
          if len(payload) != 45:
              raise SystemExit(f'应有45件碑帖，实际为{len(payload)}件。')
          expected = [f'{i:03d}' for i in range(1, 46)]
          if sorted(payload) != expected:
              raise SystemExit('碑帖ID不完整或顺序异常。')

          final_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          text = patch_path.read_text(encoding='utf-8')

          old_constants = '  const INFO_URL = "data/beitie_info_texts.json?v=20260629_info";\n  let infoCache = null;'
          new_constants = '  const INFO_URL = "data/beitie_info_texts.json?v=20260629_info";\n  const HEADER_URL = "data/beitie_header_info.json?v=20260716_full";\n  let infoCache = null;\n  let headerCache = null;'
          if old_constants not in text:
              raise SystemExit('未找到信息数据常量。')
          text = text.replace(old_constants, new_constants, 1)

          new_basic_block = '''  function cleanMetaValue(value){
            return String(value == null ? "" : value).trim();
          }

          function firstMetaValue(...values){
            for(const value of values){
              const text=cleanMetaValue(value);
              if(text) return text;
            }
            return "";
          }

          function renderHeaderCard(info,header){
            const box=document.querySelector(".meta-lines");
            if(!box) return;
            const oldBasic=(info && info.basic) || {};
            const newBasic=(header && header.basic) || {};
            const b={...oldBasic,...newBasic};
            const title=(info && info.title) || document.querySelector(".info-panel h1")?.textContent.trim() || "";
            const rows=[];
            const push=(label,value)=>{
              const text=cleanMetaValue(value);
              if(text) rows.push([label,text]);
            };
            const firstTitle=firstMetaValue(b["首题"]);
            if(firstTitle && firstTitle!==title) push("首题",firstTitle);
            push("其他题名",b["其他题名"]);
            push("额题",b["额题"]);
            push("责任者",b["责任者"]);
            push("书体",b["书体"]);
            push("版本",b["版本"]);
            push("影印版本",b["影印版本"]);
            push("版本说明",b["版本说明"]);
            push("数量",b["数量"]);
            push("尺寸",b["尺寸"]);
            push("年代",firstMetaValue(b["刻立年代"],b["年代"],b["时代"]));
            push("刻立地点",firstMetaValue(b["刻立地点"],b["地点"]));
            push("出土地点",b["出土地点"]);
            push("馆藏",b["馆藏"]);
            push("镌刻特征",b["镌刻特征"]);
            push("铭文行款",b["铭文行款"]);
            push("来源",b["来源"]);

            box.replaceChildren();
            const wideLabels=new Set(["其他题名","版本说明","尺寸","镌刻特征","铭文行款","来源"]);
            rows.forEach(([label,value])=>{
              const line=document.createElement("div");
              line.className="meta-line";
              if(wideLabels.has(label) || value.length>38) line.classList.add("wide");
              const term=document.createElement("b");
              term.textContent=label;
              const desc=document.createElement("span");
              desc.textContent=value;
              line.append(term,desc);
              box.appendChild(line);
            });
          }

          function applyBasic(info,header){
            const safeInfo=info || {};
            if(safeInfo.title){
              document.title=safeInfo.title+" · 碑帖智能读析平台";
              setText(".info-panel h1",safeInfo.title);
              setText(".side .work-name",safeInfo.title);
              setText(".cover-label",safeInfo.title);
            }
            if(safeInfo.summary) setText(".alias",safeInfo.summary);
            renderHeaderCard(safeInfo,header || {});
          }

          function setModal'''

          pattern_basic = re.compile(r'  function updateMetaLine\(label,value\)\{.*?\n  function setModal', re.S)
          text, count = pattern_basic.subn(new_basic_block, text, count=1)
          if count != 1:
              raise SystemExit(f'信息卡函数替换失败：{count}')

          old_apply_info = '''  function applyInfo(info){
            ensureStyle();
            applyBasic(info);
            updateSourceNote();
            setModal("history","收藏历史","流传经历与题记。",info.history || "");
            setModal("story","背景故事","作品背景、版本线索与重要考据点。",info.story || "");
          }'''
          new_apply_info = '''  function applyInfo(info,header){
            const safeInfo=info || {};
            ensureStyle();
            applyBasic(safeInfo,header || {});
            updateSourceNote();
            setModal("history","收藏历史","流传经历与题记。",safeInfo.history || "");
            setModal("story","背景故事","作品背景、版本线索与重要考据点。",safeInfo.story || "");
          }'''
          if old_apply_info not in text:
              raise SystemExit('未找到 applyInfo 原函数。')
          text = text.replace(old_apply_info, new_apply_info, 1)

          new_loader = '''  async function loadAndApply(){
            try{
              if(!infoCache){
                const res=await fetch(INFO_URL,{cache:"no-store"});
                infoCache=res.ok ? await res.json() : {items:{}};
              }
              if(!headerCache){
                const res=await fetch(HEADER_URL,{cache:"no-store"});
                headerCache=res.ok ? await res.json() : {};
              }
              const info=(infoCache && infoCache.items && infoCache.items[workId()]) || {};
              const header=(headerCache && headerCache[workId()]) || {};
              if(!Object.keys(info).length && !Object.keys(header).length){
                updateSourceNote();
                return;
              }
              applyInfo(info,header);

              let n=0;
              const timer=setInterval(()=>{
                applyInfo(info,header);
                n+=1;
                if(n>=12) clearInterval(timer);
              },350);
            }catch(e){
              console.warn("[beitie-info] failed",e);
            }
          }

          if(document.readyState'''

          pattern_loader = re.compile(r'  async function loadAndApply\(\)\{.*?\n  if\(document\.readyState', re.S)
          text, count = pattern_loader.subn(new_loader, text, count=1)
          if count != 1:
              raise SystemExit(f'信息加载函数替换失败：{count}')

          patch_path.write_text(text, encoding='utf-8')
          if 'beitie_header_info.json' not in text or 'renderHeaderCard' not in text:
              raise SystemExit('补丁写入校验失败。')
          print('已为45件碑帖安装完整顶部信息卡数据。')
          PY

          node --check js/detail_info_patch.js

      - name: Commit only information-card changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm data/header_info_import.json .github/workflows/import-header-info.yml
          git add data/beitie_header_info.json js/detail_info_patch.js
          git commit -m "补全45件碑帖详情页顶部信息卡"
          git push
