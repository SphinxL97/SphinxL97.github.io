name: Build work022

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/work022-wangjushi-rebuild
    paths:
      - .work022-rebuild-trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work022-wangjushi-rebuild
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate work022 files
        run: python scripts/work022_rebuild.py
      - name: Validate JSON and JavaScript
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('data/work022_damage_cases.json'), Path('data/work022_coordinate_report.json'), Path('data/beitie_catalog.json'), Path('data/beitie_header_info.json'), Path('data/page_images_index.json')]:
              json.loads(p.read_text(encoding='utf-8'))
          print('json ok')
          PY
          : > data/work022_validation_report.txt
          for file in js/work-022.js js/work-022-coordinate-adapter.js js/damage_ai_reading.js js/detail_info_patch.js; do
            echo "===== $file =====" >> data/work022_validation_report.txt
            node --check "$file" >> data/work022_validation_report.txt 2>&1 || true
          done
          cat data/work022_validation_report.txt
      - name: Commit generated files and remove temporary files
        run: |
          rm -f scripts/work022_rebuild.py .github/workflows/work022-rebuild.yml .work022-rebuild-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete work022 two-inscription content and coordinates"
          git push origin HEAD:agent/work022-wangjushi-rebuild
