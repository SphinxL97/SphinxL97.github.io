name: Work043 page audit

on:
  push:
    branches:
      - agent/fix-work043-page-crowdsource
  pull_request:
    branches:
      - main

jobs:
  build-audit-images:
    if: github.head_ref == 'agent/fix-work043-page-crowdsource' || github.ref == 'refs/heads/agent/fix-work043-page-crowdsource'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Build labeled page previews
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw

          source = Path('assets/page_images/043_司马昞妻孟敬训墓志/images')
          out = Path('work043_page_audit')
          out.mkdir(exist_ok=True)
          files = sorted(source.glob('*.jpg'))
          if len(files) != 20:
              raise SystemExit(f'expected 20 images, found {len(files)}')
          for index, path in enumerate(files, start=1):
              with Image.open(path) as image:
                  image = ImageOps.exif_transpose(image).convert('RGB')
                  image.thumbnail((1800, 1800), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGB', (image.width, image.height + 100), 'white')
                  canvas.paste(image, (0, 100))
                  draw = ImageDraw.Draw(canvas)
                  draw.text((30, 30), f'PAGE {index:02d} | {path.name}', fill='black')
                  canvas.save(out / f'page_{index:02d}.jpg', quality=90, optimize=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: work043-page-audit
          path: work043_page_audit/*.jpg
          if-no-files-found: error
          retention-days: 1
