name: Temporary build work028
on:
  push:
    branches: [agent/work028-jintang-nine]
    paths:
      - .work028-build-trigger
      - scripts/build_work028.py
      - data/work028_raw_text.txt
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/work028-jintang-nine
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Build 028
        run: python scripts/build_work028.py
      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('data/work028_raw_text.txt').read_text(encoding='utf-8')
          full=Path('data/work028_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work028_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work028_coordinate_report.json').read_text(encoding='utf-8'))
          assert report['digital_pages']==91
          assert report['base_text_square_count']==raw.count('□')
          assert report['base_text_square_count']==report['model_square_count']
          assert report['candidate_count']==report['base_text_square_count']
          assert report['remaining_square_count']==0
          assert report['case_count']==len(cases)>0
          assert report['located_case_count']==len(cases)
          assert report['unlocated_case_count']==0
          assert report['unresolved_case_count']==0
          assert report['column_four']['case_count']==len(cases)
          assert '□' not in full
          assert all('□' not in row['corrected'] and '□' not in row['current_context'] for row in cases)
          assert all(row['candidate_count']==row['square_count'] for row in cases)
          assert all(row.get('candidate') and '疑' not in row['candidate'] for row in cases)
          assert all(len(row.get('analysis',[]))>=3 for row in cases)
          assert all(row.get('locations') and row['locations'][0].get('bbox') for row in cases)
          files=sorted(Path('data/glyph_boxes/iiif/028').glob('page_*.json'))
          assert len(files)==91, len(files)
          for index,path in enumerate(files,1):
              assert path.name==f'page_{index:04d}.json'
              json.loads(path.read_text(encoding='utf-8'))
          header=json.loads(Path('data/beitie_header_info.json').read_text(encoding='utf-8'))['028']
          catalog=next(x for x in json.loads(Path('data/beitie_catalog.json').read_text(encoding='utf-8')) if x['id']=='028')
          assert header['title']=='晋唐小楷九种'
          assert catalog['status']=='完整样板'
          print({
              'squares':report['base_text_square_count'],
              'cases':len(cases),
              'documentary':report['documentary_case_count'],
              'ai_provisional':report['ai_provisional_case_count'],
              'model_rows':report['model_rows'],
              'coordinate_range':report['coordinate_range'],
          })
          PY
          node --check js/work-028.js
          node --check js/work-028-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          grep -q 'js/work-028-coordinate-adapter.js?v=20260725_jintang_nine_v1' js/damage_ai_reading.js
          grep -q 'js/work-028.js?v=20260725_jintang_nine_v1' js/damage_ai_reading.js
          grep -q '"028":"晋唐小楷九种"' js/detail_info_patch.js
          grep -q '20260725_jintang_nine_v1' detail.html
          grep -q 'getBoundingClientRect' js/work-028.js
      - name: Remove temporary branch files
        run: |
          rm -f scripts/build_work028.py
          rm -f data/work028_raw_text.txt
          rm -f .work028-build-trigger
      - name: Commit generated 028 content
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/beitie_catalog.json data/beitie_header_info.json data/page_images_index.json
          git add data/work028_full_text.txt data/work028_damage_cases.json data/work028_coordinate_report.json
          git add data/glyph_boxes/iiif/028 js/work-028.js js/work-028-coordinate-adapter.js
          git add js/damage_ai_reading.js js/detail_info_patch.js detail.html
          git add -u scripts/build_work028.py data/work028_raw_text.txt .work028-build-trigger
          git commit -m '完成028晋唐小楷九种专属内容与真实坐标'
          git push origin HEAD:agent/work028-jintang-nine
