name: Fix generated work014-01 files

on:
  push:
    branches:
      - agent/work014-01-lihanjing
    paths:
      - '.github/workflows/fix-work014-01-generated.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work014-01-lihanjing
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/fix-work014-01-generated.yml
            js/work-014.js
            js/work-014-coordinate-adapter.js
            js/damage_ai_reading.js
            js/detail_info_patch.js
      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          version='20260723_lihanjing_014_01_v2'

          p=Path('js/work-014.js')
          s=p.read_text('utf-8')
          s=s.replace('const VERSION="20260723_lihanjing_014_01_v1";',f'const VERSION="{version}";')
          s=s.replace('AI分析重点说明候选字与汉代官职、地名、人名、典故、句法和铭文对偶的关系','AI分析重点说明候选字与唐代道教语汇、年号、地名、人名、典故、句法和上下文的关系')
          s=s.replace('const list=Array.isArray(data?.works?.["014-01"]?.pages)?data.works["013"].pages:[];','const list=Array.isArray(data?.works?.["014-01"]?.pages)?data.works["014-01"].pages:[];')
          s=s.replace('section.dataset.work013Dedicated="true";','section.dataset.work01401Dedicated="true";')
          p.write_text(s,encoding='utf-8')

          p=Path('js/work-014-coordinate-adapter.js')
          s=p.read_text('utf-8').replace('20260723_lihanjing_014_01_v1',version).replace('013坐标读取失败','014-01坐标读取失败')
          p.write_text(s,encoding='utf-8')

          p=Path('js/damage_ai_reading.js')
          s=p.read_text('utf-8')
          s=s.replace('006、007、010、011、013使用单一专属模块','006、007、010、011、013、014-01使用单一专属模块')
          s=s.replace('20260723_lihanjing_014_01_v1',version)
          p.write_text(s,encoding='utf-8')

          p=Path('js/detail_info_patch.js')
          s=p.read_text('utf-8').replace('data/beitie_header_info.json?v=20260723_lujun_v1',f'data/beitie_header_info.json?v={version}').replace('20260723_lihanjing_014_01_v1',version)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check js/work-014.js
          node --check js/work-014-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
      - name: Commit fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-work014-01-generated.yml
          git add js/work-014.js js/work-014-coordinate-adapter.js js/damage_ai_reading.js js/detail_info_patch.js
          git commit -m "修正014-01分册索引与专属脚本"
          git push origin HEAD:agent/work014-01-lihanjing
