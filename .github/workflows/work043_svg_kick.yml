name: Finalize Work043 SVG red box

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/work043-svg-red-box-v4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work043-svg-red-box-v4
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply 001-003 style image renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          OLD = '20260726_mengjingxun_043_v3_manual_red_box'
          NEW = '20260726_mengjingxun_043_v4_svg_crop'

          case_path = Path('data/work043_damage_cases.json')
          cases = json.loads(case_path.read_text(encoding='utf-8'))
          loc = cases[0]['locations'][0]
          loc['crop'] = {'x': 280, 'y': 550, 'w': 360, 'h': 980}
          case_path.write_text(json.dumps(cases, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          report_path = Path('data/work043_coordinate_report.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          report['version'] = NEW
          report['coordinate_policy'] = '案例01定位于数字化第9页，以栏目三统一局部图方式显示问题字红框。'
          report['manual_box']['crop'] = {'x': 280, 'y': 550, 'w': 360, 'h': 980}
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          work_path = Path('js/work-043.js')
          text = work_path.read_text(encoding='utf-8').replace(OLD, NEW)
          text = re.sub(
              r'  const INTRO="[^"]*";',
              '  const INTRO="本栏目整理《司马昞妻孟敬训墓志》唯一一处缺字校读。经逐页核验，该句位于数字化第9页；候选字由同位置录文、字形构成和上下文对举共同支持。";',
              text,
              count=1
          )
          replacement = r'''  function locationHTML(item){
    const page=Number(item?.page||0);
    const loc=Array.isArray(item?.locations)?item.locations[0]:null;
    const b=loc?.bbox,crop=loc?.crop;
    if(!page||!b||!crop)return '<div class="damage-location-missing work043-location-missing"><p>本例暂未获得可靠页码与字框。</p></div>';
    const labels=["","一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"];
    const image=`assets/page_images/043_司马昞妻孟敬训墓志/images/${String(page).padStart(4,"0")}_${labels[page]||page}.jpg`;
    const cw=Number(loc.canvas_width||1177),ch=Number(loc.canvas_height||1800);
    return `<div class="damage-viewport" data-image="${esc(image)}" title="双击查看原始拓片"><svg class="damage-crop-svg" viewBox="${crop.x} ${crop.y} ${crop.w} ${crop.h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(item.title)}对应拓片局部"><image href="${esc(image)}" x="0" y="0" width="${cw}" height="${ch}" preserveAspectRatio="none"></image><rect class="damage-box" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"></rect></svg></div><p class="damage-caption">《${TITLE}》第${page}页，对应问题字局部</p>`;
  }
  function analysisHTML'''
          text, count = re.subn(r'  function locationHTML\(item\)\{.*?\n  \}\n  function analysisHTML', replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('failed to replace 043 locationHTML')
          text = text.replace('<h3>拓片原图（第${item.page}页）</h3>${locationHTML(item)}', '<h3>拓片原图（局部）</h3>${locationHTML(item)}')

          style_match = re.search(r'style\.textContent="([^"]*)";', text)
          if not style_match:
              raise SystemExit('043 style block missing')
          css = style_match.group(1)
          for selector in [r'\.damage-image-card\{[^}]*\}',r'\.work043-location-missing\{[^}]*\}',r'\.work043-page-only\{[^}]*\}',r'\.work043-image-stage\{[^}]*\}',r'\.work043-image-stage img\{[^}]*\}',r'\.work043-manual-box\{[^}]*\}',r'\.work043-page-only p\{[^}]*\}']:
              css = re.sub(selector, '', css)
          text = text[:style_match.start(1)] + css + text[style_match.end(1):]

          anchor = '    section.querySelectorAll("[data-case-index]").forEach(button=>button.addEventListener("click",()=>{current=Number(button.dataset.caseIndex)||0;renderDamage();}));\n    if(typeof window.applyDamageCategoryUI==="function")window.applyDamageCategoryUI();'
          replacement_bind = '    section.querySelectorAll("[data-case-index]").forEach(button=>button.addEventListener("click",()=>{current=Number(button.dataset.caseIndex)||0;renderDamage();}));\n    section.querySelector(".damage-viewport")?.addEventListener("dblclick",event=>{const src=event.currentTarget.dataset.image;if(src&&typeof window.openZoom==="function")window.openZoom(src);});\n    if(typeof window.applyDamageCategoryUI==="function")window.applyDamageCategoryUI();'
          if anchor not in text:
              raise SystemExit('043 bind anchor missing')
          text = text.replace(anchor, replacement_bind)
          work_path.write_text(text, encoding='utf-8')

          router_path = Path('js/damage_ai_reading.js')
          router = router_path.read_text(encoding='utf-8').replace(OLD, NEW)
          router = router.replace('  if(window.__DAMAGE_AI_READING_ROUTER_V83__)return;\n  window.__DAMAGE_AI_READING_ROUTER_V83__=true;', '  if(window.__DAMAGE_AI_READING_ROUTER_V84__)return;\n  window.__DAMAGE_AI_READING_ROUTER_V84__=true;\n  window.__DAMAGE_AI_READING_ROUTER_V83__=true;')
          router_path.write_text(router, encoding='utf-8')

          patch_path = Path('js/detail_info_patch.js')
          patch = patch_path.read_text(encoding='utf-8').replace(OLD, NEW)
          patch = patch.replace('  if(window.__DETAIL_INFO_STABLE_ENTRY_V43__)return;\n  window.__DETAIL_INFO_STABLE_ENTRY_V43__=true;', '  if(window.__DETAIL_INFO_STABLE_ENTRY_V44__)return;\n  window.__DETAIL_INFO_STABLE_ENTRY_V44__=true;\n  window.__DETAIL_INFO_STABLE_ENTRY_V43__=true;')
          patch_path.write_text(patch, encoding='utf-8')

          html_path = Path('detail.html')
          html_path.write_text(html_path.read_text(encoding='utf-8').replace(OLD, NEW), encoding='utf-8')

          fixed = work_path.read_text(encoding='utf-8')
          assert 'class="damage-crop-svg"' in fixed
          assert 'class="damage-box"' in fixed
          assert '拓片原图（局部）' in fixed
          assert '《${TITLE}》第${page}页，对应问题字局部' in fixed
          assert '人工核验校准' not in fixed
          assert '不是模型自动bbox' not in fixed
          assert 'work043-manual-box' not in fixed
          PY

      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate browser rendering
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/work043-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={'width':1536,'height':1024})
              errors=[]
              page.on('pageerror',lambda exc:errors.append(str(exc)))
              page.goto('http://127.0.0.1:8000/detail.html?id=043',wait_until='networkidle')
              page.wait_for_function('() => Boolean(window.__WORK_043_STABLE_READY__ && window.__WORK_043_CROWDSOURCE_READY__)')
              page.wait_for_selector('#people .damage-box',state='visible')
              assert page.locator('#people .damage-box').count()==1
              assert page.locator('#people .damage-crop-svg').count()==1
              rect=page.locator('#people .damage-box').bounding_box()
              viewport=page.locator('#people .damage-viewport').bounding_box()
              assert rect and viewport
              assert rect['width']>=45 and rect['height']>=45,rect
              assert rect['x']>=viewport['x'] and rect['y']>=viewport['y']
              assert rect['x']+rect['width']<=viewport['x']+viewport['width']+2
              assert rect['y']+rect['height']<=viewport['y']+viewport['height']+2
              text=page.locator('#people').inner_text()
              assert '拓片原图（局部）' in text
              assert '《司马昞妻孟敬训墓志》第9页，对应问题字局部' in text
              assert '人工核验校准' not in text
              assert '不是模型自动bbox' not in text
              assert '恢复依据' not in text
              assert not errors,errors
              page.locator('#people').screenshot(path='/tmp/work043-svg-red-box.png')
              browser.close()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: work043-svg-red-box-validation
          path: /tmp/work043-svg-red-box.png
          retention-days: 1

      - name: Commit final clean diff
        shell: bash
        run: |
          rm -f .github/workflows/work043_svg_red_box.yml .github/workflows/work043_svg_kick.yml _tmp_work043_svg_trigger.txt _tmp_work043_svg_kick2.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "按001至003样式修复043红框与图注 [skip ci]"
          git push origin HEAD:agent/work043-svg-red-box-v4
