name: Temporary finalize work036

on:
  push:
    branches:
      - agent/add-work036-yiheming
    paths:
      - 'scripts/_tmp_finalize_work036.py'
      - '.github/workflows/_tmp_finalize_work036.yml'

permissions:
  contents: write

jobs:
  build-test-clean:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-work036-yiheming
          fetch-depth: 0

      - name: Generate work036 content and coordinates
        run: python3 scripts/_tmp_finalize_work036.py

      - name: Validate source data and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check js/work-036.js
          node --check js/work-036-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('data/work036_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work036_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work036_coordinate_report.json').read_text(encoding='utf-8'))
          assert text.count('□')==23
          assert len([p for p in text.strip().split('\n\n') if p.strip()])==2
          assert '（一）' not in text and '水前本' not in text and '水后本' not in text
          assert len(cases)==13 and all(c.get('locations') and c['locations'][0].get('bbox') for c in cases)
          assert sum(len(c['slot_global_boxes']) for c in cases)==23
          assert report['model_glyph_count']==138 and report['model_box_count']==31
          assert report['located_case_count']==13 and report['unmatched_model_box_count']==8
          assert len(list(Path('data/glyph_boxes/iiif/036').glob('page_*.json')))==64
          print({'paragraphs':2,'cases':13,'user_boxes':23,'model_glyphs':138,'model_boxes':31,'coordinate_pages':64})
          PY
          grep -F '《${TITLE}》第${page}页，对应问题字局部' js/work-036.js
          grep -F '拓片原图（局部）' js/work-036.js
          ! grep -F '恢复依据' js/work-036.js
          ! grep -F '真实模型字框' js/work-036.js
          ! grep -F 'title="${esc(loc.glyph_id' js/work-036.js
          grep -F '__DAMAGE_AI_READING_ROUTER_V80__' js/damage_ai_reading.js
          grep -F '__DETAIL_INFO_STABLE_ENTRY_V40__' js/detail_info_patch.js

      - name: Install browser dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Test rendered work036 page
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/work036-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:8000/detail.html?id=036',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__WORK_036_STABLE_READY__===true,{timeout:30000});
            const base=await page.evaluate(()=>({
              title:document.title,
              transcriptParagraphs:document.querySelectorAll('#calligraphy .full-transcript-body > p').length,
              transcriptText:document.querySelector('#calligraphy .full-transcript-body')?.innerText||'',
              cases:document.querySelectorAll('#people .damage-tab').length,
              sharedCases:Array.isArray(window.DAMAGE_AI_CASES)?window.DAMAGE_AI_CASES.length:0,
              redBoxes:document.querySelectorAll('#people .work036-real-box').length,
              tooltipTitles:Array.from(document.querySelectorAll('#people .work036-real-box')).filter(n=>n.hasAttribute('title')).length,
              caption:document.querySelector('#people .damage-caption')?.textContent?.trim()||'',
              forbidden:document.querySelector('#people')?.innerText.includes('恢复依据')||document.body.innerText.includes('真实模型字框')
            }));
            if(base.transcriptParagraphs!==2)throw new Error('transcript paragraph count: '+JSON.stringify(base));
            if(/[（(][一二三四五六七八九十]+[）)]/.test(base.transcriptText)||base.transcriptText.includes('水前本')||base.transcriptText.includes('水后本'))throw new Error('transcript title residue: '+JSON.stringify(base));
            if(base.cases!==13||base.sharedCases!==13||base.redBoxes<1)throw new Error('case or red box regression: '+JSON.stringify(base));
            if(base.tooltipTitles!==0||base.forbidden)throw new Error('technical residue: '+JSON.stringify(base));
            if(!/^《瘗鹤铭》第\d+页，对应问题字局部$/.test(base.caption))throw new Error('caption mismatch: '+JSON.stringify(base));
            for(const index of [0,2,5,9,12]){
              await page.locator(`#people [data-case-index="${index}"]`).click();
              const sample=await page.evaluate(()=>({box:document.querySelectorAll('#people .work036-real-box').length,caption:document.querySelector('#people .damage-caption')?.textContent?.trim()||''}));
              if(sample.box<1||!/^《瘗鹤铭》第\d+页，对应问题字局部$/.test(sample.caption))throw new Error('sample failure '+index+': '+JSON.stringify(sample));
            }
            console.log(JSON.stringify(base,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS

      - name: Remove temporary audit and build files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_tmp_audit_work036.py
          rm -f scripts/_tmp_finalize_work036.py
          rm -f data/_tmp_work036_coordinate_audit.json
          rm -f data/_tmp_work036_case_seed.json
          rm -f .github/workflows/_tmp_audit_work036.yml
          rm -f .github/workflows/_tmp_finalize_work036.yml
          rm -rf node_modules package-lock.json package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完成036瘗鹤铭专属内容 [skip ci]'
          git push origin HEAD:agent/add-work036-yiheming
