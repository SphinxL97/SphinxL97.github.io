name: Remove 014-02 colophon tail

on:
  push:
    branches:
      - agent/remove-01402-colophon-tail

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-01402-colophon-tail
          fetch-depth: 0
      - name: Remove requested sentence and bump cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "js/work-014-02.js": [
                  (
                      "此为南宋绍兴丁巳记碑石折断及扶起之事，不属于颜真卿原碑文，也不进入栏目三与栏目四。",
                      "此为南宋绍兴丁巳记碑石折断及扶起之事，不属于颜真卿原碑文。",
                  ),
                  ("20260723_lihanjing_014_02_v1", "20260723_lihanjing_014_02_v2"),
              ],
              "js/damage_ai_reading.js": [
                  ("js/work-014-02.js?v=20260723_lihanjing_014_02_v1", "js/work-014-02.js?v=20260723_lihanjing_014_02_v2"),
              ],
              "js/detail_info_patch.js": [
                  ("js/damage_ai_reading.js?v=20260723_lihanjing_014_02_v1", "js/damage_ai_reading.js?v=20260723_lihanjing_014_02_v2"),
              ],
              "detail.html": [
                  ("js/detail_info_patch.js?v=20260723_lihanjing_014_02_v1", "js/detail_info_patch.js?v=20260723_lihanjing_014_02_v2"),
                  ("js/damage_ai_reading.js?v=20260723_lihanjing_014_02_v1", "js/damage_ai_reading.js?v=20260723_lihanjing_014_02_v2"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Missing expected text in {filename}: {old}")
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f"No change made to {filename}")
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/work-014-02.js js/damage_ai_reading.js js/detail_info_patch.js detail.html
          git commit -m "删除014-02册尾题记多余说明"
          git push origin HEAD:agent/remove-01402-colophon-tail
