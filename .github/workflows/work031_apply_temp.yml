name: Apply Work031 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/work031-huangtingjian-volumes-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work031-huangtingjian-volumes-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply confirmed Work031 implementation
        run: python tools/work031_apply_temp.py
      - name: Commit formal files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "完成031两册专属内容 [skip ci]"
          git push origin HEAD:agent/work031-huangtingjian-volumes-v1
