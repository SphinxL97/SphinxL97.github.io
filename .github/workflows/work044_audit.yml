name: Audit Work044 images and coordinates

on:
  push:
    branches:
      - agent/work044-cui-jingyong-v1

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Build contact sheets and coordinate summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          import json, math

          src = Path('assets/page_images/044_崔敬邕墓誌/images')
          out = Path('work044_audit')
          out.mkdir(exist_ok=True)
          files = sorted(src.glob('*.jpg'))
          if len(files) != 52:
              raise SystemExit(f'expected 52 pages, found {len(files)}')

          thumb_w, thumb_h = 360, 500
          label_h = 42
          cols, rows = 4, 4
          per_sheet = cols * rows
          for sheet_i in range(math.ceil(len(files)/per_sheet)):
              batch = files[sheet_i*per_sheet:(sheet_i+1)*per_sheet]
              sheet = Image.new('RGB', (cols*thumb_w, rows*(thumb_h+label_h)), 'white')
              draw = ImageDraw.Draw(sheet)
              for i, path in enumerate(batch):
                  page = sheet_i*per_sheet+i+1
                  with Image.open(path) as im:
                      im = ImageOps.exif_transpose(im).convert('RGB')
                      canvas = Image.new('RGB', (thumb_w, thumb_h), '#f5f1e8')
                      copy = im.copy()
                      copy.thumbnail((thumb_w-10, thumb_h-10), Image.Resampling.LANCZOS)
                      canvas.paste(copy, ((thumb_w-copy.width)//2, (thumb_h-copy.height)//2))
                  x = (i%cols)*thumb_w
                  y = (i//cols)*(thumb_h+label_h)
                  sheet.paste(canvas, (x,y))
                  draw.rectangle((x,y+thumb_h,x+thumb_w,y+thumb_h+label_h), fill='white')
                  draw.text((x+10,y+thumb_h+10), f'PAGE {page:02d} | {path.name}', fill='black')
              sheet.save(out/f'contact_{sheet_i+1:02d}.jpg', quality=92)

          model_path = Path('data/model_boxes/glyph_model_border_041_045.json')
          rows_data = json.loads(model_path.read_text(encoding='utf-8'))
          work = [r for r in rows_data if str(r.get('work_id','')).zfill(3) == '044']
          summary = {
              'count': len(work),
              'pages': {},
              'question_like': [],
          }
          for r in work:
              page = str(r.get('canvas_index'))
              summary['pages'][page] = summary['pages'].get(page,0)+1
              if str(r.get('char','')) in {'□','?','？'}:
                  summary['question_like'].append(r)
          (out/'coordinates_044.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: work044-audit
          path: work044_audit
          retention-days: 2
