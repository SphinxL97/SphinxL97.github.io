name: Temporary debug work028 build
on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - scripts/build_work028.py
      - data/work028_raw_text.txt
      - .work028-build-trigger
      - data/work028_build_error.log
jobs:
  debug:
    if: github.head_ref == 'agent/work028-jintang-nine'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work028-jintang-nine
          fetch-depth: 0
      - name: Guard repeated diagnostic commit
        id: guard
        run: |
          if [ -f data/work028_validation_error.log ]; then
            echo 'run_build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run_build=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.run_build == 'true'
        run: python -m pip install beautifulsoup4
      - name: Patch non-ASCII URL handling
        if: steps.guard.outputs.run_build == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/build_work028.py')
          text=path.read_text(encoding='utf-8')
          old='req = urllib.request.Request(url, headers=headers)'
          new='req = urllib.request.Request(urllib.parse.quote(url, safe=\":/?=&%\"), headers=headers)'
          if 'import urllib.parse' not in text:
              text=text.replace('import urllib.request', 'import urllib.parse\nimport urllib.request', 1)
          if old not in text and new not in text:
              raise SystemExit('找不到URL请求语句')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Run build
        if: steps.guard.outputs.run_build == 'true'
        shell: bash
        run: |
          set +e
          python scripts/build_work028.py > /tmp/work028-build.log 2>&1
          status=$?
          cat /tmp/work028-build.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/work028-build.log data/work028_build_error.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add data/work028_build_error.log
            git commit -m '更新028构建失败原因' || true
            git push origin HEAD:agent/work028-jintang-nine
            exit "$status"
          fi
      - name: Validate and preserve result
        if: steps.guard.outputs.run_build == 'true'
        shell: bash
        run: |
          set +e
          {
            python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('data/work028_raw_text.txt').read_text(encoding='utf-8')
          full=Path('data/work028_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work028_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work028_coordinate_report.json').read_text(encoding='utf-8'))
          checks={
            'digital_pages': report['digital_pages']==91,
            'square_counts': report['base_text_square_count']==raw.count('□')==report['model_square_count']==report['candidate_count'],
            'remaining_zero': report['remaining_square_count']==0,
            'case_count': report['case_count']==len(cases)>0,
            'located': report['located_case_count']==len(cases) and report['unlocated_case_count']==0,
            'unresolved_zero': report['unresolved_case_count']==0,
            'column_four': report['column_four']['case_count']==len(cases),
            'full_square_free': '□' not in full,
            'cases_square_free': all('□' not in x['corrected'] and '□' not in x['current_context'] for x in cases),
            'no_question_candidates': all(x.get('candidate') and '疑' not in x['candidate'] for x in cases),
            'analysis': all(len(x.get('analysis',[]))>=3 for x in cases),
            'locations': all(x.get('locations') and x['locations'][0].get('bbox') for x in cases),
            'coordinate_files': len(list(Path('data/glyph_boxes/iiif/028').glob('page_*.json')))==91,
          }
          print(json.dumps({'checks':checks,'report':report,'bad_candidates':[{'id':x['id'],'section':x.get('section'),'candidate':x.get('candidate'),'original':x.get('original')} for x in cases if not x.get('candidate') or '疑' in x.get('candidate','')][:50]},ensure_ascii=False,indent=2))
          assert all(checks.values()), [k for k,v in checks.items() if not v]
          PY
            node --check js/work-028.js
            node --check js/work-028-coordinate-adapter.js
            node --check js/damage_ai_reading.js
            node --check js/detail_info_patch.js
            grep -q 'js/work-028-coordinate-adapter.js?v=20260725_jintang_nine_v1' js/damage_ai_reading.js
            grep -q 'js/work-028.js?v=20260725_jintang_nine_v1' js/damage_ai_reading.js
            grep -q '"028":"晋唐小楷九种"' js/detail_info_patch.js
            grep -q '20260725_jintang_nine_v1' detail.html
            grep -q 'getBoundingClientRect' js/work-028.js
          } > /tmp/work028-validation.log 2>&1
          status=$?
          cat /tmp/work028-validation.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/work028-validation.log data/work028_validation_error.log
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/beitie_catalog.json data/beitie_header_info.json data/page_images_index.json
          git add data/work028_full_text.txt data/work028_damage_cases.json data/work028_coordinate_report.json
          git add data/glyph_boxes/iiif/028 js/work-028.js js/work-028-coordinate-adapter.js
          git add js/damage_ai_reading.js js/detail_info_patch.js detail.html
          if [ "$status" -ne 0 ]; then git add data/work028_validation_error.log; fi
          git commit -m '暂存028生成结果与校验报告'
          git push origin HEAD:agent/work028-jintang-nine
          exit "$status"
