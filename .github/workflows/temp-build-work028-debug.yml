name: Temporary debug work028 build
on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - scripts/build_work028.py
      - data/work028_raw_text.txt
      - .work028-build-trigger
jobs:
  debug:
    if: github.head_ref == 'agent/work028-jintang-nine'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work028-jintang-nine
          fetch-depth: 0
      - run: python -m pip install beautifulsoup4
      - name: Run build and preserve error
        shell: bash
        run: |
          set +e
          python scripts/build_work028.py > /tmp/work028-build.log 2>&1
          status=$?
          cat /tmp/work028-build.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/work028-build.log data/work028_build_error.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add data/work028_build_error.log
            git commit -m '记录028构建失败原因'
            git push origin HEAD:agent/work028-jintang-nine
            exit "$status"
          fi
