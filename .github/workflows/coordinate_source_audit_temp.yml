name: Coordinate source audit temp

on:
  push:
    branches:
      - agent/fix-column1-coordinate-source-policy
  pull_request:
    branches:
      - main

jobs:
  audit:
    if: github.head_ref == 'agent/fix-column1-coordinate-source-policy' || github.ref == 'refs/heads/agent/fix-column1-coordinate-source-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit all possible IIIF sources for 014 and 031
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          from collections import Counter

          targets = ('014', '031')
          report = {}

          def walk(obj, out):
              if isinstance(obj, dict):
                  wid = str(obj.get('virtual_id') or obj.get('work_id') or obj.get('work_index') or '')
                  if any(wid.startswith(t) for t in targets):
                      out.append(obj)
                  for v in obj.values():
                      walk(v, out)
              elif isinstance(obj, list):
                  for v in obj:
                      walk(v, out)

          for path in sorted(Path('data').rglob('*.json')):
              try:
                  raw = path.read_text(encoding='utf-8').strip()
                  if not raw:
                      continue
                  if not any(t in raw for t in targets):
                      continue
                  data = json.loads(raw)
              except Exception:
                  continue
              found = []
              walk(data, found)
              if not found:
                  continue
              sources = Counter(str(r.get('source','')) for r in found)
              ids = Counter(str(r.get('virtual_id') or r.get('work_id') or r.get('work_index') or '') for r in found)
              report[str(path)] = {
                  'count': len(found),
                  'sources': dict(sources),
                  'ids': dict(ids),
                  'sample': found[:3],
              }

          out = Path('/tmp/coordinate-source-audit.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coordinate-source-audit
          path: /tmp/coordinate-source-audit.json
          retention-days: 1
