name: Coordinate source audit temp

on:
  push:
    branches:
      - agent/fix-column1-coordinate-source-policy
  pull_request:
    branches:
      - main

jobs:
  audit:
    if: github.head_ref == 'agent/fix-column1-coordinate-source-policy' || github.ref == 'refs/heads/agent/fix-column1-coordinate-source-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect 014 and 031 IIIF metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          out = {}
          for name in ('data/pages_iiif.json','data/works.json','data/errors.json'):
              p=Path(name)
              raw=p.read_text(encoding='utf-8') if p.exists() else ''
              out[name]={'size':len(raw),'head':raw[:20000]}
              try:
                  data=json.loads(raw) if raw.strip() else None
                  out[name]['type']=type(data).__name__
                  if isinstance(data,dict):
                      out[name]['keys']=list(data)[:50]
                      out[name]['matching']={k:v for k,v in data.items() if str(k).startswith(('014','031')) or '014_' in str(k) or '031_' in str(k)}
                  elif isinstance(data,list):
                      out[name]['matching']=[x for x in data if '014' in json.dumps(x,ensure_ascii=False) or '031' in json.dumps(x,ensure_ascii=False)][:20]
              except Exception as e:
                  out[name]['error']=repr(e)
          path=Path('/tmp/coordinate-source-audit.json')
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coordinate-source-audit
          path: /tmp/coordinate-source-audit.json
          retention-days: 1
