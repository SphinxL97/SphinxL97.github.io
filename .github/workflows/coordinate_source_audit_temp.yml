name: Apply and validate column one coordinate policy

on:
  push:
    branches:
      - agent/fix-column1-coordinate-source-policy
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-validate:
    if: github.head_ref == 'agent/fix-column1-coordinate-source-policy' || github.ref == 'refs/heads/agent/fix-column1-coordinate-source-policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-column1-coordinate-source-policy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply coordinate-source policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('detail.html')
          text=path.read_text(encoding='utf-8')
          old_decl='const RAW_WORK_ID=String(new URLSearchParams(location.search).get("id")||"001");const WORK_ID=RAW_WORK_ID.includes("-")?RAW_WORK_ID:RAW_WORK_ID.padStart(3,"0");const PARENT_WORK_ID=WORK_ID.includes("-")?WORK_ID.split("-")[0]:WORK_ID;let EFFECTIVE_WORK_ID=WORK_ID;const DATA_CANDIDATES=["data/glyph_records_model_aligned_border_refined.json","data/glyph_records_model_aligned.json","data/glyph_records_iiif.json"];'
          new_decl='const RAW_WORK_ID=String(new URLSearchParams(location.search).get("id")||"001");const WORK_ID=RAW_WORK_ID.includes("-")?RAW_WORK_ID:RAW_WORK_ID.padStart(3,"0");const PARENT_WORK_ID=WORK_ID.includes("-")?WORK_ID.split("-")[0]:WORK_ID;let EFFECTIVE_WORK_ID=WORK_ID;const IIIF_COORDINATE_PARENTS=new Set(["014","031"]);function usesIIIFCoordinatePolicy(){return IIIF_COORDINATE_PARENTS.has(PARENT_WORK_ID)}function modelShardPath(){const n=Number(PARENT_WORK_ID);if(!Number.isInteger(n)||n<1||n>45)return"";const start=Math.floor((n-1)/5)*5+1,end=Math.min(start+4,45);return`data/model_boxes/glyph_model_border_${String(start).padStart(3,"0")}_${String(end).padStart(3,"0")}.json`}function coordinateDataCandidates(){if(usesIIIFCoordinatePolicy())return[];const shard=modelShardPath();return shard?[shard]:[]}window.__COLUMN1_COORDINATE_POLICY__={workId:WORK_ID,parentId:PARENT_WORK_ID,mode:usesIIIFCoordinatePolicy()?"iiif":"model",modelShard:modelShardPath()};'
          if old_decl not in text: raise SystemExit('coordinate declaration anchor not found')
          text=text.replace(old_decl,new_decl,1)
          old_loop='for(const p of DATA_CANDIDATES){const data=await safeFetchJSON(p);'
          if old_loop not in text: raise SystemExit('coordinate loop anchor not found')
          text=text.replace(old_loop,'for(const p of coordinateDataCandidates()){const data=await safeFetchJSON(p);',1)
          old_page='const p=pages[currentPageIndex],fallbackItems=p.items||[];currentGlyphs=fallbackItems;const perPageBoxes=await loadPageGlyphBoxes(EFFECTIVE_WORK_ID,p);if(token!==loadPageToken)return;currentGlyphs=perPageBoxes.length?perPageBoxes:fallbackItems;'
          new_page='const p=pages[currentPageIndex],fallbackItems=p.items||[];currentGlyphs=fallbackItems;const useIIIF=usesIIIFCoordinatePolicy();const perPageBoxes=useIIIF?await loadPageGlyphBoxes(EFFECTIVE_WORK_ID,p):[];if(token!==loadPageToken)return;currentGlyphs=useIIIF?(perPageBoxes.length?perPageBoxes:fallbackItems):fallbackItems;window.__COLUMN1_ACTIVE_COORDINATE_SOURCE__={workId:EFFECTIVE_WORK_ID,parentId:PARENT_WORK_ID,page:p.canvas_index,mode:useIIIF?"iiif":"model",recordCount:currentGlyphs.length,sources:[...new Set(currentGlyphs.map(g=>String(g.source||"")))]};'
          if old_page not in text: raise SystemExit('loadPage anchor not found')
          text=text.replace(old_page,new_page,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser validation
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/column1-http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          checks=[('001',6,'model'),('010',10,'model'),('023',8,'model'),('039-01',3,'model'),('044',8,'model'),('014-01',8,'iiif'),('031-01',5,'iiif')]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for work_id,page_no,expected_mode in checks:
                  page=browser.new_page(viewport={'width':1440,'height':1000})
                  errors=[]
                  page.on('pageerror',lambda exc,errors=errors:errors.append(str(exc)))
                  page.goto(f'http://127.0.0.1:8000/detail.html?id={work_id}',wait_until='domcontentloaded',timeout=120000)
                  page.wait_for_function('() => document.querySelectorAll("#pageSelect option").length > 0',timeout=120000)
                  options=page.locator('#pageSelect option').evaluate_all('(els)=>els.map(e=>({value:e.value,text:e.textContent}))')
                  target=next(o for o in options if o['text'].strip().startswith(str(page_no)+' /'))
                  page.select_option('#pageSelect',target['value'])
                  page.wait_for_function('(n)=>window.__COLUMN1_ACTIVE_COORDINATE_SOURCE__?.page===n',arg=page_no,timeout=120000)
                  state=page.evaluate('window.__COLUMN1_ACTIVE_COORDINATE_SOURCE__')
                  policy=page.evaluate('window.__COLUMN1_COORDINATE_POLICY__')
                  assert state['mode']==expected_mode,(work_id,state)
                  assert policy['mode']==expected_mode,(work_id,policy)
                  if expected_mode=='model':
                      assert state['recordCount']>0,(work_id,state)
                      assert set(state['sources'])=={'model_border_refined'},(work_id,state)
                      assert page.locator('#imageWrap .glyph-box').count()>0
                  for section in ('reader','calligraphy','people','places'):
                      assert page.locator('#'+section).count()==1,(work_id,section)
                  assert '图片无法打开' not in page.locator('body').inner_text()
                  assert not errors,(work_id,errors)
                  page.close()
              browser.close()
          PY
      - name: Commit formal change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html
          git commit -m "统一栏目一坐标来源规则 [skip ci]"
          git push origin HEAD:agent/fix-column1-coordinate-source-policy
