name: Final validate local column-one policy

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  validate-and-finalize:
    if: github.head_ref == 'agent/fix-column-one-coordinate-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-column-one-coordinate-policy
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh v5 cache and static checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('detail.html'): (
                  'js/detail_info_patch.js?v=20260727_column_one_policy_v4',
                  'js/detail_info_patch.js?v=20260727_column_one_policy_v5',
              ),
              Path('js/detail_info_patch.js'): (
                  'js/detail_info_patch_core.js?v=20260727_column_one_policy_v4',
                  'js/detail_info_patch_core.js?v=20260727_column_one_policy_v5',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: cache anchor count={text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check js/detail_info_patch.js
          node --check js/detail_info_patch_core.js
          node --check js/detail_info_patch_core_legacy.js
          grep -F 'js/detail_info_patch.js?v=20260727_column_one_policy_v5' detail.html
          grep -F 'js/detail_info_patch_core.js?v=20260727_column_one_policy_v5' js/detail_info_patch.js
          grep -F 'js/detail_info_patch_core_legacy.js?v=20260727_column_one_policy_v5' js/detail_info_patch_core.js

      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Browser validation
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/final-column-one-http.log 2>&1 &
          python - <<'PY' > /tmp/final-column-one-browser.txt 2>&1
          from playwright.sync_api import sync_playwright

          cases = [
              ('001','model'),('002','model'),('003','model'),
              ('014-01','iiif'),('031-01','iiif'),
              ('032','model'),('044','model')
          ]

          def kind(source):
              source = str(source or '').lower()
              if 'iiif' in source or 'annotation_target_xywh' in source: return 'iiif'
              if 'model' in source or 'border_refined' in source or 'deep' in source: return 'model'
              return 'other'

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width":1500,"height":1000})
              errors=[]
              page.on('pageerror',lambda exc: errors.append(str(exc)))
              for work, expected in cases:
                  errors.clear()
                  page.goto(f'http://127.0.0.1:8000/detail.html?id={work}',wait_until='domcontentloaded',timeout=120000)
                  page.wait_for_function('() => Boolean(window.__COLUMN_ONE_COORDINATE_POLICY__)',timeout=120000)
                  policy=page.evaluate('window.__COLUMN_ONE_COORDINATE_POLICY__')
                  assert policy['policy']==expected,(work,policy)
                  assert policy['version']=='20260727_column_one_policy_v5',(work,policy)
                  page.wait_for_function("() => document.querySelectorAll('#pageSelect option').length > 0",timeout=120000)
                  found=None
                  for index in range(page.locator('#pageSelect option').count()):
                      page.select_option('#pageSelect',str(index))
                      page.wait_for_timeout(180)
                      state=page.evaluate('''() => {
                        const rows=typeof currentGlyphs!=='undefined'&&Array.isArray(currentGlyphs)?currentGlyphs:[];
                        const boxed=rows.filter(row=>!row.no_box&&(row.w||row.bbox_w||(Array.isArray(row.bbox)&&row.bbox[2])));
                        return {count:boxed.length,sources:[...new Set(boxed.map(row=>String(row.source||'unknown')))]};
                      }''')
                      if state['count']>0:
                          found=state
                          break
                  assert found,(work,'no boxes')
                  assert {kind(source) for source in found['sources']}=={expected},(work,found)
                  assert page.locator('#imageWrap .glyph-box').count()>0,(work,found)
                  page.wait_for_selector('#calligraphy',timeout=30000)
                  page.wait_for_selector('#people',timeout=30000)
                  page.wait_for_selector('#places',timeout=30000)
                  page.wait_for_timeout(1200)
                  text='\n'.join(page.locator('#calligraphy,#people,#places').all_inner_texts())
                  assert '专属内容加载失败' not in text,(work,text[:500])
                  assert '页面无法打开' not in text,(work,text[:500])
                  assert not errors,(work,errors)
                  print(work,expected,found)
              browser.close()
          PY
          cat /tmp/final-column-one-browser.txt

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-column-one-diagnostics
          path: |
            /tmp/final-column-one-browser.txt
            /tmp/final-column-one-http.log
          retention-days: 2

      - name: Commit final validated files
        shell: bash
        run: |
          rm -f .github/workflows/final_validate_column_one_local.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完成栏目一坐标策略最终验收 [skip ci]"
          git push origin HEAD:agent/fix-column-one-coordinate-policy
