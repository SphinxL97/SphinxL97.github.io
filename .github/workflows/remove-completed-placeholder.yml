name: Clean completed-work placeholder text

on:
  push:
    paths:
      - ".github/workflows/remove-completed-placeholder.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove placeholder wording from completed works
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          completed_ids = {"002", "003", "004"}

          catalog_path = Path("data/beitie_catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          for item in catalog:
              work_id = str(item.get("id", "")).zfill(3)
              if work_id not in completed_ids:
                  continue
              subtitle = str(item.get("subtitle", ""))
              subtitle = subtitle.replace("说明文字暂以《道因法师碑》模板占位。", "").strip()
              item["subtitle"] = subtitle
          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          details_path = Path("data/beitie_details.json")
          details = json.loads(details_path.read_text(encoding="utf-8"))
          for work_id in completed_ids:
              item = details.get(work_id)
              if not isinstance(item, dict):
                  continue
              summary = str(item.get("summary", ""))
              summary = summary.replace(
                  "；说明文字暂以《道因法师碑》信息作占位，后续可逐件替换。",
                  "。",
              )
              summary = summary.replace(
                  "说明文字暂以《道因法师碑》模板占位。",
                  "",
              ).strip()
              item["summary"] = summary
          details_path.write_text(
              json.dumps(details, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit cleaned text
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beitie_catalog.json data/beitie_details.json
          if git diff --cached --quiet; then
            echo "No placeholder text needed removal."
            exit 0
          fi
          git commit -m "删除已完成碑帖的模板占位说明"
          git push
