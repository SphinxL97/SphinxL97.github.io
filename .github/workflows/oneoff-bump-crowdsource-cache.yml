name: One-off refresh crowdsource assets

on:
  push:
    branches: [main]
    paths:
      - '.github/crowdsource-cache-trigger'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            detail.html
          sparse-checkout-cone-mode: false

      - name: Bump crowdsource asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('detail.html')
          text=path.read_text(encoding='utf-8')
          replacements={
            'assets/css/crowdsource.css?v=20260713':'assets/css/crowdsource.css?v=20260713_fix2',
            'assets/js/form-config.js?v=20260713':'assets/js/form-config.js?v=20260713_fix2',
            'assets/js/crowdsource.js?v=20260713':'assets/js/crowdsource.js?v=20260713_fix2',
          }
          for old,new in replacements.items():
              text=text.replace(old,new)
          path.write_text(text,encoding='utf-8')
          PY

      - name: Commit refreshed asset references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html
          if git diff --cached --quiet; then
            echo "No cache reference change needed."
          else
            git commit -m "Refresh crowdsource asset cache references"
            git push origin HEAD:main
          fi
