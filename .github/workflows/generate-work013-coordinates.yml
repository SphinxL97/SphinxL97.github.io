name: Generate work013 coordinates

on:
  push:
    branches:
      - agent/add-work013-lujun

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-work013-lujun
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/model_boxes/glyph_model_border_011_015.json
            data/work013_full_text.txt
            data/work013_damage_cases.json
            data/work013_coordinate_report.json
            data/glyph_boxes/iiif/013
            data/beitie_header_info.json
            detail.html
      - name: Generate pages and static case locations
        run: |
          python - <<'PY'
          import json, re, difflib, math, traceback
          from pathlib import Path

          MODEL=Path('data/model_boxes/glyph_model_border_011_015.json')
          TEXT=Path('data/work013_full_text.txt')
          CASES=Path('data/work013_damage_cases.json')
          REPORT=Path('data/work013_coordinate_report.json')
          OUT=Path('data/glyph_boxes/iiif/013')
          HEADER=Path('data/beitie_header_info.json')
          DETAIL=Path('detail.html')
          PAGE_COUNT=75
          OUT.mkdir(parents=True,exist_ok=True)

          variants={
            '扵':'於','於':'於','亐':'于','于':'于','㠯':'以','以':'以','朙':'明','明':'明',
            '亰':'京','京':'京','顔':'颜','顏':'颜','颜':'颜','羣':'群','群':'群',
            '黄':'黄','黃':'黄','勃':'渤','渤':'渤','矦':'侯','侯':'侯',
            '緄':'绲','绲':'绲','謚':'谥','諡':'谥','谥':'谥','龢':'和','和':'和'
          }
          ignored=set(' \t\r\n\u3000，。；：、！？,.!?;:“”‘’\'"（）()《》〈〉【】〔〕［］—–…·')
          def canon(ch):
            if not ch or ch in ignored:return ''
            return variants.get(ch,ch)
          def normalize_text(value):
            return ''.join(canon(ch) for ch in str(value) if canon(ch))
          def rect(row):
            bbox=row.get('bbox') or []
            return {
              'x':float(row.get('x',row.get('bbox_x',bbox[0] if len(bbox)>0 else 0)) or 0),
              'y':float(row.get('y',row.get('bbox_y',bbox[1] if len(bbox)>1 else 0)) or 0),
              'w':float(row.get('w',row.get('bbox_w',bbox[2] if len(bbox)>2 else 0)) or 0),
              'h':float(row.get('h',row.get('bbox_h',bbox[3] if len(bbox)>3 else 0)) or 0),
            }
          def unwrap_rows(data):
            if isinstance(data,list):return data
            if isinstance(data,dict):
              for key in ('rows','items','data','glyphs','annotations'):
                if isinstance(data.get(key),list):return data[key]
            return []
          def plain_corrected(value):
            return str(value).replace('〔','').replace('〕','')

          report={'work_id':'013','page_count':PAGE_COUNT,'status':'started'}
          try:
            raw=unwrap_rows(json.loads(MODEL.read_text('utf-8')))
            selected=[]
            for source_index,row in enumerate(raw):
              wid=str(row.get('work_id','')).split('-')[0].zfill(3)
              if wid!='013':continue
              page=int(row.get('canvas_index',row.get('page',0)) or 0)
              box=rect(row)
              if not page or box['w']<=0 or box['h']<=0:continue
              item=dict(row)
              text=str(row.get('char',row.get('text','')))[:1]
              order=int(row.get('order_in_page',row.get('annotation_index',source_index+1)) or source_index+1)
              item.update({
                'work_id':'013','canvas_index':page,
                'glyph_id':str(row.get('glyph_id') or f'013_{page}_{order}'),
                'char':text,'text':text,'order_in_page':order,
                'bbox_x':box['x'],'bbox_y':box['y'],'bbox_w':box['w'],'bbox_h':box['h'],
                'bbox':[box['x'],box['y'],box['w'],box['h']]
              })
              selected.append(item)
            selected.sort(key=lambda r:(int(r['canvas_index']),int(r['order_in_page'])))
            groups={page:[] for page in range(1,PAGE_COUNT+1)}
            for row in selected:
              page=int(row['canvas_index'])
              if 1<=page<=PAGE_COUNT:groups[page].append(row)

            text=TEXT.read_text('utf-8')
            cases=json.loads(CASES.read_text('utf-8'))
            filled=text
            for case in cases:
              original=case['original']
              corrected=plain_corrected(case['corrected'])
              if original in filled:
                filled=filled.replace(original,corrected,1)

            expected=[]
            raw_to_expected={}
            for pos,ch in enumerate(filled):
              key=canon(ch)
              if key:
                raw_to_expected[pos]=len(expected)
                expected.append(key)

            stream=[]
            model_chars=[]
            for row in selected:
              key=canon(row.get('char') or row.get('text') or '')
              if not key:continue
              stream.append(row)
              model_chars.append(key)

            matcher=difflib.SequenceMatcher(None,expected,model_chars,autojunk=False)
            blocks=matcher.get_matching_blocks()
            exact_map={}
            useful_blocks=[]
            for block in blocks:
              if block.size>=3:useful_blocks.append({'a':block.a,'b':block.b,'size':block.size})
              for offset in range(block.size):exact_map[block.a+offset]=block.b+offset

            matched_pages=[]
            for block in blocks:
              if block.size<4:continue
              for idx in (block.b,block.b+block.size-1):
                if 0<=idx<len(stream):matched_pages.append(int(stream[idx]['canvas_index']))
            body_start=min(matched_pages) if matched_pages else 1
            body_end=max(matched_pages) if matched_pages else PAGE_COUNT

            def expected_index_for_case(case):
              original=case['original']
              start=text.find(original)
              if start<0:return None
              raw_target=start+original.find('□')
              return sum(1 for pos,ch in enumerate(filled[:raw_target]) if canon(ch))

            def nearest_estimate(eidx):
              left=[(a,b) for a,b in exact_map.items() if a<eidx]
              right=[(a,b) for a,b in exact_map.items() if a>eidx]
              if left and right:
                la,lb=max(left);ra,rb=min(right)
                if ra!=la:return int(round(lb+(eidx-la)*(rb-lb)/(ra-la)))
              if left:
                la,lb=max(left);return lb+(eidx-la)
              if right:
                ra,rb=min(right);return rb-(ra-eidx)
              return len(model_chars)//2

            def score_candidate(eidx,midx,previous):
              if midx<=previous:return -999
              L=14;R=14
              exp_left=''.join(expected[max(0,eidx-L):eidx])
              exp_right=''.join(expected[eidx+1:min(len(expected),eidx+1+R)])
              mod_left=''.join(model_chars[max(0,midx-len(exp_left)):midx])
              mod_right=''.join(model_chars[midx+1:midx+1+len(exp_right)])
              left_ratio=difflib.SequenceMatcher(None,exp_left,mod_left,autojunk=False).ratio() if exp_left else 0
              right_ratio=difflib.SequenceMatcher(None,exp_right,mod_right,autojunk=False).ratio() if exp_right else 0
              target=model_chars[midx]
              char_bonus=0.55 if target==expected[eidx] else (0.35 if target=='□' else 0)
              neighbor=0
              for off in (-2,-1,1,2):
                if 0<=eidx+off<len(expected) and 0<=midx+off<len(model_chars) and expected[eidx+off]==model_chars[midx+off]:neighbor+=0.09
              page=int(stream[midx]['canvas_index'])
              body_bonus=0.15 if body_start<=page<=body_end else -0.3
              return left_ratio+right_ratio+char_bonus+neighbor+body_bonus

            previous=-1
            located=0
            case_audit=[]
            for case in cases:
              eidx=expected_index_for_case(case)
              candidates=[]
              if eidx is not None and 0<=eidx<len(expected):
                if eidx in exact_map and exact_map[eidx]>previous:
                  candidates.append((9.0,exact_map[eidx],'sequence-exact'))
                estimate=nearest_estimate(eidx)
                lo=max(previous+1,estimate-180,0);hi=min(len(model_chars),estimate+181)
                for midx in range(lo,hi):
                  candidates.append((score_candidate(eidx,midx,previous),midx,'context-alignment'))
                if not candidates:
                  for midx in range(previous+1,len(model_chars)):
                    candidates.append((score_candidate(eidx,midx,previous),midx,'global-context'))
              candidates.sort(key=lambda x:x[0],reverse=True)
              best=candidates[0] if candidates else None
              second=candidates[1] if len(candidates)>1 else None
              accepted=False
              if best:
                margin=best[0]-(second[0] if second else -9)
                accepted=best[0]>=1.28 and margin>=0.08
                if best[2]=='sequence-exact':accepted=True
              audit={'id':case['id'],'expected_index':eidx,'accepted':accepted,'top_candidates':[]}
              for score,midx,method in candidates[:3]:
                row=stream[midx]
                audit['top_candidates'].append({
                  'score':round(score,4),'method':method,'page':int(row['canvas_index']),
                  'order_in_page':int(row['order_in_page']),'char':row.get('char',''),'glyph_id':row.get('glyph_id','')
                })
              if accepted:
                score,midx,method=best
                row=stream[midx];box=rect(row);page=int(row['canvas_index'])
                location={
                  'page':page,'glyph_id':str(row.get('glyph_id','')),
                  'canvas':{'w':int(row.get('canvas_width',2943) or 2943),'h':int(row.get('canvas_height',4429) or 4429)},
                  'bbox':{'x':box['x'],'y':box['y'],'w':box['w'],'h':box['h']},
                  'match_method':method,'alignment_score':round(score,4),'bbox_source':'existing-model-row'
                }
                case['locations']=[location];case['page']=page
                case['n']=case.get('category','残损碑文恢复');case['t']=case['title'];case['o']=case['original'];case['c']=case['corrected']
                previous=midx;located+=1
                audit['location']=location
              else:
                case['locations']=[];case['page']='—'
              case_audit.append(audit)

            # Refine body range from accepted locations plus substantial sequence matches.
            accepted_pages=[a.get('location',{}).get('page') for a in case_audit if a.get('accepted')]
            accepted_pages=[p for p in accepted_pages if p]
            if accepted_pages:
              body_start=min(body_start,min(accepted_pages));body_end=max(body_end,max(accepted_pages))

            # Keep current-page coordinates only on the aligned碑阳 range; all other pages remain image-only.
            image_only=[];coordinate_pages=[]
            for page in range(1,PAGE_COUNT+1):
              rows=groups.get(page,[]) if body_start<=page<=body_end else []
              if rows:coordinate_pages.append(page)
              else:image_only.append(page)
              (OUT/f'page_{page:04d}.json').write_text(json.dumps(rows,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

            CASES.write_text(json.dumps(cases,ensure_ascii=False,indent=2),encoding='utf-8')

            # Normalize page title while preserving the complete first title in basic metadata.
            header=json.loads(HEADER.read_text('utf-8'))
            if '013' in header:
              header['013']['title']='鲁峻碑'
              header['013'].setdefault('basic',{})['首题']='鲁峻碑 汉故司隶校尉鲁君碑'
              HEADER.write_text(json.dumps(header,ensure_ascii=False,indent=2),encoding='utf-8')

            # Bust the two top-level script caches so mobile browsers must load the 013 route.
            detail=DETAIL.read_text('utf-8')
            detail=re.sub(r'js/detail_info_patch\.js\?v=[^"\']+','js/detail_info_patch.js?v=20260723_lujun_v1',detail,count=1)
            detail=re.sub(r'js/damage_ai_reading\.js\?v=[^"\']+','js/damage_ai_reading.js?v=20260723_lujun_v1',detail,count=1)
            DETAIL.write_text(detail,encoding='utf-8')

            report.update({
              'status':'completed','model_rows':len(selected),'model_stream_chars':len(model_chars),
              'expected_chars':len(expected),'sequence_ratio':round(matcher.ratio(),4),
              'body_page_range':[body_start,body_end],
              'coordinate_pages':coordinate_pages,'image_only_pages':image_only,
              'case_count':len(cases),'located_cases':located,
              'unlocated_cases':[a['id'] for a in case_audit if not a['accepted']],
              'matching_blocks':useful_blocks[:80],'cases':case_audit
            })
          except Exception as error:
            report.update({'status':'error','error':repr(error),'traceback':traceback.format_exc()})
          REPORT.parent.mkdir(parents=True,exist_ok=True)
          REPORT.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({k:report.get(k) for k in ('status','model_rows','body_page_range','case_count','located_cases','unlocated_cases','error')},ensure_ascii=False,indent=2))
          PY
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse data/work013_damage_cases.json data/work013_coordinate_report.json data/glyph_boxes/iiif/013 data/beitie_header_info.json detail.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "生成013鲁峻碑逐页坐标与静态案例位置"
          git push origin HEAD:agent/add-work013-lujun
