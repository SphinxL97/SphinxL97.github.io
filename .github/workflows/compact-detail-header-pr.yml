name: Apply compact detail header

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/compact-global-detail-header'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/compact-global-detail-header
          fetch-depth: 1

      - name: Apply shared header migration
        run: python scripts/compact_detail_header.py

      - name: Validate detail-only scope and syntax
        run: |
          node --check js/detail_info_patch.js
          node --check js/detail_info_patch_core.js
          python - <<'PY'
          from pathlib import Path
          entry=Path('js/detail_info_patch.js').read_text(encoding='utf-8')
          core=Path('js/detail_info_patch_core.js').read_text(encoding='utf-8')
          html=Path('detail.html').read_text(encoding='utf-8')
          assert '__DETAIL_INFO_STABLE_ENTRY_V15__' in entry
          assert '20260724_compact_header_v1' in entry and '20260724_compact_header_v1' in html
          assert 'height:430px!important' in core
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))!important' in core
          assert 'align-items:stretch!important' not in core
          assert 'item.value.length>38' not in entry
          changed=set(line.strip() for line in __import__('subprocess').check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed == {'detail.html','js/detail_info_patch.js','js/detail_info_patch_core.js'}, changed
          print('compact detail header validation ok')
          PY

      - name: Commit final shared files and remove temporary files
        run: |
          rm -f \
            .github/workflows/compact-detail-header.yml \
            .github/workflows/compact-detail-header-pr.yml \
            .compact-detail-header-trigger \
            scripts/compact_detail_header.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Compact all detail information headers"
          git push origin HEAD:agent/compact-global-detail-header
