name: Finalize Work043 caption cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/work043-caption-cleanup-v5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work043-caption-cleanup-v5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove old sentence and refresh caches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_route = '20260726_mengjingxun_043_v3_manual_red_box'
          old_module = '20260726_mengjingxun_043_v4_svg_crop'
          new = '20260726_mengjingxun_043_v5_caption_cleanup'
          forbidden = [
              '该框经逐页人工核验校准，不是模型自动bbox。',
              '该框经逐页人工核验校准，不是模型自动 bbox。',
              '人工核验校准框',
              '不是模型自动bbox',
              '不是模型自动 bbox',
          ]

          replacements = {
              Path('js/work-043.js'): [(old_module, new)],
              Path('data/work043_coordinate_report.json'): [(old_module, new)],
              Path('js/damage_ai_reading.js'): [
                  (old_route, new),
                  ('if(window.__DAMAGE_AI_READING_ROUTER_V83__)return;\n  window.__DAMAGE_AI_READING_ROUTER_V83__=true;',
                   'if(window.__DAMAGE_AI_READING_ROUTER_V84__)return;\n  window.__DAMAGE_AI_READING_ROUTER_V84__=true;\n  window.__DAMAGE_AI_READING_ROUTER_V83__=true;'),
              ],
              Path('js/detail_info_patch.js'): [
                  (old_route, new),
                  ('if(window.__DETAIL_INFO_STABLE_ENTRY_V43__)return;\n  window.__DETAIL_INFO_STABLE_ENTRY_V43__=true;',
                   'if(window.__DETAIL_INFO_STABLE_ENTRY_V44__)return;\n  window.__DETAIL_INFO_STABLE_ENTRY_V44__=true;\n  window.__DETAIL_INFO_STABLE_ENTRY_V43__=true;'),
              ],
              Path('detail.html'): [(old_route, new)],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, replacement in pairs:
                  if old not in text:
                      raise SystemExit(f'missing replacement anchor in {path}: {old}')
                  text = text.replace(old, replacement)
              for phrase in forbidden:
                  text = text.replace(phrase, '')
              path.write_text(text, encoding='utf-8')

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.js','.json','.html','.txt','.css','.md'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for phrase in forbidden:
                  updated = updated.replace(phrase, '')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          checks = {
              'js/work-043.js': new,
              'js/damage_ai_reading.js': f'js/work-043.js?v={new}',
              'js/detail_info_patch.js': f'const recoveryVersion="{new}"',
              'detail.html': f'js/detail_info_patch.js?v={new}',
          }
          for name, needle in checks.items():
              text = Path(name).read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'cache check failed: {name} lacks {needle}')

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in {'.js','.json','.html','.txt','.css','.md'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for phrase in forbidden:
                  if phrase in text:
                      raise SystemExit(f'forbidden phrase remains in {path}: {phrase}')

          for workflow in [
              Path('.github/workflows/work043_caption_cleanup.yml'),
              Path('.github/workflows/work043_caption_cleanup_pr.yml'),
          ]:
              if workflow.exists():
                  workflow.unlink()
          trigger = Path('_tmp_work043_caption_trigger.txt')
          if trigger.exists():
              trigger.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "删除043栏目三旧说明并刷新缓存 [skip ci]"
          git push origin HEAD:agent/work043-caption-cleanup-v5
