name: Commit work016 audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: work016-audit
  cancel-in-progress: true

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-work016-zunhao-shanrang
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/generate-work016-coordinates.yml
            data/model_boxes/glyph_model_border_016_020.json
            data/work016_full_text.txt
            data/work016_damage_cases.json
            data/work016_coordinate_report.json
            data/glyph_boxes/iiif/016
            data/beitie_catalog.json
            data/beitie_header_info.json
            data/page_images_index.json
            js/work-015.js
            js/work-015-coordinate-adapter.js
            js/work-016.js
            js/work-016-coordinate-adapter.js
            js/damage_ai_reading.js
            js/detail_info_patch.js
            detail.html
      - name: Extract and run the audited generator
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/generate-work016-coordinates.yml').read_text(encoding='utf-8').splitlines()
          start=source.index("          python - <<'PY'")+1
          end=next(i for i in range(start,len(source)) if source[i]=='          PY')
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end])+'\n'
          Path('/tmp/generate_work016.py').write_text(script,encoding='utf-8')
          PY
          python /tmp/generate_work016.py
      - name: Commit every generated file that exists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -A data js detail.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "生成016合册逐页坐标与专属栏目"
          git pull --rebase origin agent/add-work016-zunhao-shanrang
          git push origin HEAD:agent/add-work016-zunhao-shanrang
