name: One-off update section headings

on:
  push:
    branches: [main]
    paths:
      - '.github/section-headings-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update only displayed section headings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('js/detail_info_patch.js')
          text = path.read_text(encoding='utf-8')
          marker = '/* 全部碑帖页面统一栏目标题；仅改标题文字，不改栏目内容。 */'

          if marker not in text:
              appendix = "\n".join([
                  '',
                  '',
                  marker,
                  '(function(){',
                  '  const headingMap={',
                  '    reader:"一、碑帖浏览",',
                  '    calligraphy:"二、碑文释文",',
                  '    people:"三、残缺字迹展示",',
                  '    places:"四、众智释读",',
                  '    sources:"五、书法艺术赏析"',
                  '  };',
                  '',
                  '  function applySectionHeadings(){',
                  '    Object.entries(headingMap).forEach(([id,title])=>{',
                  '      const heading=document.querySelector(`#${id} > .section-title`);',
                  '      if(heading) heading.textContent=title;',
                  '    });',
                  '  }',
                  '',
                  '  if(document.readyState==="loading"){',
                  '    document.addEventListener("DOMContentLoaded",applySectionHeadings);',
                  '  }else{',
                  '    applySectionHeadings();',
                  '  }',
                  '})();',
                  '',
              ])
              text += appendix

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit only the requested heading changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/detail_info_patch.js
          git commit -m "Update section headings to match directory labels"
          git push origin HEAD:main
