name: work029-finalize-v3

on:
  push:
    branches:
      - agent/work029-xianyu-guangzu
    paths:
      - .github/workflows/work029-finalize-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work029-xianyu-guangzu
          fetch-depth: 0
      - name: Fix cross-page anchor build validate and clean
        shell: bash
        run: |
          mkdir -p tmp
          python - <<'PY'
          from pathlib import Path
          path=Path('tmp/work029_finalize_v2.py')
          text=path.read_text(encoding='utf-8')
          old="    '016': (27, '手□鯨', 1, ''),"
          new="    '016': (27, '□鯨', 0, '“手”在第26页末，问题槽位“□”位于第27页首；本案例只框选第27页真实残损槽位。'),"
          assert old in text
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          set +e
          python tmp/work029_finalize_v2.py > tmp/work029_finalize_v3.log 2>&1
          status=$?
          for file in js/work-029.js js/work-029-coordinate-adapter.js js/damage_ai_reading.js js/detail_info_patch.js; do
            if [ "$status" -eq 0 ]; then
              node --check "$file" >> tmp/work029_finalize_v3.log 2>&1
              status=$?
            fi
          done
          if [ "$status" -eq 0 ]; then
            python - <<'PY' >> tmp/work029_finalize_v3.log 2>&1
          import json
          from pathlib import Path
          for path in ['data/work029_damage_cases.json','data/work029_coordinate_report.json','data/beitie_catalog.json','data/beitie_header_info.json','data/beitie_details.json','data/beitie_info_texts.json']:
              json.loads(Path(path).read_text(encoding='utf-8'))
          cases=json.loads(Path('data/work029_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work029_coordinate_report.json').read_text(encoding='utf-8'))
          assert len(cases)==16
          assert all('□' not in item['corrected'] for item in cases)
          assert sum(bool(item['locations']) for item in cases)==12
          assert report['raw_box_total']==20
          assert report['candidate_total']==16
          assert report['retained_box_in_column3']==0
          assert report['total_glyph_boxes']==1769
          assert len(list(Path('data/glyph_boxes/iiif/029').glob('page_*.json')))==24
          assert '"029":[' in Path('js/damage_ai_reading.js').read_text(encoding='utf-8')
          assert '"029":"鲜于光祖墓志"' in Path('js/detail_info_patch.js').read_text(encoding='utf-8')
          print('work029 all static checks passed')
          PY
            status=$?
          fi
          printf '\nexit_status=%s\n' "$status" >> tmp/work029_finalize_v3.log
          set -e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "$status" -eq 0 ]; then
            rm -f .github/workflows/work029-coordinate-audit.yml
            rm -f .github/workflows/work029-finalizer-debug.yml
            rm -f .github/workflows/work029-patch-finalizer.yml
            rm -f .github/workflows/work029-selftest.yml
            rm -f .github/workflows/work029-finalize-v2.yml
            rm -f .github/workflows/work029-finalize-v3.yml
            rm -f tmp/work029_coordinate_trigger.txt
            rm -f tmp/work029_model_inspect.json tmp/work029_model_summary.json
            rm -f tmp/work029_selftest_passed.txt tmp/work029_finalizer_error.log tmp/work029_patch_log.txt
            rm -f tmp/work029_finalize_v2.py tmp/work029_finalize_v2.log tmp/work029_finalize_v3.log
            rmdir tmp 2>/dev/null || true
            git add -A
            git commit -m "完成029鲜于光祖墓志专属内容"
            git push origin HEAD:agent/work029-xianyu-guangzu
          else
            git add tmp/work029_finalize_v2.py tmp/work029_finalize_v3.log
            git commit -m "temp: record work029 finalize v3 error" || true
            git push origin HEAD:agent/work029-xianyu-guangzu
          fi
