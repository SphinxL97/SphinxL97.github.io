name: Finalize work025

on:
  push:
    branches:
      - agent/work025-shengjiaoxu
    paths:
      - .github/work025-final-trigger.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work025-shengjiaoxu
          fetch-depth: 0

      - name: Fix route guards
        run: python3 scripts/finalize_work025.py

      - name: Validate work025
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cases=json.loads(Path('data/work025_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work025_coordinate_report.json').read_text(encoding='utf-8'))
          damage=Path('js/damage_ai_reading.js').read_text(encoding='utf-8')
          detail=Path('js/detail_info_patch.js').read_text(encoding='utf-8')
          assert len(cases)==1
          assert cases[0]['locations'][0]['glyph_id'].endswith('_p0023_c007')
          assert cases[0]['locations'][0]['target_char_in_model']=='□'
          assert report['located_case_count']==1
          assert report['case_locations'][0]['locations'][0]['glyph_id'].endswith('_p0023_c007')
          assert 'window.__DAMAGE_AI_READING_ROUTER_V64__=true;' in damage
          assert 'window.__DETAIL_INFO_STABLE_ENTRY_V23__=true;' in detail
          assert len(list(Path('data/glyph_boxes/iiif/025').glob('page_*.json')))==47
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          node --check js/work-025.js
          node --check js/work-025-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js

      - name: Remove one-off files
        run: |
          rm -f scripts/finalize_work025.py
          rm -f .github/work025-final-trigger.txt
          rm -f .github/workflows/finalize-work025.yml

      - name: Commit final validated work025 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize validated work025 routes and case bbox"
          git push origin HEAD:agent/work025-shengjiaoxu
