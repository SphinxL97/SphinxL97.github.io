# work024 final normalization runner 2026-07-24
name: One-off build work024

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: one-off-work024
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/work024-xuanjing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/work024-xuanjing
          fetch-depth: 0

      - name: Keep column-four case type stable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('js/work-024.js')
          text=path.read_text(encoding='utf-8')
          old='function publishCases(items,forCrowd=false){window.DAMAGE_AI_CASES=items.map(item=>({...clone(item),id:item.id,n:forCrowd?"残损碑文恢复":item.category,t:item.title,o:item.original,c:item.corrected,crowdsourceCategory:item.category,category:item.category,title:item.title,original:item.original,corrected:item.corrected,analysis:[...(item.analysis||[])],locations:clone(item.locations||[]),page:item.page||"—"}));window.dispatchEvent(new CustomEvent("work-024-cases-ready",{detail:{count:items.length,forCrowd}}));}'
          new='function publishCases(items){window.DAMAGE_AI_CASES=items.map(item=>({...clone(item),id:item.id,n:"残损碑文恢复",t:item.title,o:item.original,c:item.corrected,crowdsourceCategory:item.category,category:item.category,title:item.title,original:item.original,corrected:item.corrected,analysis:[...(item.analysis||[])],locations:clone(item.locations||[]),page:item.page||"—"}));window.dispatchEvent(new CustomEvent("work-024-cases-ready",{detail:{count:items.length}}));}'
          if old not in text:
              raise RuntimeError('publishCases block not found')
          text=text.replace(old,new,1).replace('publishCases(cases,false)','publishCases(cases)').replace('publishCases(cases,true)','publishCases(cases)')
          path.write_text(text,encoding='utf-8')
          trigger=Path('.github/work024-fix-trigger.txt')
          if trigger.exists(): trigger.unlink()
          PY

      - name: Validate final work024 files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('data/work024_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work024_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work024_coordinate_report.json').read_text(encoding='utf-8'))
          script=Path('js/work-024.js').read_text(encoding='utf-8')
          assert text.count('□') == 23
          assert len(cases) == 19
          assert sum(item['square_count'] for item in cases) == 23
          assert sum(item['candidate_count'] for item in cases) == 23
          assert all('□' not in item['corrected'] for item in cases)
          assert report['located_case_count'] == 19
          assert 'n:"残损碑文恢复"' in script
          assert 'forCrowd?' not in script
          assert len(list(Path('data/glyph_boxes/iiif/024').glob('page_*.json'))) == 37
          PY
          node --check js/work-024.js
          node --check js/work-024-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js

      - name: Commit final work024 normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep work024 column-four cases synchronized"
          git push origin HEAD:agent/work024-xuanjing
