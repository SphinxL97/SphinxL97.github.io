name: Restore border-refined column one boxes

on:
  pull_request:
    branches: [main]
    paths:
      - detail.html
      - js/reader-box-alignment-patch.js
      - tools/restore_border_refined_temp.py
      - tools/test_border_refined_temp.py
      - .github/workflows/restore_border_refined_temp.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-border-refined-column1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply strict patch
        run: python tools/restore_border_refined_temp.py
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Run acceptance test
        id: acceptance
        continue-on-error: true
        run: |
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          sleep 2
          python tools/test_border_refined_temp.py > border-test-output.txt 2>&1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: border-refined-test-report
          path: |
            border-test-output.txt
            /tmp/http.log
      - name: Stop on failure
        if: steps.acceptance.outcome != 'success'
        run: |
          cat border-test-output.txt
          exit 1
      - name: Commit verified formal files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add detail.html js/reader-box-alignment-patch.js
          git diff --cached --quiet && exit 1
          git commit -m "恢复栏目一边界精修字框"
          git push origin HEAD:agent/restore-border-refined-column1
