name: Remove work034 recovery basis

on:
  push:
    branches:
      - agent/work034-remove-recovery-basis
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work034-remove-recovery-basis
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch files
        run: python scripts/remove_work034_recovery_basis.py
      - name: Validate removal and retained modules
        run: |
          python - <<'PY'
          from pathlib import Path

          work = Path('js/work-034.js').read_text(encoding='utf-8')
          router = Path('js/damage_ai_reading.js').read_text(encoding='utf-8')
          entry = Path('js/detail_info_patch.js').read_text(encoding='utf-8')
          detail = Path('detail.html').read_text(encoding='utf-8')

          assert 'const VERSION="20260726_zhangjilao_034_v2";' in work
          assert '<span class="damage-label">恢复依据</span>' not in work
          assert '>恢复后的上下文<' in work
          assert '>AI分析依据<' in work
          assert 'function removeRecoveryBasis' in work
          assert 'function observeRecoveryBasis' in work
          assert 'new MutationObserver' in work
          assert '#people[data-work034-dedicated="true"] .damage-basis-block' in work
          assert 'window.__DAMAGE_AI_READING_ROUTER_V74__=true;' in router
          assert 'js/work-034.js?v=20260726_zhangjilao_034_v2' in router
          assert 'window.__DETAIL_INFO_STABLE_ENTRY_V34__=true;' in entry
          assert '20260726_zhangjilao_034_v2_no_basis' in entry
          assert 'js/detail_info_patch.js?v=20260726_zhangjilao_034_v2' in detail
          assert 'js/damage_ai_reading.js?v=20260726_zhangjilao_034_v2' in detail
          print('034 recovery-basis cleanup audit passed')
          PY
          node --check js/work-034.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
      - name: Commit final files
        run: |
          rm -f scripts/remove_work034_recovery_basis.py .github/workflows/remove-work034-recovery-basis.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "删除034恢复依据相关内容"
          git push origin agent/work034-remove-recovery-basis
