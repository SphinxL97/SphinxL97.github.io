name: Correct work022 split glyph

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work022-wangjushi-rebuild
          fetch-depth: 1
      - name: Merge the two real boxes covering 靈
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ids=[
              '022_王居士砖塔铭_p0005_c012',
              '022_王居士砖塔铭_p0005_c013',
          ]
          boxes=[(286.0,1146.0,148.0,97.0),(286.0,1230.0,148.0,95.0)]
          x=min(b[0] for b in boxes); y=min(b[1] for b in boxes)
          x2=max(b[0]+b[2] for b in boxes); y2=max(b[1]+b[3] for b in boxes)
          bbox={'x':x,'y':y,'w':x2-x,'h':y2-y}

          cases_path=Path('data/work022_damage_cases.json')
          cases=json.loads(cases_path.read_text(encoding='utf-8'))
          case=next(x for x in cases if x['id']=='01')
          loc=case['locations'][0]
          loc.update({
              'glyph_id':ids[0],
              'source_glyph_ids':ids,
              'bbox':bbox,
              'bbox_source':'model-split-glyph-union',
              'match_method':'context-sequence-plus-split-glyph-union',
              'target_char_in_model':'□+□',
              'coordinate_note':'原拓中的“靈”被模型纵向拆为两个连续真实方框；案例截图使用两框并集覆盖完整字位。',
          })
          cases_path.write_text(json.dumps(cases,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          report_path=Path('data/work022_coordinate_report.json')
          report=json.loads(report_path.read_text(encoding='utf-8'))
          row=next(x for x in report['case_locations'] if x['id']=='01')
          row.update({
              'glyph_id':ids[0],
              'source_glyph_ids':ids,
              'bbox':bbox,
              'bbox_source':'model-split-glyph-union',
              'match_method':'context-sequence-plus-split-glyph-union',
              'target_char_in_model':'□+□',
              'coordinate_note':'原拓中的“靈”被模型纵向拆为两个连续真实方框；案例截图使用两框并集覆盖完整字位。',
          })
          report['coordinate_exceptions']=[{
              'case_id':'01',
              'page':5,
              'type':'split-glyph-union',
              'source_glyph_ids':ids,
              'union_bbox':bbox,
              'reason':'同一个“靈”字位被模型纵向切成两个连续方框，使用真实方框并集以完整覆盖字位。',
          }]
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          assert bbox=={'x':286.0,'y':1146.0,'w':148.0,'h':179.0}
          print(bbox)
          PY
      - name: Validate corrected data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cases=json.loads(Path('data/work022_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work022_coordinate_report.json').read_text(encoding='utf-8'))
          assert len(cases)==9
          assert report['located_cases']==9
          assert cases[0]['locations'][0]['bbox_source']=='model-split-glyph-union'
          assert report['coordinate_exceptions'][0]['union_bbox']['h']==179.0
          print('split glyph correction passed')
          PY
          node --check js/work-022.js
          node --check js/work-022-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
      - name: Commit correction and remove workflow
        run: |
          rm -f .github/workflows/work022-merge-split-glyph.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct work022 split glyph location"
          git push origin HEAD:agent/work022-wangjushi-rebuild
