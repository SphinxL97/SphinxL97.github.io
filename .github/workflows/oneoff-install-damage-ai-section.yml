name: One-off install damaged-text AI section

on:
  push:
    branches: [ai-damage-reading-section]
    paths:
      - '.github/damage-ai-trigger'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ai-damage-reading-section

      - name: Add shared module assets to detail page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('detail.html')
          text=path.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="css/damage_ai_reading.css?v=20260712">'
          js='<script defer src="js/damage_ai_reading.js?v=20260712"></script>'
          anchor='<script defer src="js/detail_info_patch.js?v=20260629_info"></script>'
          if css not in text or js not in text:
              replacement=anchor+'\n'+css+'\n'+js
              if anchor not in text:
                  raise RuntimeError('detail_info_patch anchor not found')
              text=text.replace(anchor,replacement,1)
              path.write_text(text,encoding='utf-8')
          PY

      - name: Commit detail page loader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html
          git commit -m "Load shared damaged-text AI reading module"
          git push origin HEAD:ai-damage-reading-section
