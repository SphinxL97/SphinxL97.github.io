name: Temporary audit work028 cases
on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .work028-audit-trigger
jobs:
  audit:
    if: github.head_ref == 'agent/work028-jintang-nine'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work028-jintang-nine
          fetch-depth: 0
      - name: Write compact case audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/work028_damage_cases.json').read_text(encoding='utf-8'))
          lines=[]
          for row in rows:
              lines.append(f"{row['id']}\t{row.get('section','')}\t{row.get('category','')}\t原：{row.get('original','')}\t候：{row.get('candidate','')}\t补：{row.get('corrected','')}")
          Path('data/work028_case_audit.txt').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          rm -f .work028-audit-trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/work028_case_audit.txt
          git add -u .work028-audit-trigger
          git commit -m '生成028逐例补字审计清单'
          git push origin HEAD:agent/work028-jintang-nine
