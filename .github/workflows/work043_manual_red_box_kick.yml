name: Build Work043 manual red box

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-validate:
    if: github.head_ref == 'agent/work043-manual-red-box'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work043-manual-red-box
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified manual red box
        run: python tools/work043_manual_red_box_build_temp.py
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser validation
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/work043-http.log 2>&1 &
          python tools/work043_manual_red_box_validate_temp.py
      - uses: actions/upload-artifact@v4
        with:
          name: work043-manual-red-box-validation
          path: /tmp/work043-manual-red-box.png
          retention-days: 1
      - name: Commit clean final changes
        shell: bash
        run: |
          rm -f .github/workflows/work043_manual_red_box*.yml
          rm -f _tmp_work043_manual_red_box*.txt _tmp_work043_push_kick.txt
          rm -f tools/work043_manual_red_box_build_temp.py tools/work043_manual_red_box_validate_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "为043问题字增加人工核验红框 [skip ci]"
          git push origin HEAD:agent/work043-manual-red-box
