name: Kick Work043 manual red box build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  kick:
    if: github.head_ref == 'agent/work043-manual-red-box'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work043-manual-red-box
          fetch-depth: 0
      - name: Trigger branch workflow once
        shell: bash
        run: |
          if [ -f _tmp_work043_push_kick.txt ]; then
            echo 'push kick already created'
            exit 0
          fi
          printf 'kick branch workflow\n' > _tmp_work043_push_kick.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tmp_work043_push_kick.txt
          git commit -m "触发043人工红框分支流程"
          git push origin HEAD:agent/work043-manual-red-box
