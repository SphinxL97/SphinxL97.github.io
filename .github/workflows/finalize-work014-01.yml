name: Finalize work014-01 branch

on:
  push:
    branches:
      - agent/work014-01-lihanjing
    paths:
      - '.github/workflows/finalize-work014-01.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work014-01-lihanjing
          fetch-depth: 0
      - name: Update top-level cache and remove one-off workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('detail.html')
          s=p.read_text('utf-8').replace('20260723_lihanjing_014_01_v1','20260723_lihanjing_014_01_v2')
          p.write_text(s,encoding='utf-8')
          PY
          git rm -f .github/workflows/generate-work014-01.yml .github/workflows/finalize-work014-01.yml
      - name: Validate and commit
        run: |
          node --check js/work-014.js
          node --check js/work-014-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail.html
          git commit -m "完成014-01缓存与临时文件清理"
          git push origin HEAD:agent/work014-01-lihanjing
