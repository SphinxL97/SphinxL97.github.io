name: Fill all work020 damage squares

on:
  push:
    branches:
      - agent/work020-fill-all-damage-squares

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work020-fill-all-damage-squares
          fetch-depth: 0

      - name: Apply reviewed full candidates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          replacements = json.loads(r'''{
  "01": {
    "title": "明珠暗投之譬",
    "corrected": "〔明〕珠暗投，欣然惊异",
    "mode": "ai_provisional",
    "confidence": "低",
    "analysis": [
      "“明珠暗投”是古代常用譬喻。此处以“明”补入原方框，同时将方框外疑似OCR误识的“睹”校作“珠”，使恢复后的句子语义完整。",
      "该恢复主要依据固定成语和上下文，原碑残损仍较重，因此标为低置信度AI暂拟。"
    ]
  },
  "02": {
    "title": "粪扫衣的山居形象",
    "corrected": "萝裳薜带，〔身〕唯粪扫之衣",
    "mode": "ai_provisional",
    "confidence": "低",
    "analysis": [
      "“粪扫衣”是佛教中以弃布缝制僧衣的固定称谓。",
      "补“身”后与下句“尝无麻麦之饭”形成衣食并举；现有录文的残缺位置不完全一致，故标为低置信度。"
    ]
  },
  "03": {
    "title": "禽兽绝其凭倚",
    "corrected": "俱绝〔凭〕倚，毕来俯伏",
    "mode": "ai_provisional",
    "confidence": "低",
    "analysis": [
      "“凭倚”可表示依靠或倚伏，补“凭”后可理解为禽兽停止原有倚伏姿态，来到禅师面前俯伏。",
      "现有录文未保存原字，且本例序列匹配分数相对较低，仍需结合拓片残笔复核。"
    ]
  },
  "04": {
    "title": "玄门之益友",
    "corrected": "为玄门之益〔友〕，以道隐之辰",
    "mode": "ai_provisional",
    "confidence": "中",
    "analysis": [
      "“益友”是固定词语，前文称信行为“命世之异人”，下文又写其劝导僧邕出山济世，称“玄门之益友”语义成立。",
      "现有录文在“益”后仍作缺字，因此作为AI候选而非文献确认。"
    ]
  },
  "05": {
    "title": "信行迁化后住持徒众",
    "corrected": "信行禅师〔迁〕〔化〕之〔后〕，〔住〕持徒众",
    "mode": "ai_provisional",
    "confidence": "高",
    "analysis": [
      "相关僧传记载信行去世后，僧邕统领徒众，并有住持之功。",
      "“迁化之后，住持徒众”与事件顺序和语法结构高度吻合，四个候选字分别对应四个方框。"
    ]
  },
  "06": {
    "title": "虽寓形岩穴",
    "corrected": "绝有待之累，〔虽〕寓形岩穴，高步京华",
    "mode": "ai_provisional",
    "confidence": "中",
    "analysis": [
      "“虽……高……”构成让步关系：虽然形体寄居山岩，其德望却高步京华。",
      "一个“虽”正好对应一个方框，并能连接前后两个语义层次。"
    ]
  },
  "07": {
    "title": "游方秉正与童蒙悟道",
    "corrected": "于昭大士，游〔方〕〔秉〕正，德润慈云。心悬灵镜。〔童〕蒙悟道",
    "mode": "ai_provisional",
    "confidence": "低",
    "analysis": [
      "“游方”是僧人参学弘法的常用语，“秉正”可承接大士德行；“童蒙悟道”又与禅师幼年即有入道志向相合。",
      "三字主要依据四言铭辞节奏和人物生平暂拟，仍存在其他可能，因此标为低置信度。"
    ]
  },
  "08": {
    "title": "禅心入定",
    "corrected": "行识非想，禅〔心〕〔入〕〔定〕。观尽三昧",
    "mode": "ai_provisional",
    "confidence": "低",
    "analysis": [
      "“入定”和“三昧”均为佛教禅修术语，“禅心入定，观尽三昧”保持四言铭辞节奏。",
      "“禅心入定”并非唯一可能形式，故标为低置信度AI候选。"
    ]
  },
  "09": {
    "title": "去兹尘俗与灵迹有凭",
    "corrected": "敦彼开导，去兹〔尘〕〔俗〕。〔灵〕迹有凭，群生仰福",
    "mode": "ai_provisional",
    "confidence": "低",
    "analysis": [
      "“去兹尘俗”表示离开尘世，与迁神净土的语境相合；“灵迹有凭”表示灵异事迹有所凭验。",
      "本例除在三个方框中补“尘、俗、灵”外，还将方框外疑似OCR误识的“绝”校作“迹”，以保证恢复后的句意完整。"
    ]
  },
  "10": {
    "title": "风火俱妄",
    "corrected": "风火〔俱〕妄，泡电同奔",
    "mode": "ai_provisional",
    "confidence": "高",
    "analysis": [
      "“风火俱妄”与“泡电同奔”形成结构整齐的四言对偶。",
      "“俱”与下句“同”相互照应，并恰好只占一个字位。"
    ]
  },
  "11": {
    "title": "刹那生灭与净域常存",
    "corrected": "刹那〔生〕〔灭〕，净域〔常〕〔存〕",
    "mode": "ai_provisional",
    "confidence": "中",
    "analysis": [
      "“刹那生灭”是佛教说明诸行无常的常用表达。",
      "“净域常存”与“刹那生灭”构成世间无常和净土恒常的对照，四个候选字使铭辞结构完整。"
    ]
  },
  "12": {
    "title": "欲乐永谢与永离重昏",
    "corrected": "〔欲〕乐永谢，〔永〕〔离〕重昏",
    "mode": "ai_provisional",
    "confidence": "中",
    "analysis": [
      "“欲乐”指欲界世俗之乐，“重昏”指层层无明。",
      "“欲乐永谢，永离重昏”延续净域解脱主题，并保持四言铭辞节奏。"
    ]
  }
}''')

          case_path = Path("data/work020_damage_cases.json")
          rows = json.loads(case_path.read_text(encoding="utf-8"))
          for row in rows:
              item = replacements[row["id"]]
              row["title"] = row["t"] = item["title"]
              row["corrected"] = row["c"] = item["corrected"]
              row["mode"] = item["mode"]
              row["confidence"] = item["confidence"]
              row["analysis"] = item["analysis"]
              row["candidate_count"] = row["square_count"]
              row["remaining_square_count"] = 0
              row["restoration_policy"] = "all_positions_have_ai_candidates"

          assert len(rows) == 12
          assert sum(r["square_count"] for r in rows) == 26
          assert sum(r["candidate_count"] for r in rows) == 26
          assert sum(r["remaining_square_count"] for r in rows) == 0
          assert all("□" not in r["corrected"] for r in rows)
          case_path.write_text(json.dumps(rows, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          report_path = Path("data/work020_coordinate_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          report["status"] = "all-damage-squares-filled-v3"
          report["candidate_count"] = 26
          report["remaining_square_count"] = 0
          report["classification_summary"] = {
              "documentary": [],
              "mixed": [],
              "ai_provisional": [f"{i:02d}" for i in range(1, 13)],
              "unresolved": []
          }
          report["restoration_policy"] = "all_positions_have_ai_candidates"
          report["coordinate_policy"] = "只使用现有逐页模型真实方框；AI恢复结果全部填入候选字，低置信度仅表示仍需人工复核。"
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          work = Path("js/work-020.js")
          text = work.read_text(encoding="utf-8")
          text = text.replace('const VERSION="20260724_huadusi_v2";', 'const VERSION="20260724_huadusi_v3";')
          text = text.replace('本栏目对原释文中的残损位置逐例释读。能够可靠判断者给出候选字；只能确定部分位置时，其余方框继续保留；现有证据不足时显示“暂未恢复”，不为追求句意完整而强行补字。', '本栏目保留原始识别中的“□”以呈现底稿残损情况，但在“AI暂拟补全”和“恢复后的上下文”中为每个方框填入候选字。置信度表示候选可靠程度，低置信度内容仍需结合拓片与文献继续复核。')
          work.write_text(text, encoding="utf-8")

          router = Path("js/damage_ai_reading.js")
          text = router.read_text(encoding="utf-8")
          text = text.replace("__DAMAGE_AI_READING_ROUTER_V59__", "__DAMAGE_AI_READING_ROUTER_V60__")
          text = text.replace("20260724_huadusi_v2", "20260724_huadusi_v3")
          router.write_text(text, encoding="utf-8")

          detail_patch = Path("js/detail_info_patch.js")
          text = detail_patch.read_text(encoding="utf-8")
          text = text.replace(
              'if(window.__DETAIL_INFO_STABLE_ENTRY_V13__)return;\n  window.__DETAIL_INFO_STABLE_ENTRY_V13__=true;',
              'if(window.__DETAIL_INFO_STABLE_ENTRY_V14__)return;\n  window.__DETAIL_INFO_STABLE_ENTRY_V14__=true;\n  window.__DETAIL_INFO_STABLE_ENTRY_V13__=true;'
          )
          text = text.replace("20260724_huadusi_v2", "20260724_huadusi_v3")
          detail_patch.write_text(text, encoding="utf-8")

          coord = Path("js/work-020-coordinate-adapter.js")
          text = coord.read_text(encoding="utf-8").replace("20260724_huadusi_v2", "20260724_huadusi_v3")
          coord.write_text(text, encoding="utf-8")

          detail = Path("detail.html")
          text = detail.read_text(encoding="utf-8").replace("20260724_huadusi_v2", "20260724_huadusi_v3")
          detail.write_text(text, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("data/work020_damage_cases.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/work020_coordinate_report.json").read_text(encoding="utf-8"))
          assert len(rows) == 12
          assert all("□" not in row["corrected"] for row in rows)
          assert sum(row["candidate_count"] for row in rows) == 26
          assert report["candidate_count"] == 26
          assert report["remaining_square_count"] == 0
          PY
          node --check js/work-020.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          node --check js/work-020-coordinate-adapter.js

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/work020-fill-all.yml
          git add data/work020_damage_cases.json data/work020_coordinate_report.json detail.html \
            js/work-020.js js/work-020-coordinate-adapter.js js/damage_ai_reading.js js/detail_info_patch.js
          git commit -m "Fill all work020 damage squares"
          git push
