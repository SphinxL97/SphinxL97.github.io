name: Patch shared work032 routes

on:
  push:
    branches:
      - agent/work032-xuzhenren
    paths:
      - .github/workflows/work032-shared-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work032-xuzhenren
          fetch-depth: 0
      - name: Patch and validate shared files
        shell: bash
        run: |
          python - <<'PY'

          from pathlib import Path
          import json, subprocess

          info = json.loads(Path("data/work032_info.json").read_text(encoding="utf-8"))

          catalog_path = Path("data/beitie_catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          for index, row in enumerate(catalog):
              if str(row.get("id")) == "032":
                  catalog[index] = info["catalog"]
                  break
          else:
              raise SystemExit("catalog missing 032")
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          header_path = Path("data/beitie_header_info.json")
          headers = json.loads(header_path.read_text(encoding="utf-8"))
          headers["032"] = info["header"]
          header_path.write_text(json.dumps(headers, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          router_path = Path("js/damage_ai_reading.js")
          router = router_path.read_text(encoding="utf-8")
          old = 'if(window.__DAMAGE_AI_READING_ROUTER_V70__)return;\n  window.__DAMAGE_AI_READING_ROUTER_V70__=true;'
          new = 'if(window.__DAMAGE_AI_READING_ROUTER_V71__)return;\n  window.__DAMAGE_AI_READING_ROUTER_V71__=true;\n  window.__DAMAGE_AI_READING_ROUTER_V70__=true;'
          if old not in router:
              raise SystemExit("router version anchor missing")
          router = router.replace(old, new, 1)
          anchor = '    "033":[{src:"js/work-033-coordinate-adapter.js?v=20260725_zhengzuowei_033_v1",key:"w033c",ready:()=>Boolean(window.__WORK_033_COORDINATE_ADAPTER__)},{src:"js/work-033.js?v=20260725_zhengzuowei_033_v1",key:"w033",ready:()=>Boolean(window.__WORK_033_STABLE_READY__&&window.__WORK_033_CROWDSOURCE_READY__)}]'
          route = '    "032":[{src:"js/work-032-coordinate-adapter.js?v=20260725_xuzhenren_032_v1",key:"w032c",ready:()=>Boolean(window.__WORK_032_COORDINATE_ADAPTER__)},{src:"js/work-032.js?v=20260725_xuzhenren_032_v1",key:"w032",ready:()=>Boolean(window.__WORK_032_STABLE_READY__&&window.__WORK_032_CROWDSOURCE_READY__)}],\n'
          if anchor not in router:
              raise SystemExit("router 033 anchor missing")
          router = router.replace(anchor, route + anchor, 1)
          router = router.replace('"030":"九成宫醴泉铭","033":"争座位帖"', '"030":"九成宫醴泉铭","032":"许真人井铭","033":"争座位帖"', 1)
          router = router.replace('"029","030","033"', '"029","030","032","033"', 1)
          router_path.write_text(router, encoding="utf-8")

          detail_path = Path("js/detail_info_patch.js")
          detail = detail_path.read_text(encoding="utf-8")
          old = 'if(window.__DETAIL_INFO_STABLE_ENTRY_V30__)return;\n  window.__DETAIL_INFO_STABLE_ENTRY_V30__=true;'
          new = 'if(window.__DETAIL_INFO_STABLE_ENTRY_V31__)return;\n  window.__DETAIL_INFO_STABLE_ENTRY_V31__=true;\n  window.__DETAIL_INFO_STABLE_ENTRY_V30__=true;'
          if old not in detail:
              raise SystemExit("detail version anchor missing")
          detail = detail.replace(old, new, 1)
          detail = detail.replace('data/beitie_header_info.json?v=20260725_zhengzuowei033_v1','data/beitie_header_info.json?v=20260725_xuzhenren032_v1',1)
          anchor = '  const work033DataUrl="data/work033_info.json?v=20260725_zhengzuowei_033_v1";'
          if anchor not in detail:
              raise SystemExit("detail work033 anchor missing")
          detail = detail.replace(anchor, '  const work032DataUrl="data/work032_info.json?v=20260725_xuzhenren_032_v1";\n'+anchor, 1)
          detail = detail.replace('20260725_global_route_recovery_v6','20260725_global_route_recovery_v7',1)
          detail = detail.replace('"029","030","033"', '"029","030","032","033"', 1)
          detail = detail.replace('"030":"九成宫醴泉铭","033":"争座位帖"', '"030":"九成宫醴泉铭","032":"许真人井铭","033":"争座位帖"', 1)
          detail = detail.replace('67,68,69]', '67,68,69,70]', 1)
          detail = detail.replace('const url=workId==="030"?work030DataUrl:(workId==="033"?work033DataUrl:dataUrl);','const url=workId==="030"?work030DataUrl:(workId==="032"?work032DataUrl:(workId==="033"?work033DataUrl:dataUrl));',1)
          detail = detail.replace('recordCache=["030","033"].includes(workId)?(data?.header||data?.[workId]||data):data?.[workId]||null;','recordCache=["030","032","033"].includes(workId)?(data?.header||data?.[workId]||data):data?.[workId]||null;',1)
          detail_path.write_text(detail, encoding="utf-8")

          html_path = Path("detail.html")
          html = html_path.read_text(encoding="utf-8")
          if "20260725_zhengzuowei033_v1" not in html:
              raise SystemExit("detail.html cache anchor missing")
          html = html.replace("20260725_zhengzuowei033_v1","20260725_xuzhenren032_v1")
          html_path.write_text(html, encoding="utf-8")

          for path in [
              "data/beitie_catalog.json",
              "data/beitie_header_info.json",
              "data/work032_damage_cases.json",
              "data/work032_coordinate_report.json",
              "data/work032_info.json",
          ]:
              json.loads(Path(path).read_text(encoding="utf-8"))

          cases = json.loads(Path("data/work032_damage_cases.json").read_text(encoding="utf-8"))
          report = json.loads(Path("data/work032_coordinate_report.json").read_text(encoding="utf-8"))
          if len(cases) != 14:
              raise SystemExit(f"expected 14 cases, got {len(cases)}")
          if sum(len(row.get("locations", [])) for row in cases) != 48:
              raise SystemExit("expected 48 located problem positions")
          if report.get("real_glyph_box_count") != 98:
              raise SystemExit("expected 98 real glyph boxes")
          if report.get("generated_bbox_count") or report.get("estimated_bbox_count"):
              raise SystemExit("fake coordinate count is nonzero")

          for script in ["js/work-032.js","js/work-032-coordinate-adapter.js","js/damage_ai_reading.js","js/detail_info_patch.js"]:
              subprocess.run(["node","--check",script],check=True)

          workflow = Path(".github/workflows/work032-shared-patch.yml")
          if workflow.exists():
              workflow.unlink()

          paths = [
              "data/beitie_catalog.json",
              "data/beitie_header_info.json",
              "js/damage_ai_reading.js",
              "js/detail_info_patch.js",
              "detail.html",
              ".github/workflows/work032-shared-patch.yml",
          ]
          subprocess.run(["git","add","--"] + paths,check=True)
          subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
          subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"],check=True)
          subprocess.run(["git","commit","-m","Wire work032 into shared detail routes"],check=True)
          subprocess.run(["git","push","origin","HEAD:agent/work032-xuzhenren"],check=True)

          PY
