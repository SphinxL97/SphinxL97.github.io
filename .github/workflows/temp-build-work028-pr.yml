name: Temporary build work028 on PR
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/build_work028.py
      - data/work028_raw_text.txt
      - .work028-build-trigger
jobs:
  build:
    if: github.head_ref == 'agent/work028-jintang-nine'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/work028-jintang-nine
          fetch-depth: 0
      - name: Skip if already built
        id: guard
        run: |
          if [ -f scripts/build_work028.py ] && [ -f data/work028_raw_text.txt ]; then
            echo 'run_build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_build=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install parser
        if: steps.guard.outputs.run_build == 'true'
        run: python -m pip install beautifulsoup4
      - name: Build 028
        if: steps.guard.outputs.run_build == 'true'
        run: python scripts/build_work028.py
      - name: Validate generated files
        if: steps.guard.outputs.run_build == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('data/work028_raw_text.txt').read_text(encoding='utf-8')
          full=Path('data/work028_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work028_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work028_coordinate_report.json').read_text(encoding='utf-8'))
          assert report['digital_pages']==91
          assert report['base_text_square_count']==raw.count('□')==report['model_square_count']==report['candidate_count']
          assert report['remaining_square_count']==0
          assert report['case_count']==len(cases)>0
          assert report['located_case_count']==len(cases) and report['unlocated_case_count']==0
          assert report['unresolved_case_count']==0
          assert report['column_four']['case_count']==len(cases)
          assert '□' not in full
          assert all('□' not in x['corrected'] and '□' not in x['current_context'] for x in cases)
          assert all(x.get('candidate') and '疑' not in x['candidate'] for x in cases)
          assert all(len(x.get('analysis',[]))>=3 for x in cases)
          assert all(x.get('locations') and x['locations'][0].get('bbox') for x in cases)
          files=sorted(Path('data/glyph_boxes/iiif/028').glob('page_*.json'))
          assert len(files)==91
          for i,p in enumerate(files,1):
              assert p.name==f'page_{i:04d}.json'
              json.loads(p.read_text(encoding='utf-8'))
          print({'squares':report['base_text_square_count'],'cases':len(cases),'documentary':report['documentary_case_count'],'ai_provisional':report['ai_provisional_case_count'],'model_rows':report['model_rows'],'coordinate_range':report['coordinate_range']})
          PY
          node --check js/work-028.js
          node --check js/work-028-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          grep -q 'js/work-028-coordinate-adapter.js?v=20260725_jintang_nine_v1' js/damage_ai_reading.js
          grep -q 'js/work-028.js?v=20260725_jintang_nine_v1' js/damage_ai_reading.js
          grep -q '"028":"晋唐小楷九种"' js/detail_info_patch.js
          grep -q '20260725_jintang_nine_v1' detail.html
          grep -q 'getBoundingClientRect' js/work-028.js
      - name: Remove temporary branch files
        if: steps.guard.outputs.run_build == 'true'
        run: |
          rm -f scripts/build_work028.py data/work028_raw_text.txt .work028-build-trigger
      - name: Commit generated 028 content
        if: steps.guard.outputs.run_build == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/beitie_catalog.json data/beitie_header_info.json data/page_images_index.json
          git add data/work028_full_text.txt data/work028_damage_cases.json data/work028_coordinate_report.json
          git add data/glyph_boxes/iiif/028 js/work-028.js js/work-028-coordinate-adapter.js
          git add js/damage_ai_reading.js js/detail_info_patch.js detail.html
          git add -u scripts/build_work028.py data/work028_raw_text.txt .work028-build-trigger
          git commit -m '完成028晋唐小楷九种专属内容与真实坐标'
          git push origin HEAD:agent/work028-jintang-nine
