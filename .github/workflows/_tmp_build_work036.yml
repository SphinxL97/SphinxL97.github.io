name: Temporary build work036

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'scripts/_tmp_build_work036.py'
      - '.github/workflows/_tmp_build_work036.yml'
  push:
    branches:
      - agent/work036-yiheming-v1
    paths:
      - 'scripts/_tmp_build_work036.py'
      - '.github/workflows/_tmp_build_work036.yml'

permissions:
  contents: write

jobs:
  build-test-commit:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/work036-yiheming-v1
          fetch-depth: 0

      - name: Audit work036 model coordinates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=json.loads(Path('data/model_boxes/glyph_model_border_036_040.json').read_text(encoding='utf-8'))
          rows=[r for r in rows if str(r.get('work_id'))=='036']
          rows.sort(key=lambda r:(int(r.get('canvas_index') or 0),int(r.get('order_in_page') or 0)))
          boxes=[r for r in rows if str(r.get('char') or '')=='□']
          out={
            'model_rows':len(rows),
            'pages':sorted(set(int(r['canvas_index']) for r in rows)),
            'page_row_counts':dict(sorted(Counter(int(r['canvas_index']) for r in rows).items())),
            'box_count':len(boxes),
            'box_rows':[{
              'index':i+1,
              'page':int(r['canvas_index']),
              'glyph_id':r['glyph_id'],
              'order_in_page':int(r.get('order_in_page') or 0),
              'bbox':{'x':r['x'],'y':r['y'],'w':r['w'],'h':r['h']},
              'before':rows[rows.index(r)-1]['char'] if rows.index(r)>0 else '',
              'after':rows[rows.index(r)+1]['char'] if rows.index(r)+1<len(rows) else ''
            } for i,r in enumerate(boxes)],
            'reading_sequence':' '.join(f"p{int(r['canvas_index']):04d}:{r.get('char','')}" for r in rows)
          }
          Path('/tmp/work036-model-diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'model_rows':out['model_rows'],'pages':len(out['pages']),'box_count':out['box_count'],'box_ids':[b['glyph_id'] for b in out['box_rows']]},ensure_ascii=False,indent=2))
          PY

      - name: Build work036 files
        run: python3 scripts/_tmp_build_work036.py

      - name: Upload model diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work036-model-diagnostic
          path: /tmp/work036-model-diagnostic.json

      - name: Validate generated data and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check js/work-036.js
          node --check js/work-036-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('data/work036_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads(Path('data/work036_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads(Path('data/work036_coordinate_report.json').read_text(encoding='utf-8'))
          index=json.loads(Path('data/page_images_index.json').read_text(encoding='utf-8'))
          assert text.count('□') == 23
          assert len(cases) == 13
          assert sum(len(c['slots']) for c in cases) == 23
          assert all(c['locations'] for c in cases)
          assert report['unbound_case_count'] == 0
          assert len(index['works']['036']['pages']) == 78
          assert any(p['has_char_boxes'] for p in index['works']['036']['pages'])
          assert '清代题记校读说明' not in Path('js/work-036.js').read_text(encoding='utf-8')
          assert '真实模型字框' not in Path('js/work-036.js').read_text(encoding='utf-8')
          assert 'title="${esc(loc.glyph_id' not in Path('js/work-036.js').read_text(encoding='utf-8')
          PY
          grep -F '__DAMAGE_AI_READING_ROUTER_V80__' js/damage_ai_reading.js
          grep -F '__DETAIL_INFO_STABLE_ENTRY_V40__' js/detail_info_patch.js
          grep -F '20260726_yiheming_036_v1' detail.html
          grep -F '《${TITLE}》第${page}页，对应问题字局部' js/work-036.js
          grep -F '拓片原图（局部）' js/work-036.js
          ! grep -F '恢复依据' js/work-036.js

      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Test rendered 036 page
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/work036-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            await page.goto('http://127.0.0.1:8000/detail.html?id=036',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.__WORK_036_STABLE_READY__===true,{timeout:30000});
            const result=await page.evaluate(()=>({
              title:document.title,
              transcriptBoxes:(document.querySelector('#calligraphy .full-transcript-body')?.innerText.match(/□/g)||[]).length,
              transcriptParagraphs:document.querySelectorAll('#calligraphy .full-transcript-body > p').length,
              transcriptHasVersionHeading:/水前本|水后本/.test(document.querySelector('#calligraphy .full-transcript-body')?.innerText||''),
              cases:document.querySelectorAll('#people .damage-tab').length,
              redBoxes:document.querySelectorAll('#people .work036-real-box').length,
              tooltipTitles:Array.from(document.querySelectorAll('#people .work036-real-box')).filter(node=>node.hasAttribute('title')).length,
              caption:document.querySelector('#people .damage-caption')?.textContent?.trim()||'',
              technicalText:/真实模型字框|恢复依据|glyph_id/.test(document.querySelector('#people')?.innerText||''),
              crowdReady:window.__WORK_036_CROWDSOURCE_READY__===true,
              coordReady:window.__WORK_036_COORDINATE_ADAPTER__===true
            }));
            if(result.transcriptBoxes!==23||result.transcriptParagraphs!==2||result.transcriptHasVersionHeading)throw new Error('transcript regression: '+JSON.stringify(result));
            if(result.cases!==13||result.redBoxes<1)throw new Error('case/red box regression: '+JSON.stringify(result));
            if(result.tooltipTitles!==0||result.technicalText)throw new Error('technical residue: '+JSON.stringify(result));
            if(!/^《瘗鹤铭》第\d+页，对应问题字局部$/.test(result.caption))throw new Error('caption mismatch: '+JSON.stringify(result));
            if(!result.crowdReady||!result.coordReady)throw new Error('shared module not ready: '+JSON.stringify(result));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          JS

      - name: Remove temporary files and commit final work036 changes
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_tmp_build_work036.py
          rm .github/workflows/_tmp_build_work036.yml
          rm -rf node_modules package-lock.json package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '完成036瘗鹤铭专属内容 [skip ci]'
          git push origin HEAD:agent/work036-yiheming-v1
