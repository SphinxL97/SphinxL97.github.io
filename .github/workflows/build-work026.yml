name: Build work026 Magushan

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: build-work026-magushan
  cancel-in-progress: true

jobs:
  build:
    if: github.head_ref == 'agent/work026-magushan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: agent/work026-magushan
          fetch-depth: 0

      - name: Build 026 dedicated content
        run: python3 scripts/build_work026.py

      - name: Validate 026 output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          text=(root/'data/work026_full_text.txt').read_text(encoding='utf-8')
          cases=json.loads((root/'data/work026_damage_cases.json').read_text(encoding='utf-8'))
          report=json.loads((root/'data/work026_coordinate_report.json').read_text(encoding='utf-8'))
          assert text.count('□') == 0
          assert text.count('?') == 0
          assert text.count('？') == 2
          assert cases == []
          assert report['digital_pages'] == 65
          assert report['damage_case_count'] == 0
          assert report['candidate_character_count'] == 0
          assert report['model_glyph_count'] > 0
          assert len(list((root/'data/glyph_boxes/iiif/026').glob('page_*.json'))) == 65
          assert report['column_four']['case_count'] == 0
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          node --check js/work-026.js
          node --check js/work-026-coordinate-adapter.js
          node --check js/damage_ai_reading.js
          node --check js/detail_info_patch.js

      - name: Remove one-off build files
        run: |
          rm -f scripts/build_work026.py
          rm -f .github/workflows/build-work026.yml

      - name: Commit generated work026 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete work026 Magushan dedicated content"
          git push origin HEAD:agent/work026-magushan
