<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>碑帖总览 · 碑帖智能读析平台（名称待定）</title>
<style>

:root{
  --paper:#f6f0e5;
  --paper2:#fbf8f1;
  --ink:#211b16;
  --muted:#74685b;
  --line:#ded2c2;
  --red:#9f3025;
  --red2:#7c231b;
  --green:#5aa66b;
  --shadow:0 18px 52px rgba(52,35,20,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Microsoft YaHei","Noto Sans SC",Arial,sans-serif;color:var(--ink);background:var(--paper);}
a{text-decoration:none;color:inherit}
button,input{font:inherit}
.topline{
  height:68px;
  padding:0 56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:30px;
  background:rgba(246,240,229,.96);
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 6px 24px rgba(50,34,20,.06);
}
.site-name{
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
  min-width:300px;
}
.seal{
  width:36px;height:36px;border:1.5px solid var(--red);border-radius:50%;
  color:var(--red);display:grid;place-items:center;font-family:"SimSun",serif;font-weight:800;
}
.name-main{font-size:19px;font-weight:900;letter-spacing:.03em}
.name-sub{font-size:13px;color:var(--muted);margin-left:2px}
.topnav{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:32px;
  font-size:16px;
  white-space:nowrap;
}
.topnav a{padding:22px 0 18px;border-bottom:2px solid transparent}
.topnav a:hover{color:var(--red);border-bottom-color:var(--red)}
@media(max-width:860px){
  .topline{height:auto;align-items:flex-start;flex-direction:column;padding:12px 20px;gap:6px}
  .site-name{min-width:0}
  .topnav{width:100%;overflow:auto;justify-content:flex-start;gap:22px;padding-bottom:4px;font-size:14px}
}

body{background:#f6f7f8}
.gallery-hero{
  position:relative;
  min-height:280px;
  background:#161616;
  overflow:hidden;
  display:grid;
  place-items:center;
  color:#fff;
}
.gallery-hero:before{
  content:"";
  position:absolute;inset:0;
  background-image:url('assets/beitie/001_daoyin/images/0020_二十.jpg');
  background-size:cover;
  background-position:center 42%;
  filter:grayscale(1) contrast(1.15);
  transform:scale(1.05);
  opacity:.52;
}
.gallery-hero:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.52)),radial-gradient(circle at center,rgba(64,94,70,.35),transparent 42%);
}
.hero-center{position:relative;z-index:2;text-align:center;width:min(1000px,calc(100% - 40px));padding-top:18px}
.hero-center h1{font-family:"SimSun","Songti SC",serif;font-size:42px;margin:0 0 18px;letter-spacing:.12em}
.gallery-search{height:54px;background:#fff;display:flex;border-radius:2px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.gallery-search input{flex:1;min-width:0;border:0;outline:none;padding:0 20px;font-size:16px}
.gallery-search button{width:86px;border:0;background:#5aa66b;color:#fff;font-weight:900;font-size:18px;cursor:pointer}
.gallery-search button:hover{background:#4d965d}

.filter-panel{
  background:#fff;
  border-bottom:1px solid #e7e7e7;
  box-shadow:0 8px 20px rgba(0,0,0,.04);
}
.filter-inner{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:18px 0 16px}
.filter-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:10px;
}
.filter-toolbar strong{font-size:15px;color:#333}
.clear-filters{
  border:0;
  background:transparent;
  color:#4b8f58;
  cursor:pointer;
  padding:4px 0;
  font-size:13px;
}
.clear-filters:hover{text-decoration:underline}
.filter-row{display:flex;align-items:flex-start;gap:10px;margin:8px 0}
.filter-row b{width:78px;flex:0 0 78px;text-align:right;margin-right:8px;color:#333;font-size:14px;line-height:30px}
.chip-list{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.chip{
  appearance:none;
  border:1px solid #e5e7ea;
  background:#f3f4f5;
  color:#4e5560;
  padding:5px 11px;
  min-height:30px;
  border-radius:3px;
  cursor:pointer;
  font-size:13px;
  line-height:18px;
  transition:.15s ease;
}
.chip:hover{border-color:#b9d8bf;color:#337943;background:#f0f9f2}
.chip.active{background:#e8f7ea;color:#2f8b43;border-color:#cae7d0}
.chip.more-toggle{background:#fff;color:#777;border-style:dashed}
.filter-row.is-collapsed .chip.optional{display:none}
.filter-note{
  margin:12px 0 0 96px;
  color:#8a8178;
  font-size:12px;
  line-height:1.7;
}
.results-bar{width:min(1120px,calc(100% - 40px));margin:28px auto 16px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.results-bar h2{font-size:18px;margin:0}
.sort-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sort-tools button{
  font-size:13px;
  background:#fff;
  border:1px solid #e6e6e6;
  padding:6px 11px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  cursor:pointer;
  color:#555;
}
.sort-tools button.active{border-color:#b9d8bf;background:#edf8ef;color:#327b40}
.gallery-grid{
  width:min(1120px,calc(100% - 40px));
  margin:0 auto 60px;
  display:grid;
  grid-template-columns:repeat(4,230px);
  gap:24px 36px;
  justify-content:center;
  align-items:start;
}
.beitie-card{
  display:block;
  width:230px;
  min-width:230px;
  max-width:230px;
  background:#fff;
  border:1px solid #e4e7eb;
  box-shadow:0 8px 22px rgba(20,30,40,.09);
  transition:.18s ease;
  min-height:430px;
  overflow:hidden;
}
.beitie-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,30,40,.14)}
.thumb{
  width:100%;
  height:330px;
  padding:14px 14px 0;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  background:#fff;
  position:relative;
  overflow:hidden;
}
.thumb img{
  width:100%;
  height:310px;
  max-width:100%;
  max-height:310px;
  object-fit:contain;
  display:block;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  background:#fff;
}
.ribbon{
  position:absolute;right:12px;top:12px;
  background:#e65c5c;color:#fff;font-size:12px;
  padding:3px 7px;
  transform:rotate(45deg) translate(18px,-2px);
  transform-origin:center;
}
.card-info{padding:12px 16px 16px;min-height:96px}
.card-info h3{margin:0 0 8px;font-family:"SimSun","Songti SC",serif;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.meta{font-size:13px;color:#777;display:flex;gap:10px;flex-wrap:wrap;min-height:38px;align-content:flex-start}
.meta .ready{color:#1a8f41}
.card-disabled{cursor:default}
.card-disabled:hover{transform:none}
.empty-results{
  grid-column:1/-1;
  width:100%;
  min-height:180px;
  display:grid;
  place-items:center;
  background:#fff;
  border:1px dashed #d8d8d8;
  color:#7d7d7d;
  font-size:15px;
  padding:30px;
}
@media(max-width:1100px){.gallery-grid{grid-template-columns:repeat(3,230px)}}
@media(max-width:780px){
  .gallery-grid{grid-template-columns:repeat(2,230px);gap:18px;justify-content:center}
  .filter-row{display:block}
  .filter-row b{display:block;width:auto;text-align:left;margin:0 0 6px;line-height:22px}
  .filter-note{margin-left:0}
  .results-bar{align-items:flex-start;flex-direction:column}
  .sort-tools{justify-content:flex-start}
}
@media(max-width:520px){
  .gallery-grid{grid-template-columns:230px;justify-content:center}
  .thumb{height:330px}
  .thumb img{height:310px;max-height:310px}
  .hero-center h1{font-size:34px}
  .gallery-search input{font-size:14px;padding:0 12px}
  .gallery-search button{width:66px}
}

.ribbon{display:none!important}
</style>
</head>
<body>
<header class="topline">
  <a class="site-name" href="index.html">
    <span class="seal">拓</span>
    <span class="name-main">碑帖智能读析平台</span>
    <span class="name-sub">名称待定</span>
  </a>
  <nav class="topnav">
    <a href="gallery.html">碑帖总览</a>
    <a href="people.html">人物关系（待定）</a>
    <a href="ai-gallery.html">AI配图（待定）</a>
    <a href="help.html">帮助说明（待定）</a>
  </nav>
</header>
<section class="gallery-hero">
  <div class="hero-center">
    <h1>碑帖总览</h1>
    <div class="gallery-search">
      <input id="gallerySearch" placeholder="输入题名、异名、朝代、年号、地点、书体、撰文者、书写者或主题">
      <button id="gallerySearchButton" type="button">搜</button>
    </div>
  </div>
</section>
<section class="filter-panel">
  <div class="filter-inner">
    <div class="filter-toolbar">
      <strong>组合筛选</strong>
      <button id="clearFilters" class="clear-filters" type="button">清除全部</button>
    </div>
    <div id="filterRows"></div>
    <p class="filter-note">
      高级筛选依据首批33件已整理碑帖元数据建立；责任者待考或分件待核的作品，不纳入“撰文者、书写者”筛选，但仍可按题名、类型、朝代、书体、版本和主题检索。
    </p>
  </div>
</section>
<div class="results-bar">
  <h2>检索结果：<span id="countText">33</span></h2>
  <div class="sort-tools">
    <button class="active" type="button" data-sort-value="default">默认排序</button>
    <button type="button" data-sort-value="year-asc">年代从早到晚</button>
    <button type="button" data-sort-value="year-desc">年代从晚到早</button>
  </div>
</div>
<main class="gallery-grid" id="galleryGrid"></main>
<script src="js/gallery.js?v=2026062701"></script>
<script src="js/gallery-search.js?v=20260727_writer_normalize_v1"></script>
</body>
</html>
